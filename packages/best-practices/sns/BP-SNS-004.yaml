id: BP-SNS-004
title: "SNS topic policy must not allow unconditional public access"
severity: CRITICAL
resource_type: "AWS::SNS::Topic"
property_path: "TopicPolicy"
check_type: "policy_antipattern"
expected_value: "wildcard-principal-no-condition"
source: "FSBP"
source_id: "SNS.2"
description: "An SNS topic's inline TopicPolicy must not grant public access without a Condition clause. A statement with `Principal: '*'` (or `Principal: { AWS: '*' }`) and no Condition trusts every AWS account and every anonymous caller — any party can subscribe to the topic and exfiltrate every message, or flood publishers. Condition-guarded wildcards (e.g. `Principal: '*'` + `Condition: { StringEquals: { 'aws:SourceAccount': '...' } }` or `'aws:SourceArn'`) are the canonical cross-account / cross-service trust shape and are NOT flagged."
remediation: "List specific account / service / IAM principals under Principal, or keep `Principal: '*'` and add a Condition that constrains access by `aws:SourceAccount`, `aws:SourceArn`, `aws:SourceOrgID`, VPC endpoint, or similar source-identity attribute. Never publish a topic policy with wildcard Principal and no Condition."
consequence: "Any AWS account or anonymous caller can subscribe to the topic and receive every message published — notification data leaks and attackers can publish spam into your consumer pipeline."
category: security
lastVerified: "2026-04-23"
