id: BP-SNS-003
title: "SNS topic policy must not grant wildcard Resource"
severity: HIGH
resource_type: "AWS::SNS::Topic"
property_path: "TopicPolicy"
check_type: "policy_antipattern"
expected_value: "wildcard-resource"
source: "FSBP"
source_id: "SNS.3"
description: "An SNS topic's inline TopicPolicy must not contain Allow statements with `Resource: '*'` (or `Resource: ['*']`). A wildcard Resource grants the named Action against every SNS topic in the account, not just the topic the policy is attached to — the statement's intended scope silently expands to the whole service. Use specific topic ARNs (including array form for multi-topic grants) to keep the grant scoped."
remediation: "Replace `Resource: '*'` with the explicit topic ARN (or an array of topic ARNs) the statement is meant to grant on. For multi-topic grants, list each ARN rather than broadening to `*`. If a genuinely cross-topic grant is required, split the policy into per-topic statements so intent remains auditable."
consequence: "The statement grants its Action against every SNS topic in the account — any principal it applies to can publish, subscribe, or modify topics you never intended to include in the grant."
category: security
lastVerified: "2026-04-23"
