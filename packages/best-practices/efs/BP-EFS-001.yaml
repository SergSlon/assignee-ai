id: BP-EFS-001
title: "EFS file system should have encryption at rest enabled"
severity: CRITICAL
resource_type: "AWS::EFS::FileSystem"
property_path: "Encrypted"
check_type: "equals"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "EFS.1"
description: "EFS file systems must have encryption at rest enabled. Without encryption, file system data is stored unencrypted on AWS-managed disks and a compromised storage layer would expose every file in plaintext."
remediation: "Set Encrypted to true. EFS uses the AWS-managed key (aws/elasticfilesystem) for free unless you supply a customer-managed KMS key via KmsKeyId. This property is createOnly — it cannot be changed on an existing file system, so any fix creates a replacement and triggers a data migration."
consequence: "Data at rest is stored unencrypted — a compromised storage layer or misconfigured grant exposes every file in plaintext, violating PCI DSS, HIPAA, SOC 2, and ISO 27001."
category: security
lastVerified: "2026-04-08"
blocking: true
autoFixable: true
desiredStatePatch:
  Encrypted: true
