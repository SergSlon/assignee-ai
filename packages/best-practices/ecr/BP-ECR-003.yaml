id: BP-ECR-003
title: "ECR repository should have lifecycle policy configured"
severity: MEDIUM
resource_type: "AWS::ECR::Repository"
property_path: "LifecyclePolicy"
check_type: "exists"
expected_value: true
source: "FSBP"
source_id: "ECR.3"
description: "ECR repositories should have lifecycle policies to automatically remove old or untagged images. Without lifecycle policies, storage costs grow unbounded as images accumulate."
remediation: "Configure a LifecyclePolicy to expire images based on count or age. Common patterns include keeping only the last N tagged images and removing untagged images after a set period."
category: cost_optimization
lastVerified: "2026-03-24"
