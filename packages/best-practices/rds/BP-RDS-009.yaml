id: BP-RDS-009
title: "RDS instance should have copy tags to snapshots enabled"
severity: MEDIUM
resource_type: "AWS::RDS::DBInstance"
property_path: "CopyTagsToSnapshot"
check_type: "equals"
expected_value: true
source: "FSBP"
