id: BP-RDS-014
title: "RDS single-AZ instance should be evaluated for Multi-AZ"
severity: HIGH
resource_type: "AWS::RDS::DBInstance"
property_path: "MultiAZ"
check_type: "equals"
expected_value: true
source: "TrustedAdvisor"
source_id: "TA-rds-single-az"
description: "Trusted Advisor identifies Single-AZ RDS instances in production accounts. Single-AZ deployments have no automatic failover, resulting in extended downtime during infrastructure failures."
remediation: "Enable Multi-AZ for production databases. Multi-AZ provides automatic failover with minimal downtime. For non-production, document the acceptance of Single-AZ risk."
consequence: "A single AZ failure takes down production with no failover — expect extended downtime and potential data loss."
category: reliability
lastVerified: "2026-03-24"
skip_when_advisory:
  - RDS_ENVIRONMENT_TIER_DEFAULTS
