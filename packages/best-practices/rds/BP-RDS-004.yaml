id: BP-RDS-004
title: "RDS instance should have deletion protection enabled"
severity: HIGH
resource_type: "AWS::RDS::DBInstance"
property_path: "DeletionProtection"
check_type: "equals"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "RDS.8"
description: "RDS DB instances should have deletion protection enabled to prevent accidental or unauthorized deletion. This acts as a safeguard against data loss from human error or compromised credentials."
remediation: "Set DeletionProtection to true. This prevents the instance from being deleted via the API or console until deletion protection is explicitly disabled."
category: reliability
lastVerified: "2026-03-22"
autoFixable: true
desiredStatePatch:
  DeletionProtection: true
