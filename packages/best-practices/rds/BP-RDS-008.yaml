id: BP-RDS-008
title: "RDS instance should have IAM database authentication enabled"
severity: HIGH
resource_type: "AWS::RDS::DBInstance"
property_path: "EnableIAMDatabaseAuthentication"
check_type: "equals"
expected_value: true
source: "FSBP"
source_id: "RDS.10"
description: "RDS instances should use IAM database authentication instead of password-only auth. IAM auth provides token-based access with automatic rotation, eliminating the need to manage database passwords."
remediation: "Set EnableIAMDatabaseAuthentication to true. Update application connection strings to use IAM authentication tokens."
consequence: "Database passwords are static and long-lived — a leaked password grants indefinite access with no automatic rotation."
category: security
lastVerified: "2026-03-24"
autoFixable: true
desiredStatePatch:
  EnableIAMDatabaseAuthentication: true
