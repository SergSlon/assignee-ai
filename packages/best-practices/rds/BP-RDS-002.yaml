id: BP-RDS-002
title: "RDS instance should have encryption at rest enabled"
severity: CRITICAL
resource_type: "AWS::RDS::DBInstance"
property_path: "StorageEncrypted"
check_type: "equals"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "RDS.3"
description: "RDS DB instances must have encryption at rest enabled using AWS KMS. Unencrypted database storage exposes data to unauthorized access if the underlying storage media is compromised."
remediation: "Set StorageEncrypted to true and specify a KmsKeyId. Note: encryption cannot be enabled on an existing unencrypted instance — you must create an encrypted snapshot and restore from it."
category: security
lastVerified: "2026-03-22"
blocking: true
autoFixable: true
desiredStatePatch:
  StorageEncrypted: true
