id: BP-RDS-006
title: "RDS instance should have Multi-AZ deployment enabled"
severity: HIGH
resource_type: "AWS::RDS::DBInstance"
property_path: "MultiAZ"
check_type: "equals"
expected_value: true
source: "FSBP"
source_id: "RDS.5"
description: "Production RDS instances should use Multi-AZ deployments for high availability. Multi-AZ provides automatic failover to a standby instance in a different AZ during infrastructure failures."
remediation: "Set MultiAZ to true. Note: enabling Multi-AZ may increase costs and can cause a brief availability impact during modification."
category: reliability
lastVerified: "2026-03-24"
