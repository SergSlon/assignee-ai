id: BP-RDS-007
title: "RDS instance should have enhanced monitoring enabled"
severity: MEDIUM
resource_type: "AWS::RDS::DBInstance"
property_path: "MonitoringInterval"
check_type: "greater_than"
expected_value: 0
source: "FSBP"
source_id: "RDS.6"
description: "RDS instances should have enhanced monitoring enabled for real-time OS metrics. Basic CloudWatch monitoring only provides database-level metrics at 1-minute intervals, missing OS-level issues."
remediation: "Set MonitoringInterval to 1, 5, 10, 15, 30, or 60 seconds. Create or use an existing IAM role for enhanced monitoring."
category: performance
lastVerified: "2026-03-24"
fixType: "interactive"
interactiveOptions:
  - label: "Set monitoring interval"
    action: "prompt_value"
    targetField: "MonitoringInterval"
