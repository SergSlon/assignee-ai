id: BP-S3-001
title: "S3 bucket should block public ACLs"
severity: CRITICAL
resource_type: "AWS::S3::Bucket"
property_path: "PublicAccessBlockConfiguration.BlockPublicAcls"
check_type: "equals"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "S3.1"
description: "S3 buckets must have BlockPublicAcls enabled to prevent public ACL grants. Public ACLs can expose bucket contents to the internet, leading to data breaches."
remediation: "Set PublicAccessBlockConfiguration.BlockPublicAcls to true. Apply at both account and bucket level for defense in depth."
category: security
lastVerified: "2026-03-22"
blocking: true
