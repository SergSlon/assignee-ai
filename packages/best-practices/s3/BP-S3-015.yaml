id: BP-S3-015
title: "S3 bucket should have cross-region replication enabled"
severity: MEDIUM
resource_type: "AWS::S3::Bucket"
property_path: "ReplicationConfiguration"
check_type: "exists"
expected_value: true
source: "FSBP"
source_id: "S3.7"
description: "S3 buckets storing critical data should have cross-region replication configured for disaster recovery. Replication ensures data availability even if an entire AWS region becomes unavailable."
remediation: "Configure ReplicationConfiguration with at least one rule targeting a bucket in a different region. Requires versioning to be enabled on both source and destination buckets."
fix_hint: "Configure cross-region replication (requires versioning)"
category: reliability
lastVerified: "2026-03-24"
triggers:
  - excludePatterns: ["static-website"]
