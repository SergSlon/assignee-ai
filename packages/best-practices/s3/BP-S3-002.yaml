id: BP-S3-002
title: "S3 bucket should block public bucket policies"
severity: CRITICAL
resource_type: "AWS::S3::Bucket"
property_path: "PublicAccessBlockConfiguration.BlockPublicPolicy"
check_type: "equals"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "S3.1"
description: "S3 buckets must have BlockPublicPolicy enabled to reject bucket policies that grant public access. Without this, a misconfigured policy can expose the entire bucket."
remediation: "Set PublicAccessBlockConfiguration.BlockPublicPolicy to true. This prevents any bucket policy from granting public access."
consequence: "A single misconfigured bucket policy can expose every object in the bucket to the entire internet."
category: security
lastVerified: "2026-03-22"
blocking: true
autoFixable: true
desiredStatePatch:
  PublicAccessBlockConfiguration:
    BlockPublicPolicy: true
