id: BP-S3-003
title: "S3 bucket should ignore public ACLs"
severity: CRITICAL
resource_type: "AWS::S3::Bucket"
property_path: "PublicAccessBlockConfiguration.IgnorePublicAcls"
check_type: "equals"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "S3.1"
description: "S3 buckets must have IgnorePublicAcls enabled so that any existing public ACLs on the bucket or objects are ignored. This neutralizes legacy public ACL grants."
remediation: "Set PublicAccessBlockConfiguration.IgnorePublicAcls to true. This overrides any existing public ACL grants on the bucket and its objects."
category: security
lastVerified: "2026-03-22"
blocking: true
autoFixable: true
desiredStatePatch:
  PublicAccessBlockConfiguration:
    IgnorePublicAcls: true
