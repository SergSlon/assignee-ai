id: BP-S3-013
title: "S3 bucket should block public policy"
severity: CRITICAL
resource_type: "AWS::S3::Bucket"
property_path: "PublicAccessBlockConfiguration.BlockPublicPolicy"
check_type: "equals"
expected_value: true
source: "FSBP"
source_id: "S3.1"
description: "S3 buckets must have BlockPublicPolicy enabled to prevent bucket policies that grant public access. A single misconfigured policy can expose all bucket contents."
remediation: "Set PublicAccessBlockConfiguration.BlockPublicPolicy to true."
category: security
lastVerified: "2026-03-24"
autoFixable: true
desiredStatePatch:
  PublicAccessBlockConfiguration:
    BlockPublicPolicy: true
