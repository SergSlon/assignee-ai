id: BP-S3-011
title: "S3 bucket policy must deny non-SSL requests"
severity: HIGH
resource_type: "AWS::S3::BucketPolicy"
property_path: "PolicyDocument"
check_type: "policy_antipattern"
expected_value: "missing-secure-transport-deny"
source: "FSBP"
source_id: "S3.5"
description: "An S3 bucket policy must contain a Deny statement that rejects non-HTTPS requests via `Condition: { Bool: { 'aws:SecureTransport': 'false' } }`. Without it, plaintext HTTP requests to the bucket succeed and data in transit can be intercepted, read, or modified by network attackers. The Deny must target `s3:*` (or broader) on wildcard Principal to close the gap for every caller — a narrow Principal leaves unprotected callers."
remediation: "Add a Deny statement to the bucket policy: `{ Effect: 'Deny', Principal: '*', Action: 's3:*', Resource: [<bucket-arn>, <bucket-arn>/*], Condition: { Bool: { 'aws:SecureTransport': 'false' } } }`. The condition evaluates to true for HTTP requests, triggering the Deny and returning an access-denied response to the client."
consequence: "Data in transit is sent over plaintext HTTP — network attackers on the path can intercept, read, and modify objects mid-flight."
fix_hint: "Add bucket policy to deny non-HTTPS requests"
category: security
lastVerified: "2026-04-23"
triggers:
  - excludePatterns: ["static-website"]
