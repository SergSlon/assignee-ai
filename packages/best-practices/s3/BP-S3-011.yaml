id: BP-S3-011
title: "S3 bucket should enforce SSL-only requests"
severity: HIGH
resource_type: "AWS::S3::Bucket"
property_path: "BucketPolicy.Statement"
check_type: "awareness"
expected_value: true
source: "FSBP"
source_id: "S3.5"
description: "S3 buckets should have a bucket policy that denies non-SSL requests. Without enforcing SSL, data in transit can be intercepted by network attackers."
remediation: "Add a bucket policy with a Condition of aws:SecureTransport=false to deny all non-SSL requests."
fix_hint: "Add bucket policy to deny non-HTTPS requests"
category: security
lastVerified: "2026-03-24"
triggers:
  - excludePatterns: ["static-website"]
