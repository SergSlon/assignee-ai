id: BP-S3-012
title: "S3 bucket should have object lock enabled"
severity: MEDIUM
resource_type: "AWS::S3::Bucket"
property_path: "ObjectLockEnabled"
check_type: "equals"
expected_value: true
source: "FSBP"
source_id: "S3.15"
description: "S3 buckets storing compliance-critical data should have Object Lock enabled to prevent accidental or malicious deletion of objects during the retention period."
remediation: "Enable Object Lock at bucket creation time. Object Lock cannot be enabled on existing buckets — create a new bucket with Object Lock enabled and migrate data."
category: compliance
lastVerified: "2026-03-24"
