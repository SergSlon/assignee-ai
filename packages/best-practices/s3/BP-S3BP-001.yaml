id: BP-S3BP-001
title: "S3 BucketPolicy must not grant wildcard Principal without aws:SourceArn condition"
severity: CRITICAL
resource_type: "AWS::S3::BucketPolicy"
property_path: "PolicyDocument"
check_type: "policy_antipattern"
expected_value: "wildcard-principal"
source: "AWS Well-Architected — Security"
source_id: "SEC-S3BP-001"
description: "An S3 BucketPolicy with Principal: '*' or Principal: {AWS: '*'} inside an Allow statement effectively grants the action to the entire internet UNLESS the same statement has a tight Condition block that restricts access (aws:SourceArn, aws:SourceVpc, aws:PrincipalOrgID, etc.). Wildcard principals with no condition are the #1 cause of public S3 data leaks. This rule fires on any Allow statement whose Principal contains a wildcard without a paired restrictive condition — the policy_antipattern check_type inspects the full document via policy-inspector.ts."
remediation: "EITHER narrow the Principal to specific IAM ARNs / service principals (cloudfront.amazonaws.com, etc.), OR keep the wildcard and add a Condition block that restricts access. For CloudFront OAC read grants, use Principal: {Service: 'cloudfront.amazonaws.com'} with Condition: {StringEquals: {aws:SourceArn: '<distribution-arn>'}} — the static-website compound pattern does this automatically."
consequence: "A wildcard Principal paired with s3:GetObject and no Condition exposes every object in the bucket to the internet — the canonical S3 data-breach shape. Automated scanners find these within hours."
category: security
lastVerified: "2026-04-09"
blocking: true
fixType: interactive
interactiveOptions:
  - label: "Keep current policy as-is (NOT RECOMMENDED — wildcard principal without condition)"
    action: "skip"
  - label: "Remove the wildcard-principal statement entirely (safe but drops grants)"
    action: "remove_property"
    targetField: "PolicyDocument.Statement"
