id: BP-S3-007
title: "S3 bucket should have lifecycle configuration"
severity: MEDIUM
resource_type: "AWS::S3::Bucket"
property_path: "LifecycleConfiguration"
check_type: "exists"
expected_value: true
source: "AWS Well-Architected Framework — Cost Optimization Pillar"
description: "S3 buckets should have lifecycle rules to transition objects to cheaper storage classes and expire old data. Without lifecycle rules, storage costs grow unbounded."
remediation: "Add a LifecycleConfiguration with rules to transition objects to S3 Infrequent Access after 30 days, Glacier after 90 days, and expire after 365 days. Adjust thresholds to your data retention requirements."
category: cost
lastVerified: "2026-03-22"
