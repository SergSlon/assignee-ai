id: BP-S3-014
title: "S3 bucket should restrict public bucket policies"
severity: CRITICAL
resource_type: "AWS::S3::Bucket"
property_path: "PublicAccessBlockConfiguration.RestrictPublicBuckets"
check_type: "equals"
expected_value: true
source: "FSBP"
source_id: "S3.1"
description: "S3 buckets must have RestrictPublicBuckets enabled. This prevents access to buckets with public policies from being granted to any AWS account other than the bucket owner's account."
remediation: "Set PublicAccessBlockConfiguration.RestrictPublicBuckets to true."
category: security
lastVerified: "2026-03-24"
autoFixable: true
desiredStatePatch:
  PublicAccessBlockConfiguration:
    RestrictPublicBuckets: true
