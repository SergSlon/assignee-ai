id: BP-DYNAMODB-004
title: "DynamoDB table should have deletion protection enabled"
severity: HIGH
resource_type: "AWS::DynamoDB::Table"
property_path: "DeletionProtectionEnabled"
check_type: "equals"
expected_value: true
source: "FSBP"
source_id: "DynamoDB.6"
description: "DynamoDB tables should have deletion protection enabled to prevent accidental table deletion. Deleted tables cannot be recovered, causing permanent data loss."
remediation: "Set DeletionProtectionEnabled to true. This prevents the table from being deleted via the console, CLI, or API until the protection is explicitly disabled."
category: reliability
lastVerified: "2026-03-24"
fixType: "auto"
autoFixable: true
desiredStatePatch:
  DeletionProtectionEnabled: true
