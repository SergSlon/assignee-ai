# RUNTIME-ONLY RULE — unreachable from CLI plan-time evaluation.
# This rule requires multi-day CloudWatch throughput metrics (capacity utilization
# < 50% consistently) that are unavailable at plan time. It is informational only
# and will never fire during `assignee plan`. Kept in the registry as documentation;
# excluded from the plan-time reachable count. (F021, full-audit-2026-05-02)
id: BP-DYNAMODB-006
title: "DynamoDB table should have on-demand or auto-scaled capacity"
severity: INFO
resource_type: "AWS::DynamoDB::Table"
property_path: "BillingMode"
check_type: "awareness"
expected_value: true
source: "TrustedAdvisor"
source_id: "TA-dynamodb-capacity"
description: "Trusted Advisor identifies DynamoDB tables with provisioned capacity that consistently use less than 50% of their provisioned throughput. This represents wasted capacity costs. Epic 98 W5.P1: severity normalised MEDIUM → INFO because the check requires multi-day CloudWatch throughput metrics the plan-time evaluator cannot access — the rule is informational until the table has accumulated usage data."
remediation: "Switch to PAY_PER_REQUEST billing mode for unpredictable workloads, or configure auto-scaling policies to match capacity to actual usage."
consequence: "Over 50% of provisioned throughput is wasted — you are paying double what the actual usage requires every month."
category: cost
lastVerified: "2026-04-23"
