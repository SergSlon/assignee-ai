id: BP-CWA-001
title: "CloudWatch alarm should have OKActions configured"
severity: MEDIUM
resource_type: "AWS::CloudWatch::Alarm"
property_path: "OKActions"
check_type: "exists"
expected_value: true
source: "FSBP"
source_id: "CloudWatch.1"
description: "CloudWatch alarms should have OKActions configured to notify when the alarm returns to OK state. Without OKActions, operators are alerted about issues but not when they resolve, causing confusion."
remediation: "Add at least one SNS topic ARN to OKActions to receive notifications when the alarm returns to OK state."
category: reliability
lastVerified: "2026-03-24"
