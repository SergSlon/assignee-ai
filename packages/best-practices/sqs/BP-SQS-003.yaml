id: BP-SQS-003
title: "SQS queue should have server-side encryption with KMS"
severity: HIGH
resource_type: "AWS::SQS::Queue"
property_path: "KmsMasterKeyId"
check_type: "exists"
expected_value: true
source: "FSBP"
source_id: "SQS.1"
description: "SQS queues should use KMS server-side encryption to protect message contents at rest. Without encryption, messages stored in the queue can be read if underlying storage is accessed."
remediation: "Set KmsMasterKeyId to a KMS key ARN or alias for encryption at rest. Use 'alias/aws/sqs' for the default AWS managed key."
category: security
lastVerified: "2026-03-24"
