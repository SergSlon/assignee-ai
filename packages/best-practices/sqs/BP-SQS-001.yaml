id: BP-SQS-001
title: "SQS queue should have server-side encryption enabled"
severity: HIGH
resource_type: "AWS::SQS::Queue"
property_path: "SqsManagedSseEnabled"
check_type: "equals"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "SQS.1"
description: "SQS queues should have server-side encryption enabled to protect message contents at rest. Unencrypted queues expose message data if the underlying storage is compromised."
remediation: "Set SqsManagedSseEnabled to true for SSE-SQS encryption, or specify KmsMasterKeyId for SSE-KMS encryption with a customer managed key for additional control."
category: security
lastVerified: "2026-03-22"
