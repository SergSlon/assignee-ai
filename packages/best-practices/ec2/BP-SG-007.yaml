id: BP-SG-007
title: "Security group should not allow unrestricted ingress on high-risk ports"
severity: HIGH
resource_type: "AWS::EC2::SecurityGroup"
property_path: "SecurityGroupIngress"
check_type: "awareness"
expected_value: true
source: "TrustedAdvisor"
source_id: "HCP4007jGY"
description: "Trusted Advisor flags security groups allowing unrestricted access (0.0.0.0/0) on high-risk ports including 20, 21, 1433, 1434, 3306, 3389, 4333, 5432, 5500. These ports expose databases and admin interfaces to the internet."
remediation: "Restrict ingress rules to specific IP ranges or CIDR blocks. Use VPC endpoints, VPNs, or bastion hosts for accessing sensitive services."
consequence: "Databases (MySQL 3306, Postgres 5432, MSSQL 1433) open to the internet get scanned within minutes — data theft or ransomware follows."
category: security
lastVerified: "2026-03-24"
