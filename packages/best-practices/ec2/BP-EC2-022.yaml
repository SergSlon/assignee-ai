id: BP-EC2-022
title: "Elastic IP should be associated with a running instance"
severity: MEDIUM
resource_type: "AWS::EC2::Instance"
property_path: "ElasticIpAssociation"
check_type: "awareness"
expected_value: true
source: "TrustedAdvisor"
source_id: "Z4AUBRNSmz"
description: "Trusted Advisor identifies unassociated Elastic IP addresses. Unassociated EIPs incur charges ($0.005/hour per unused EIP) without providing any value."
remediation: "Associate the Elastic IP with a running instance or release it. EIPs are free when associated with a running instance."
consequence: "Unassociated Elastic IPs cost $3.65/month each and do nothing — forgotten EIPs across accounts add up to pure waste."
category: cost_optimization
lastVerified: "2026-03-24"
