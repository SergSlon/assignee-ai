id: BP-EC2-009
title: "EC2 instance should not have a public IP address"
severity: HIGH
resource_type: "AWS::EC2::Instance"
property_path: "NetworkInterfaces[0].AssociatePublicIpAddress"
check_type: "not_equals"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "EC2.9"
description: "EC2 instances should not have public IP addresses unless absolutely required. Public IPs expose instances directly to the internet, increasing the attack surface for brute-force, scanning, and exploitation."
remediation: "Set AssociatePublicIpAddress to false. Place instances in private subnets and use a NAT gateway for outbound access. Use an ALB or NLB for inbound traffic."
fix_hint: "Disable public IP; use private subnet with NAT/ALB"
category: security
lastVerified: "2026-03-22"
