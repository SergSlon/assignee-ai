id: BP-EC2-014
title: "EC2 instance should not have auto-assigned public IPv4"
severity: HIGH
resource_type: "AWS::EC2::Instance"
property_path: "SubnetId"
check_type: "exists"
expected_value: true
source: "FSBP"
source_id: "EC2.15"
description: "EC2 instances should be launched in private subnets that do not auto-assign public IPv4 addresses. Instances in public subnets are directly reachable from the internet."
remediation: "Launch instances in private subnets. Use NAT gateways for outbound internet access and load balancers for inbound traffic."
category: security
lastVerified: "2026-03-24"
