id: BP-NAT-001
title: "Deploy NatGateway in 2+ AZs for production high availability"
severity: HIGH
resource_type: "AWS::EC2::NatGateway"
property_path: "SubnetId"
check_type: "cross_resource_count"
expected_value: ">=2 NatGateways in different AZs for production workloads"
source: "AWS Well-Architected Framework"
source_id: "REL-02"
description: "A single NatGateway is a single point of failure. If the AZ hosting the NatGateway goes down, all private subnets lose outbound internet access. For production workloads, deploy at least one NatGateway per AZ used by private subnets to ensure high availability."
remediation: "Add a NatGateway in each AZ that contains private subnets. Update each AZ's private route table to point 0.0.0.0/0 at its local NatGateway. Each NatGateway requires its own Elastic IP."
category: reliability
lastVerified: "2026-03-24"
blocking: false
autoFixable: false
fixType: interactive
interactiveOptions:
  - label: "Add NatGateway in additional AZ"
    action: prompt_value
    targetField: "SubnetId"
  - label: "Skip — single-AZ is acceptable for this workload"
    action: skip
