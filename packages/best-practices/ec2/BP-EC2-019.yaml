id: BP-EC2-019
title: "EC2 instance should not be over-provisioned"
severity: MEDIUM
resource_type: "AWS::EC2::Instance"
property_path: "InstanceType"
check_type: "awareness"
expected_value: true
source: "TrustedAdvisor"
source_id: "TA-overprovisioned-ec2"
description: "Trusted Advisor identifies EC2 instances where CPU, memory, or network utilization consistently stays below 40% of capacity. Over-provisioned instances waste money on unused resources."
remediation: "Downsize the instance to a smaller type. Use AWS Compute Optimizer recommendations to find the right instance type for the workload."
category: cost_optimization
lastVerified: "2026-03-24"
