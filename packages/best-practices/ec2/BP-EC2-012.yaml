id: BP-EC2-012
title: "EC2 instance EBS volumes should be encrypted"
severity: HIGH
resource_type: "AWS::EC2::Instance"
property_path: "BlockDeviceMappings[0].Ebs.Encrypted"
check_type: "equals"
expected_value: true
source: "FSBP"
source_id: "EC2.3"
description: "EBS volumes attached to EC2 instances should be encrypted at rest. Unencrypted volumes expose data to unauthorized access if the underlying storage is compromised or the volume snapshot is shared."
remediation: "Enable EBS encryption by default in the account settings or specify Encrypted: true in each BlockDeviceMapping. Existing unencrypted volumes can be encrypted by creating an encrypted snapshot and restoring."
category: security
lastVerified: "2026-03-24"
autoFixable: true
desiredStatePatch:
  BlockDeviceMappings:
    - Ebs:
        Encrypted: true
