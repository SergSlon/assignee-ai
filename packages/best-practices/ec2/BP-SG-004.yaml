id: BP-SG-004
title: "Security group should not allow ingress from 0.0.0.0/0 to SSH"
severity: CRITICAL
resource_type: "AWS::EC2::SecurityGroup"
property_path: "SecurityGroupIngress"
check_type: "awareness"
expected_value: true
source: "FSBP"
source_id: "EC2.13"
description: "Security groups should not allow unrestricted SSH access (port 22) from 0.0.0.0/0. Open SSH ports are a primary target for brute-force attacks and unauthorized access."
remediation: "Restrict SSH ingress to specific IP ranges or use AWS Systems Manager Session Manager for shell access without opening SSH ports."
category: security
lastVerified: "2026-03-24"
fixType: "interactive"
interactiveOptions:
  - label: "Set allowed SSH CIDR range"
    action: "prompt_value"
    targetField: "SecurityGroupIngress"
