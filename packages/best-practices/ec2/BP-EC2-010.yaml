id: BP-EC2-010
title: "EC2 instance should not use a default security group"
severity: HIGH
resource_type: "AWS::EC2::Instance"
property_path: "SecurityGroupIds"
check_type: "not_contains"
expected_value: "default"
source: "FSBP"
source_id: "EC2.2"
description: "EC2 instances should not use the default security group. Default security groups allow all inbound traffic from instances in the same group and all outbound traffic, creating overly permissive network access."
remediation: "Create a custom security group with least-privilege rules and assign it to the instance instead of the default security group."
consequence: "The default SG allows all traffic between members — any compromised instance in the group can freely reach all others on all ports."
fix_hint: "Create a custom security group with least-privilege rules"
category: security
lastVerified: "2026-03-24"
