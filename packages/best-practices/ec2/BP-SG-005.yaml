id: BP-SG-005
title: "Security group should not allow unrestricted RDP access"
severity: CRITICAL
resource_type: "AWS::EC2::SecurityGroup"
property_path: "SecurityGroupIngress"
check_type: "not_equals"
expected_value: "0.0.0.0/0:3389"
source: "AWS Security Hub FSBP"
source_id: "EC2.14"
description: "RDP (port 3389) must not be open to 0.0.0.0/0. Open RDP ports are the #1 initial-access vector for ransomware gangs targeting Windows instances."
remediation: "Restrict RDP ingress to specific IP ranges (corporate VPN CIDR, bastion SG, etc.) or use AWS Systems Manager Fleet Manager for remote desktop access without opening RDP ports."
consequence: "Port 3389 open to the internet invites ransomware — RDP brute-force is the leading initial-access vector for Windows ransomware campaigns."
category: security
lastVerified: "2026-04-20"
fixType: "interactive"
interactiveOptions:
  - label: "Set allowed RDP CIDR range"
    action: "prompt_value"
    targetField: "SecurityGroupIngress"
