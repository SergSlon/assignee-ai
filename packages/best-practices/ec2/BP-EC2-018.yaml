id: BP-EC2-018
title: "EC2 instance should not be idle (low CPU utilization)"
severity: MEDIUM
resource_type: "AWS::EC2::Instance"
property_path: "InstanceId"
check_type: "awareness"
expected_value: true
source: "TrustedAdvisor"
source_id: "Qch7DwouX1"
description: "Trusted Advisor flags EC2 instances with average CPU utilization below 10% over 14 days. Idle instances waste compute costs without providing value."
remediation: "Right-size or terminate idle instances. Consider using AWS Instance Scheduler for dev/test workloads or switching to spot instances for fault-tolerant workloads."
consequence: "An idle instance burns its full hourly rate 24/7 for nothing — a forgotten m5.xlarge wastes over $1,400/year."
fix_hint: "Right-size or terminate idle instances to reduce cost"
category: cost_optimization
lastVerified: "2026-03-24"
