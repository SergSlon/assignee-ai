id: BP-EC2-023
title: "EC2 instance should have a backup strategy"
severity: HIGH
resource_type: "AWS::EC2::Instance"
property_path: "Tags"
check_type: "awareness"
expected_value: true
source: "TrustedAdvisor"
source_id: "TA-ec2-backup"
description: "EC2 instances should be included in a backup plan via AWS Backup or have AMI creation scheduled. Without backups, instance failure can result in permanent data and configuration loss."
remediation: "Add the instance to an AWS Backup plan or configure Amazon Data Lifecycle Manager to create regular AMI snapshots."
consequence: "Instance failure without backups means permanent loss of data, configuration, and application state — full rebuild from scratch."
category: reliability
lastVerified: "2026-03-24"
