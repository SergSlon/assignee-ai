id: BP-EC2-013
title: "EC2 instance should have termination protection enabled"
severity: HIGH
resource_type: "AWS::EC2::Instance"
property_path: "DisableApiTermination"
check_type: "equals"
expected_value: true
source: "FSBP"
source_id: "EC2.25"
description: "Production EC2 instances should have API termination protection enabled to prevent accidental termination via the console, CLI, or API. Accidental termination can cause service outages and data loss."
remediation: "Set DisableApiTermination to true for production instances. This can be changed at any time without restarting the instance."
consequence: "One accidental API call or misclicked console button permanently destroys the instance — all in-memory state and non-backed-up data is lost."
fix_hint: "Enable termination protection to prevent accidental deletion"
category: reliability
lastVerified: "2026-03-24"
