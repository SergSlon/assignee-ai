id: BP-RT-002
title: "Explicit subnet-to-route-table association required"
severity: MEDIUM
resource_type: "AWS::EC2::Subnet"
property_path: "SubnetRouteTableAssociation"
check_type: "exists"
expected_value: "Every subnet should have an explicit route table association"
source: "AWS Well-Architected Framework"
source_id: "REL-02"
description: "Every subnet should have an explicit AWS::EC2::SubnetRouteTableAssociation rather than relying on the VPC main route table. The main route table is a shared default that applies to all unassociated subnets, making it easy to accidentally expose private subnets to the internet if the main route table is modified. Explicit associations make routing intent clear and auditable."
remediation: "Create an AWS::EC2::SubnetRouteTableAssociation resource for each subnet, referencing the appropriate route table (public or private). Do not rely on the implicit main route table association."
consequence: "Subnets on the main route table inherit any future changes to it — one IGW route added to main accidentally exposes all unassociated subnets."
category: reliability
lastVerified: "2026-03-24"
blocking: false
autoFixable: false
fixType: interactive
interactiveOptions:
  - label: "Create route table association for this subnet"
    action: prompt_value
    targetField: "SubnetRouteTableAssociation"
  - label: "Skip — I will fix manually"
    action: skip
