id: BP-LAMBDA-001
title: "Lambda function should have reserved concurrency set"
severity: HIGH
resource_type: "AWS::Lambda::Function"
property_path: "ReservedConcurrentExecutions"
check_type: "exists"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "Lambda.5"
description: "Lambda functions should have reserved concurrency configured to prevent a single function from consuming all available account concurrency and starving other functions."
remediation: "Set ReservedConcurrentExecutions to an appropriate value for the function's expected load. This guarantees capacity for the function while protecting other functions in the account."
category: reliability
lastVerified: "2026-03-22"
