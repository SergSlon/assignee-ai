id: BP-LAMBDA-008
title: "Lambda function should have reserved concurrency configured"
severity: MEDIUM
resource_type: "AWS::Lambda::Function"
property_path: "ReservedConcurrentExecutions"
check_type: "exists"
expected_value: true
source: "FSBP"
source_id: "Lambda.4"
description: "Lambda functions should have reserved concurrency configured to prevent a single function from consuming all available concurrency in the account. Without limits, a traffic spike on one function can starve others."
remediation: "Set ReservedConcurrentExecutions to an appropriate limit based on expected traffic. This guarantees capacity for the function while protecting other functions in the account."
category: reliability
lastVerified: "2026-03-24"
