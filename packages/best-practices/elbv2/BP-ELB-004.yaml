id: BP-ELB-004
title: "ALB listener should not use plain HTTP protocol"
severity: HIGH
resource_type: "AWS::ElasticLoadBalancingV2::Listener"
property_path: "Protocol"
check_type: "not_equals"
expected_value: "HTTP"
source: "AWS Guard Rules Registry"
source_id: "elbv2_listener_protocol_rule"
description: "An Application Load Balancer listener with Protocol: HTTP forwards cleartext traffic and does not negotiate TLS. Modern workloads should either use Protocol: HTTPS with a valid ACM certificate or configure a redirect action that forwards HTTP requests to an HTTPS listener on port 443."
remediation: "Change the listener's Protocol to HTTPS and attach a certificate via `Certificates: [{ CertificateArn: 'arn:aws:acm:...' }]`. To preserve the convenience of accepting port 80 traffic, keep a second HTTP listener whose DefaultActions is a single redirect action: `{ Type: 'redirect', RedirectConfig: { Protocol: 'HTTPS', Port: '443', StatusCode: 'HTTP_301' } }`."
consequence: "Cleartext traffic can be intercepted or modified in transit; credentials, session cookies, and API keys travel unprotected between clients and the load balancer."
category: security
lastVerified: "2026-04-08"
