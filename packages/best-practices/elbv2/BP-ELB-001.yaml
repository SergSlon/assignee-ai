id: BP-ELB-001
title: "ELBv2 load balancer should have deletion protection enabled"
severity: HIGH
resource_type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
property_path: "LoadBalancerAttributes[deletion_protection.enabled]"
check_type: "equals"
