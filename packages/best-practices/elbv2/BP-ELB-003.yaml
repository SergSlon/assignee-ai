id: BP-ELB-003
title: "Application Load Balancer should drop invalid HTTP headers"
severity: MEDIUM
resource_type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
property_path: "LoadBalancerAttributes[routing.http.drop_invalid_header_fields.enabled]"
check_type: "equals"
expected_value: "true"
source: "AWS Security Hub FSBP"
source_id: "ELB.4"
description: "Application Load Balancers should drop invalid HTTP headers to prevent HTTP desync attacks (request smuggling). This only applies to ALBs, not NLBs."
remediation: "Set the routing.http.drop_invalid_header_fields.enabled load balancer attribute to true. This drops HTTP headers that are not valid per RFC 7230."
category: security
lastVerified: "2026-03-24"
blocking: false
autoFixable: true
