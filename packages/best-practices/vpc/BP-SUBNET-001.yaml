id: BP-SUBNET-001
title: "Public subnets should not auto-assign public IPs by default"
severity: HIGH
resource_type: "AWS::EC2::Subnet"
property_path: "MapPublicIpOnLaunch"
check_type: "equals"
expected_value: false
source: "AWS Security Hub FSBP"
source_id: "EC2.15"
description: "Subnets should not automatically assign public IPv4 addresses to instances on launch. Auto-assigning public IPs increases the attack surface by making instances directly reachable from the internet. Use Elastic IPs or NAT gateways for controlled outbound access instead."
remediation: "Set MapPublicIpOnLaunch to false. Assign public IPs explicitly via Elastic IPs only to instances that genuinely need direct internet access (e.g. NAT gateways, bastion hosts)."
category: security
lastVerified: "2026-03-23"
blocking: false
autoFixable: true
desiredStatePatch:
  MapPublicIpOnLaunch: false
