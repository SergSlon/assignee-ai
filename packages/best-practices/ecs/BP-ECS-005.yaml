id: BP-ECS-005
title: "ECS task definition should have read-only root filesystem"
severity: HIGH
resource_type: "AWS::ECS::TaskDefinition"
property_path: "ContainerDefinitions[0].ReadonlyRootFilesystem"
check_type: "equals"
expected_value: true
source: "FSBP"
source_id: "ECS.5"
description: "ECS containers should use a read-only root filesystem to prevent attackers from modifying container binaries or installing malware. Writable directories should be mounted as tmpfs or EFS volumes."
remediation: "Set ReadonlyRootFilesystem to true in the container definition. Mount specific writable paths as tmpfs volumes for temporary files."
category: security
lastVerified: "2026-03-24"
