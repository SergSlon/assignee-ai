id: BP-ECS-003
title: "ECS task definition should have logging configured"
severity: HIGH
resource_type: "AWS::ECS::TaskDefinition"
property_path: "ContainerDefinitions[0].LogConfiguration"
check_type: "exists"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "ECS.9"
description: "ECS task definitions should configure a log driver for all containers. Without centralized logging, troubleshooting failures and detecting security incidents becomes significantly harder."
remediation: "Configure LogConfiguration with awslogs, splunk, or another supported log driver. Route logs to CloudWatch Logs, Firehose, or a third-party log aggregation service."
category: security
lastVerified: "2026-03-22"
