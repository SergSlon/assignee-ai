id: BP-ECS-001
title: "ECS task definition should not run containers as privileged"
severity: CRITICAL
resource_type: "AWS::ECS::TaskDefinition"
property_path: "ContainerDefinitions[0].Privileged"
check_type: "not_equals"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "ECS.1"
description: "ECS task definitions should not run containers in privileged mode. Privileged containers have root-level access to the host, allowing container escape attacks and full host compromise."
remediation: "Set Privileged to false in all container definitions. Use specific Linux capabilities (via LinuxParameters.Capabilities) instead of granting full privileges."
category: security
lastVerified: "2026-03-22"
