id: BP-IAM-002
title: "IAM user should have MFA enabled"
severity: CRITICAL
resource_type: "AWS::IAM::User"
property_path: "MFADevices"
check_type: "exists"
expected_value: true
source: "AWS Security Hub FSBP"
source_id: "IAM.5"
description: "IAM users with console access should have multi-factor authentication (MFA) enabled. Without MFA, compromised passwords alone grant full access to the AWS account."
remediation: "Enable MFA for all IAM users with console access. Use virtual MFA, hardware TOTP tokens, or FIDO2 security keys. Prefer hardware-based MFA for root and privileged users."
category: security
lastVerified: "2026-03-22"
