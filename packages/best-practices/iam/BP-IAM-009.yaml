id: BP-IAM-009
title: "IAM role should enforce MFA for assume role"
severity: HIGH
resource_type: "AWS::IAM::Role"
property_path: "AssumeRolePolicyDocument"
check_type: "awareness"
expected_value: true
source: "TrustedAdvisor"
source_id: "TA-iam-mfa"
description: "Trusted Advisor recommends that IAM roles with elevated privileges require MFA in the assume role policy condition. Without MFA, compromised credentials can assume the role without additional verification."
remediation: "Add a Condition with aws:MultiFactorAuthPresent=true to the role's trust policy for human-assumed roles. Service roles do not require MFA."
category: security
lastVerified: "2026-03-24"
