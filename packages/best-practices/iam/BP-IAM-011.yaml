id: BP-IAM-011
title: "IAM managed policy must not grant wildcard Resource: *"
severity: CRITICAL
resource_type: "AWS::IAM::ManagedPolicy"
property_path: "PolicyDocument"
check_type: "policy_antipattern"
expected_value: "wildcard-resource"
source: "AWS Guard Rules Registry"
source_id: "iam_policydocument_no_wildcard_resource"
description: "An Allow statement with Resource: \"*\" grants the listed actions on every resource in the account. Even scoped actions become dangerous under Resource: * — for example, iam:PassRole with Resource: * is a direct privilege-escalation vector. Use specific resource ARNs or ARN patterns scoped to the workload's actual targets."
remediation: "Replace Resource: \"*\" with the specific ARNs (or ARN patterns) the policy needs to act on. If the action has no resource-level permissions, use a Condition to scope it (e.g. by aws:ResourceTag or aws:SourceArn) instead of blanket wildcards."
consequence: "Any compromise of the principal that holds this policy escalates to every resource the listed actions can touch — typically catastrophic blast radius even for apparently narrow action lists."
category: security
lastVerified: "2026-04-08"
