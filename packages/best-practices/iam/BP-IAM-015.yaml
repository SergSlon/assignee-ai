id: BP-IAM-015
title: "IAM role trust policy must not use Allow + NotPrincipal"
severity: CRITICAL
resource_type: "AWS::IAM::Role"
property_path: "AssumeRolePolicyDocument"
check_type: "policy_antipattern"
expected_value: "allow-plus-not-principal"
source: "AWS Guard Rules Registry"
source_id: "iam_role_no_allow_plus_not_principal"
description: "An Allow statement with NotPrincipal in a role's trust policy inverts the identity check — it means \"anyone except N can assume this role\". On a role with meaningful permissions this is equivalent to a wildcard principal: every AWS account, every IAM user anywhere, every service can assume the role and inherit its permissions. There is essentially no legitimate use for this pattern in a trust policy."
remediation: "List the specific principals the role should trust under Principal (e.g. `{ \"Service\": \"lambda.amazonaws.com\" }` for a Lambda execution role, or `{ \"AWS\": \"arn:aws:iam::<account>:role/<role>\" }` for cross-account). If you need to EXCLUDE a specific principal from an otherwise-trusted set, use a Deny statement paired with a narrowly-scoped Allow."
consequence: "Any identity that is not in the NotPrincipal list can assume the role immediately — this is functionally equivalent to leaving the door wide open and the role's permissions go with it."
category: security
lastVerified: "2026-04-08"
