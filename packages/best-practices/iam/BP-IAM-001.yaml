id: BP-IAM-001
title: "IAM policy should not grant full administrative privileges"
severity: CRITICAL
resource_type: "AWS::IAM::Policy"
property_path: "PolicyDocument.Statement[0].Effect"
check_type: "not_equals"
expected_value: "Allow"
source: "AWS Security Hub FSBP"
source_id: "IAM.1"
description: "IAM policies should not grant full administrative privileges (Action: *, Resource: *). Overly permissive policies violate least-privilege principles and increase blast radius if credentials are compromised."
remediation: "Replace wildcard (*) actions and resources with specific permissions required for the workload. Use AWS managed policies or create scoped custom policies."
category: security
lastVerified: "2026-03-22"
