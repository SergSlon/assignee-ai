name: Release

# ──────────────────────────────────────────────────────────────────────────────
# Release / publish workflow.
#
# STATUS: ACTIVE — DRY-RUN by default.
#
# Publish-side steps (npm publish, GitHub release creation, Homebrew tap
# update) are gated behind ASSIGNEE_RELEASE_PUBLISH=1. Build, SBOM, and
# provenance steps run unconditionally so DRY-RUN exercises the full
# pipeline. Tap publish is additionally gated behind ASSIGNEE_TAP_PUBLISH=1.
#
# IMPORTANT: the publish gates read from repository VARIABLES (not secrets).
# Per MASTER-001, GitHub Actions does NOT expose `secrets.*` to job-level
# `if:` expressions (`secrets` context is unavailable in job conditionals);
# only `vars.*` works. Tokens stay in secrets; on/off flags must live in
# variables.
#
# How to enable publishing (post-go-decision):
#   1. Remove `"private": true` from every package.json that should ship.
#   2. In GitHub: Settings → Secrets and variables → Actions →
#      Variables tab → New repository variable
#        - Name:  ASSIGNEE_RELEASE_PUBLISH
#        - Value: 1
#      Any non-`'1'` value (including unset) keeps publishing disabled.
#   3. Same place, add another variable to enable Homebrew tap push:
#        - Name:  ASSIGNEE_TAP_PUBLISH
#        - Value: 1
#   4. In the Secrets tab (NOT Variables), add the registry/tap tokens:
#        - HOMEBREW_TAP_TOKEN — fine-grained PAT with write access to the
#                                homebrew-assignee tap repo.
#        - (NPM_TOKEN is NOT required — npm provenance via OIDC is used
#          instead; `id-token: write` is declared in generate-sbom +
#          generate-provenance job-level permissions blocks.)
#   5. Manually trigger the workflow:
#        gh workflow run release.yml -f tag=vX.Y.Z -f confirm=YES_PUBLISH
#
# Per feedback_no_public_artifacts: do NOT flip ASSIGNEE_RELEASE_PUBLISH
# or ASSIGNEE_TAP_PUBLISH until the acquirer explicitly approves.
# Tag pushes alone do NOT trigger this workflow — a human must trigger it.
#
# Tooling notes:
#   - Uses `pnpm -r publish` so `workspace:*` deps are rewritten to real
#     versions at publish time. `npm publish` cannot resolve `workspace:*`.
#   - Uses OIDC provenance (job-level `id-token: write` in generate-sbom /
#     generate-provenance). No long-lived NPM_TOKEN secret is required; npm
#     picks up the OIDC identity via the publish-npm job's setup-node step.
#   - Runs `npm pack --dry-run` per publishable package first so metadata
#     regressions (missing description/license/files) abort the run BEFORE
#     anything hits the registry.
#   - Per-package LICENSE files live at `apps/cli/LICENSE`,
#     `apps/mcp-server/LICENSE`, `packages/core/LICENSE`,
#     `packages/best-practices/LICENSE` (byte-for-byte copies of the root).
#     Local `pnpm -r publish --dry-run` therefore produces identical
#     tarballs to CI — no more "CI-only LICENSE copy" drift (L9-B2).
#   - `package-binaries` uses `pnpm deploy --prod --filter=assignee` to
#     produce a self-contained CLI directory that includes the resolved
#     production `node_modules`. This is what the Homebrew formula
#     actually unpacks — users need `@ai-sdk/*` and other runtime deps
#     present locally or `assignee --version` crashes on first import
#     (L9-B1).
#   - `cross-platform-build` runs the full matrix on macOS + Windows
#     before any publish step. Catches path-handling / shell-dependent
#     bugs that the ubuntu-only default gate misses (L9-H3).
#   - `smoke-test` unpacks the CLI tarball and asserts
#     `node dist/index.js --version` matches the release tag before
#     users ever see it (L9-H5).
#   - `generate-sbom` (W7-06): generates a SPDX 2.3 SBOM from the
#     production tarball and validates it via spdx-tools. Required for
#     CRA 2027 / NIS2 artefact attestation.
#   - `generate-provenance` (W7-08): signs each release tarball with
#     `cosign sign-blob` + GH OIDC, producing a detached blob signature
#     (.sig) and OIDC-anchored certificate (.pem). This is a cosign blob
#     signature — NOT a full SLSA L2 build-provenance attestation (which
#     would require `cosign attest-blob` / slsa-github-generator; a
#     future upgrade path). Requires `id-token: write` (declared in the
#     generate-provenance job's own permissions block).
#   - `generate-release-notes` (W9-04): runs scripts/generate-release-notes.ts
#     to produce external-facing notes with BMAD IDs stripped.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES_PUBLISH to actually publish to npm. Any other value is a dry-run.'
        required: true
        default: 'DRY_RUN'
      tag:
        description: 'Git tag to release (e.g. v0.1.0). Must already exist and point at the commit to publish.'
        required: true

permissions:
  contents: write
  # id-token: write is intentionally NOT set at workflow level — only the
  # two jobs that need OIDC (generate-sbom, generate-provenance) declare it
  # in their own job-level permissions blocks. GH Actions job-level blocks
  # REPLACE the workflow-level block, so those jobs are correctly scoped;
  # granting it here would give all 9 jobs an OIDC token they don't need.

jobs:
  # --------------------------------------------------------------------------
  # Build and test — gate the whole pipeline on a green ubuntu build. Runs
  # first so every downstream job has a cached install. `cross-platform-build`
  # below re-runs the same suite on macOS + Windows in parallel.
  # --------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10.32.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version parity
        # W8-S4 (M-γ-20): Verify every publishable package.json version matches
        # the release tag before any build or publish step runs.  Exits non-zero
        # and prints a diff if any package is ahead or behind the tag.
        # Only enforced when the tag looks like semver; branch-triggered runs
        # are a no-op (the script exits 0 for non-semver ref names).
        if: startsWith(inputs.tag, 'v')
        run: npx tsx scripts/audit-version-parity.ts --expected-version ${{ inputs.tag }}

      - name: Build all packages
        run: npx turbo build

      - name: Run all tests
        run: npx turbo test

      - name: Upload CLI build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-dist
          path: |
            apps/cli/dist/
            apps/cli/completions/
            apps/cli/package.json
            apps/cli/README.md
            apps/cli/LICENSE

  # --------------------------------------------------------------------------
  # Cross-platform build — re-runs build + test on macOS and Windows so a
  # platform-specific regression blocks publish. Gated on `needs: build` so
  # ubuntu runs first and caches pnpm; macOS/Windows then hit warm caches.
  # fail-fast: false because we want both platforms to report even if one
  # fails.
  # --------------------------------------------------------------------------
  cross-platform-build:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10.32.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run all tests
        run: pnpm test

  # --------------------------------------------------------------------------
  # Publish dry-run — runs `npm pack --dry-run` per publishable package so
  # metadata regressions (missing description, license, repository, files)
  # fail BEFORE the real publish step. Gated on cross-platform-build so a
  # macOS-only test failure blocks publish.
  # --------------------------------------------------------------------------
  publish-dry-run:
    needs: cross-platform-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10.32.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: npx turbo build

      - name: Dry-run npm pack per package (metadata audit)
        # Per-package LICENSE now lives at <pkg>/LICENSE as a real file
        # (byte-for-byte copy of root LICENSE). No pre-copy step needed —
        # local `pnpm -r publish --dry-run` produces identical output.
        run: |
          set -euo pipefail
          for dir in apps/cli apps/mcp-server packages/core packages/best-practices; do
            echo "────────────────────────────────────────"
            echo "npm pack --dry-run for $dir"
            echo "────────────────────────────────────────"
            (cd "$dir" && npm pack --dry-run)
          done

  # --------------------------------------------------------------------------
  # Publish to npm — gated on ASSIGNEE_RELEASE_PUBLISH=1 AND
  # confirm=YES_PUBLISH. Uses `pnpm -r publish` so `workspace:*` specs are
  # rewritten to real versions. npm provenance is attached via the OIDC
  # identity that setup-node exposes through the registry-url + node-version
  # step; this job does not need a separate id-token: write block.
  #
  # DRY-RUN default: this step is SKIPPED unless ASSIGNEE_RELEASE_PUBLISH=1
  # is set. The acquirer flips this env var post-go-decision.
  # --------------------------------------------------------------------------
  publish-npm:
    needs: publish-dry-run
    # job-level `if:` cannot read `env.*` (GH Actions context-availability:
    # env is excluded from jobs.<job_id>.if). Use `vars.*` (repository
    # variables) so the gate actually evaluates instead of always-false.
    if: inputs.confirm == 'YES_PUBLISH' && vars.ASSIGNEE_RELEASE_PUBLISH == '1'
    env:
      ASSIGNEE_RELEASE_PUBLISH: ${{ vars.ASSIGNEE_RELEASE_PUBLISH }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10.32.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: npx turbo build

      - name: Publish all packages (workspace-aware, with provenance)
        # pnpm publishes each non-private package in dependency order and
        # rewrites workspace:* specs into concrete versions in the tarball.
        # --no-git-checks: we're on a CI runner without a clean work tree.
        # --access public: required for scoped packages.
        # --provenance: attaches sigstore attestation via OIDC id-token.
        run: pnpm -r publish --access public --provenance --no-git-checks

  # --------------------------------------------------------------------------
  # Create platform tarballs for GitHub release.
  #
  # IMPORTANT: we use `pnpm deploy --prod --filter=assignee <dir>` to produce
  # a self-contained deploy directory that includes the resolved production
  # `node_modules`. Tarring only `dist/` ships broken bits — users get
  # `Cannot find package '@ai-sdk/amazon-bedrock'` on first run because
  # workspace:* deps aren't resolved and runtime deps aren't bundled.
  # The Homebrew formula relies on `libexec.install Dir["*"]` picking up
  # `node_modules` from the tarball (L9-B1).
  #
  # DRY-RUN default: this step is SKIPPED unless ASSIGNEE_RELEASE_PUBLISH=1.
  # --------------------------------------------------------------------------
  package-binaries:
    needs: cross-platform-build
    # job-level `if:` cannot read `env.*` — use `vars.*` (see publish-npm).
    if: inputs.confirm == 'YES_PUBLISH' && vars.ASSIGNEE_RELEASE_PUBLISH == '1'
    env:
      ASSIGNEE_RELEASE_PUBLISH: ${{ vars.ASSIGNEE_RELEASE_PUBLISH }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
          - platform: darwin-x64
          - platform: linux-x64
          - platform: linux-arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10.32.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: npx turbo build

      - name: Produce self-contained CLI deploy directory
        # `pnpm deploy` resolves workspace:* deps to real versions, strips
        # devDeps, and materialises a standalone node_modules tree. The
        # resulting apps/cli/deploy/ directory is what Homebrew unpacks.
        run: pnpm deploy --prod --filter=assignee apps/cli/deploy

      - name: Stage deploy contents for tarball
        run: |
          set -euo pipefail
          # `pnpm deploy` copies package.json and dist/ but does NOT
          # automatically include the unversioned bits the formula needs
          # (generated completions, root LICENSE fallback for brew audit).
          # Copy them explicitly. README is already present via pnpm deploy.
          cp -r apps/cli/completions apps/cli/deploy/completions
          test -f apps/cli/deploy/LICENSE || cp apps/cli/LICENSE apps/cli/deploy/LICENSE
          test -f apps/cli/deploy/README.md || cp apps/cli/README.md apps/cli/deploy/README.md

      - name: Create platform tarball
        run: |
          VERSION="${{ inputs.tag }}"
          TARBALL="assignee-${VERSION}-${{ matrix.platform }}.tar.gz"
          tar -czf "${TARBALL}" -C apps/cli/deploy .
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          echo "TARBALL_NAME=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload platform tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Use the canonical filename (assignee-${VERSION}-${platform}.tar.gz)
          # as the artifact name so downstream jobs can locate it deterministically.
          name: assignee-${{ inputs.tag }}-${{ matrix.platform }}.tar.gz
          path: ${{ env.TARBALL }}

  # --------------------------------------------------------------------------
  # Generate external-facing release notes (W9-04).
  # Strips BMAD IDs so external adopters don't see internal references.
  # Runs unconditionally (DRY-RUN exercises this step too).
  # --------------------------------------------------------------------------
  generate-release-notes:
    needs: cross-platform-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10.32.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate external-facing release notes
        id: release_notes
        run: |
          set -euo pipefail
          # Get previous tag to compute the range
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${{ inputs.tag }}$" | head -1)
          FROM_ARG=""
          if [ -n "$PREV_TAG" ]; then
            FROM_ARG="--from ${PREV_TAG}"
          fi
          npx tsx scripts/generate-release-notes.ts ${FROM_ARG} --to ${{ inputs.tag }} > release-notes.md
          echo "Generated release notes:"
          cat release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md

  # --------------------------------------------------------------------------
  # GitHub Release
  # DRY-RUN default: this step is SKIPPED unless ASSIGNEE_RELEASE_PUBLISH=1.
  # --------------------------------------------------------------------------
  github-release:
    needs: [publish-npm, package-binaries, generate-release-notes]
    # job-level `if:` cannot read `env.*` — use `vars.*` (see publish-npm).
    if: inputs.confirm == 'YES_PUBLISH' && vars.ASSIGNEE_RELEASE_PUBLISH == '1'
    env:
      ASSIGNEE_RELEASE_PUBLISH: ${{ vars.ASSIGNEE_RELEASE_PUBLISH }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Download all tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assignee-${{ inputs.tag }}-*.tar.gz
          merge-multiple: true
          path: release-assets/

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Smoke-test — download the published tarball, extract, and run
  # `node dist/index.js --version`. Asserts the version string matches the
  # release tag. Runs on ubuntu only because cross-platform verification is
  # handled by cross-platform-build above; this is the final tarball-integrity
  # gate before anyone runs `brew install` (L9-H5).
  # DRY-RUN default: SKIPPED unless ASSIGNEE_RELEASE_PUBLISH=1.
  # --------------------------------------------------------------------------
  smoke-test:
    needs: github-release
    # job-level `if:` cannot read `env.*` — use `vars.*` (see publish-npm).
    if: inputs.confirm == 'YES_PUBLISH' && vars.ASSIGNEE_RELEASE_PUBLISH == '1'
    env:
      ASSIGNEE_RELEASE_PUBLISH: ${{ vars.ASSIGNEE_RELEASE_PUBLISH }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Download linux-x64 tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assignee-${{ inputs.tag }}-linux-x64.tar.gz
          path: smoke/

      - name: Extract tarball
        run: |
          set -euo pipefail
          mkdir -p smoke/unpacked
          tar -xzf smoke/assignee-${{ inputs.tag }}-linux-x64.tar.gz -C smoke/unpacked

      - name: Assert CLI runs and prints the release tag
        run: |
          set -euo pipefail
          EXPECTED="${{ inputs.tag }}"
          # Strip the leading 'v' if the tag is vX.Y.Z; --version prints the
          # package.json version which omits the v.
          EXPECTED_STRIPPED="${EXPECTED#v}"
          cd smoke/unpacked
          OUTPUT="$(node dist/index.js --version)"
          echo "assignee --version output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -qE "(^|[^0-9])${EXPECTED_STRIPPED}([^0-9]|$)"; then
            echo "::error::Tarball version mismatch. Expected ${EXPECTED_STRIPPED}, got: $OUTPUT" >&2
            exit 1
          fi

      - name: Smoke-test install.sh against downloaded tarball
        # M-γ-21a: Exercise the install script end-to-end so any regression in
        # install.sh is caught before users run `curl | sh`.
        # We point ASSIGNEE_VERSION at the release tag and ASSIGNEE_LOCAL_TARBALL
        # at the already-downloaded tarball path so the script skips the
        # network download and uses the artefact from the previous step.
        # ASSIGNEE_INSTALL_DIR is set to a temp dir to avoid colliding with any
        # system-level installation.
        run: |
          set -euo pipefail
          EXPECTED="${{ inputs.tag }}"
          EXPECTED_STRIPPED="${EXPECTED#v}"
          SMOKE_INSTALL_DIR="$(mktemp -d)"

          # Make the already-downloaded tarball available where install.sh looks
          # for a local override. install.sh honours ASSIGNEE_LOCAL_TARBALL to
          # skip the curl download when running in CI/test mode.
          TARBALL_PATH="$(realpath smoke/assignee-${{ inputs.tag }}-linux-x64.tar.gz)"

          ASSIGNEE_VERSION="${{ inputs.tag }}" \
          ASSIGNEE_INSTALL_DIR="$SMOKE_INSTALL_DIR" \
          ASSIGNEE_LOCAL_TARBALL="$TARBALL_PATH" \
            sh scripts/install.sh

          # Verify the installed wrapper runs and prints the expected version
          INSTALL_OUTPUT="$("${SMOKE_INSTALL_DIR}/assignee" --version 2>&1 || true)"
          echo "install.sh smoke output: $INSTALL_OUTPUT"
          if ! echo "$INSTALL_OUTPUT" | grep -qE "(^|[^0-9])${EXPECTED_STRIPPED}([^0-9]|$)"; then
            echo "::error::install.sh smoke version mismatch. Expected ${EXPECTED_STRIPPED}, got: $INSTALL_OUTPUT" >&2
            exit 1
          fi
          echo "install.sh smoke-test passed."

  # --------------------------------------------------------------------------
  # W7-06: Generate SPDX SBOM from the release artefacts.
  # Validates format compliance with spdx-tools. Required for CRA 2027 /
  # NIS2 artefact attestation.
  # Runs unconditionally — DRY-RUN exercises SBOM generation.
  # Attach-to-release step is gated on ASSIGNEE_RELEASE_PUBLISH=1.
  # --------------------------------------------------------------------------
  generate-sbom:
    needs: cross-platform-build
    runs-on: ubuntu-latest
    permissions:
      # GH Actions semantics: a job-level `permissions:` block REPLACES the
      # workflow-level block, it does NOT merge. Every permission this job
      # needs MUST be declared explicitly here.
      #
      # contents: write — required by softprops/action-gh-release (Attach SBOM
      #   to GitHub Release step). Without it the upload 403s. This is the
      #   permission that the workflow-level block would have provided.
      contents: write
      # security-events: write — required by github/codeql-action/upload-sarif
      #   to push the Grype SARIF report to the GitHub Security tab.
      security-events: write
      # id-token: write — required for OIDC-based signed attestations. The
      #   anchore/sbom-action and any future cosign/attest step in this job
      #   relies on the workflow's OIDC identity; mirrors the workflow-level
      #   declaration that the job-level block would otherwise mask.
      id-token: write
      # actions: read — required by anchore/sbom-action when attaching
      #   release assets: it calls the GitHub Actions API to locate the
      #   workflow artifact uploaded via `artifact-name:` (see "Generate
      #   SPDX SBOM" step below, which sets artifact-name) and to
      #   correlate the run. Documented in the action's README:
      #   https://github.com/anchore/sbom-action#github-token-and-permissions
      #   ("If attaching release assets, the `actions: read` permission
      #   is also required. This may be implicit for public repositories,
      #   but is likely to be necessary for private repositories.")
      #   Keep this line — removing it will silently break artifact
      #   discovery on private repos.
      actions: read
    # Job-level env so the step-level `if: env.ASSIGNEE_RELEASE_PUBLISH == '1'`
    # below (Attach SBOM to GitHub Release) actually evaluates against this
    # value. A step-level `env:` block does NOT influence the same step's
    # `if:` because `if:` is evaluated BEFORE `env:` is materialised — the
    # gate would always read `null` and skip. Sourcing from `vars.*` first
    # mirrors the publish-npm pattern used elsewhere in this workflow.
    env:
      ASSIGNEE_RELEASE_PUBLISH: ${{ vars.ASSIGNEE_RELEASE_PUBLISH }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10.32.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SPDX SBOM
        # W7-06: @anchore/sbom-action generates an SPDX 2.3 JSON SBOM from
        # the node_modules tree. The SBOM is anchored to the release tag
        # and includes all transitive production dependencies.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: assignee-${{ inputs.tag }}-sbom.spdx.json
          artifact-name: assignee-${{ inputs.tag }}-sbom.spdx.json

      - name: Validate SBOM format
        # W7-06: Validate the generated SBOM against the SPDX 2.3 schema.
        # Uses the spdx-tools-java CLI (installed via npm wrapper) to ensure
        # the SBOM is spec-compliant before attaching it to the release.
        run: |
          set -euo pipefail
          # Install spdx-tools-java npm wrapper
          npm install -g spdx-tools
          # Validate — exits non-zero on schema violation
          spdx-tools validate assignee-${{ inputs.tag }}-sbom.spdx.json
          echo "SBOM validation passed."

      - name: Scan SBOM for vulnerabilities (Grype)
        # MASTER-015c: anchore/scan-action runs Grype against the generated
        # SBOM. Fails the release on HIGH or CRITICAL findings — caller
        # MUST address (or document and waive) before publish proceeds.
        # Runs unconditionally (DRY-RUN exercises the scan); not gated by
        # ASSIGNEE_RELEASE_PUBLISH so we catch CVEs even on dry-run cycles.
        # SHA pin verified against `gh api repos/anchore/scan-action/git/refs/tags/v6.5.1`
        # (commit 1638637db639e0ade3258b51db49a9a137574c3e).
        # Dependabot will bump weekly; re-verify when the comment-tag changes.
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: assignee-${{ inputs.tag }}-sbom.spdx.json
          severity-cutoff: high
          fail-build: true
          acs-report-enable: true
          output-format: sarif

      - name: Upload Grype SARIF to GitHub Security
        # MASTER-015c: surface scan-action findings in the Security tab even
        # when the scan passes (so HIGH/CRITICAL trends are visible).
        # `if: always()` so the SARIF uploads even when scan-action fails
        # the build — operators need to see WHY it failed.
        if: always() && steps.scan.outputs.sarif != ''
        # SHA pin verified against `gh api repos/github/codeql-action/git/refs/tags/v3.27.1`
        # (tag dereferences to commit 4f3212b61783c3c68e8309a0f18a699764811cda).
        # Dependabot will bump weekly; re-verify when the comment-tag changes.
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-sbom-scan

      - name: Attach SBOM to GitHub Release
        # DRY-RUN default: SKIPPED unless ASSIGNEE_RELEASE_PUBLISH=1.
        # `env.ASSIGNEE_RELEASE_PUBLISH` is materialised at the JOB level
        # (see jobs.generate-sbom.env above) so this step-level `if:` reads
        # a real value instead of the always-null result that a step-only
        # `env:` block would produce.
        if: env.ASSIGNEE_RELEASE_PUBLISH == '1'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.tag }}
          files: assignee-${{ inputs.tag }}-sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # W7-08: Cosign blob signature + OIDC-anchored certificate per tarball.
  # Each tarball is signed with `cosign sign-blob` using GitHub's OIDC
  # identity, producing a detached .sig and .pem certificate file.
  # NOTE: this is a blob signature, NOT a full SLSA L2 build-provenance
  # attestation (SLSA L2 would require cosign attest-blob / slsa-github-
  # generator — future upgrade path).
  # Verification command (verify-blob, not verify-attestation):
  #   cosign verify-blob \
  #     --certificate <tarball>.pem \
  #     --signature  <tarball>.sig \
  #     --certificate-identity https://github.com/SergSlon/assignee-ai/.github/workflows/release.yml@refs/heads/main \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     <tarball>
  # See docs/explanation/supply-chain-provenance.md for full verification guide.
  # Signing steps run unconditionally; attach step is gated on ASSIGNEE_RELEASE_PUBLISH=1.
  # --------------------------------------------------------------------------
  generate-provenance:
    needs: [smoke-test, generate-sbom]
    # job-level `if:` cannot read `env.*` — use `vars.*` (see publish-npm).
    if: inputs.confirm == 'YES_PUBLISH' && vars.ASSIGNEE_RELEASE_PUBLISH == '1'
    env:
      ASSIGNEE_RELEASE_PUBLISH: ${{ vars.ASSIGNEE_RELEASE_PUBLISH }}
    runs-on: ubuntu-latest
    permissions:
      # Required for cosign OIDC signing
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - name: Download all tarballs for provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assignee-${{ inputs.tag }}-*.tar.gz
          merge-multiple: true
          path: provenance-assets/

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Generate subject hashes for provenance
        id: hash
        run: |
          set -euo pipefail
          cd provenance-assets
          # Build sha256 digest list for all tarballs
          # Format: <hex>:<filename> (space-separated for multiple files)
          HASHES=$(sha256sum assignee-*.tar.gz | awk '{print $1 ":" $2}' | tr '\n' ' ' | xargs)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
          sha256sum assignee-*.tar.gz

      - name: Sign release artefacts with cosign (GH OIDC keyless)
        # W7-08: Blob-signs each tarball using GitHub's OIDC provider.
        # Produces a detached .sig + OIDC-anchored .pem certificate per tarball.
        # Verify with `cosign verify-blob` (see job comment above for full command).
        # The signing certificate is anchored to the workflow's GitHub identity,
        # making the signature chain verifiable without long-lived keys.
        run: |
          set -euo pipefail
          cd provenance-assets
          for tarball in assignee-*.tar.gz; do
            echo "Signing $tarball..."
            cosign sign-blob \
              --yes \
              --oidc-issuer=https://token.actions.githubusercontent.com \
              --output-certificate="${tarball}.pem" \
              --output-signature="${tarball}.sig" \
              "$tarball"
            echo "Signed: $tarball -> ${tarball}.pem + ${tarball}.sig"
          done

      - name: Attach provenance artefacts to release
        # DRY-RUN default: SKIPPED unless ASSIGNEE_RELEASE_PUBLISH=1.
        if: env.ASSIGNEE_RELEASE_PUBLISH == '1'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            provenance-assets/*.pem
            provenance-assets/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release manifest
        # W7-08 / PR-010: Write the signed release manifest from the real SHA256
        # hashes of the signed tarballs. This manifest is consumed by install.sh
        # (version-floor + allowlist checks) and by the Homebrew formula.
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag }}"
          node -e "
            const fs = require('fs');
            const path = require('path');
            const assets = fs.readdirSync('provenance-assets').filter(f => f.endsWith('.tar.gz'));
            const entries = [];
            for (const f of assets) {
              const sha256 = require('child_process')
                .execSync('shasum -a 256 provenance-assets/' + f)
                .toString().split(' ')[0];
              entries.push({ filename: f, sha256, version: '${VERSION}' });
            }
            const manifest = {
              version: '${VERSION}',
              generated: new Date().toISOString(),
              spdx_sbom: 'assignee-${VERSION}-sbom.spdx.json',
              entries
            };
            fs.writeFileSync('scripts/release-manifest.signed.json', JSON.stringify(manifest, null, 2) + '\n');
            console.log('Release manifest written with', entries.length, 'entries.');
          "

      - name: Upload release manifest as release asset
        # PR-010: install.sh fetches the manifest from the release asset URL
        # (github.com/.../releases/download/${VERSION}/release-manifest.signed.json)
        # so it always reads the signed manifest that shipped with the tarball,
        # not a potentially stale placeholder in the main branch.
        # This step uploads the freshly generated manifest to the GitHub Release.
        # Bug 2 fix: gate on ASSIGNEE_RELEASE_PUBLISH so dry-run releases skip
        # this step (the job checks out at the tag SHA, not main, so uploading
        # during a dry-run would still be a no-op for install.sh — but the gate
        # is the correct defence-in-depth).
        if: env.ASSIGNEE_RELEASE_PUBLISH == '1'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.tag }}
          files: scripts/release-manifest.signed.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bug 1 fix (Option B): commit-back step dropped entirely.
      # Rationale: the job checks out at `ref: ${{ inputs.tag }}` (a tag SHA, not
      # main).  `git push origin HEAD:main` from a tag SHA is either a
      # non-fast-forward failure (normal case) or a destructive fast-forward that
      # resets main to the tag SHA.  The release asset uploaded above is the
      # authoritative copy that install.sh reads; the in-repo manifest is
      # informational only.  Keeping the step introduced more risk than value.

  # --------------------------------------------------------------------------
  # Update Homebrew formula — computes sha256 per arch and patches the tap.
  # DRY-RUN default: SKIPPED unless ASSIGNEE_RELEASE_PUBLISH=1 AND
  # ASSIGNEE_TAP_PUBLISH=1. The tap publish is an additional gate so that
  # a registry publish can be tested independently of tap distribution.
  # --------------------------------------------------------------------------
  update-homebrew:
    needs: [smoke-test, generate-provenance]
    # job-level `if:` cannot read `env.*` — use `vars.*` (see publish-npm).
    # Both ASSIGNEE_RELEASE_PUBLISH and ASSIGNEE_TAP_PUBLISH must be set as
    # repository variables (Settings → Variables → Actions) to enable.
    if: >
      inputs.confirm == 'YES_PUBLISH' &&
      vars.ASSIGNEE_RELEASE_PUBLISH == '1' &&
      vars.ASSIGNEE_TAP_PUBLISH == '1'
    env:
      ASSIGNEE_RELEASE_PUBLISH: ${{ vars.ASSIGNEE_RELEASE_PUBLISH }}
      ASSIGNEE_TAP_PUBLISH: ${{ vars.ASSIGNEE_TAP_PUBLISH }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - name: Download darwin-arm64 tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assignee-${{ inputs.tag }}-darwin-arm64.tar.gz
          path: release-assets/

      - name: Download darwin-x64 tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assignee-${{ inputs.tag }}-darwin-x64.tar.gz
          path: release-assets/

      - name: Download linux-x64 tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assignee-${{ inputs.tag }}-linux-x64.tar.gz
          path: release-assets/

      - name: Download linux-arm64 tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assignee-${{ inputs.tag }}-linux-arm64.tar.gz
          path: release-assets/

      - name: Compute sha256 per platform
        id: sha
        run: |
          VERSION="${{ inputs.tag }}"
          declare -A PLATFORMS=( \
            [darwin_arm64]="darwin-arm64" \
            [darwin_x64]="darwin-x64" \
            [linux_x64]="linux-x64" \
            [linux_arm64]="linux-arm64" \
          )
          for key in "${!PLATFORMS[@]}"; do
            platform="${PLATFORMS[$key]}"
            TARBALL="release-assets/assignee-${VERSION}-${platform}.tar.gz"
            if [ ! -f "$TARBALL" ]; then
              echo "Expected tarball not found: $TARBALL" >&2
              ls -la release-assets/ >&2
              exit 1
            fi
            SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
            echo "sha_${key}=$SHA" >> "$GITHUB_OUTPUT"
          done

      - name: Validate Homebrew formula sha256 against release manifest
        # W7-03: Assert that computed sha256 values match manifest entries
        # before publishing the formula. Prevents a compromised artefact
        # from slipping past the formula update step.
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('scripts/release-manifest.signed.json', 'utf8'));
            const platforms = {
              'darwin-arm64': '${{ steps.sha.outputs.sha_darwin_arm64 }}',
              'darwin-x64':   '${{ steps.sha.outputs.sha_darwin_x64 }}',
              'linux-x64':    '${{ steps.sha.outputs.sha_linux_x64 }}',
              'linux-arm64':  '${{ steps.sha.outputs.sha_linux_arm64 }}'
            };
            let ok = true;
            for (const [platform, sha] of Object.entries(platforms)) {
              const entry = manifest.entries.find(e => e.filename.includes(platform));
              if (!entry) { console.error('No manifest entry for platform:', platform); ok = false; continue; }
              if (entry.sha256 !== sha) {
                console.error('SHA256 mismatch for', platform, '--- manifest:', entry.sha256, 'computed:', sha);
                ok = false;
              } else {
                console.log('OK:', platform, sha.substring(0, 16) + '...');
              }
            }
            if (!ok) process.exit(1);
            console.log('All formula sha256 values match the release manifest.');
          "

      # M-γ-22 fix: use actions/checkout with `token:` input instead of
      # embedding the secret in the clone URL. The token-in-URL pattern
      # (`x-access-token:<token>@github.com/...`) exposes the secret in the
      # process argument list (visible to `ps aux`) and in runner log lines
      # that GitHub's redaction does not always mask. actions/checkout routes
      # the credential through git's credential-helper path, never into argv.
      - name: Checkout Homebrew tap repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: assignee-ai/homebrew-assignee
          # token: uses the credential-helper path — secret never appears in argv
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update Homebrew formula
        run: |
          VERSION="${{ inputs.tag }}"
          SHA_DARWIN_ARM64="${{ steps.sha.outputs.sha_darwin_arm64 }}"
          SHA_DARWIN_X64="${{ steps.sha.outputs.sha_darwin_x64 }}"
          SHA_LINUX_X64="${{ steps.sha.outputs.sha_linux_x64 }}"
          SHA_LINUX_ARM64="${{ steps.sha.outputs.sha_linux_arm64 }}"

          # Render the multi-platform formula from the repo's template copy
          # (homebrew/assignee.rb) and drop it into the tap. We use envsubst
          # so per-arch url/sha256 blocks stay declarative.
          export VERSION SHA_DARWIN_ARM64 SHA_DARWIN_X64 SHA_LINUX_X64 SHA_LINUX_ARM64
          envsubst < homebrew/assignee.rb > tap/Formula/assignee.rb

          # Commit and push
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/assignee.rb
          git commit -m "Update assignee to ${VERSION}" || echo "No changes to commit"
          git push
