name: CI — cross-platform (manual + weekly)

# Cross-platform sweep: runs the full lint + build + test + coverage
# pipeline on macOS and Windows in addition to the default Linux gate,
# so path-handling and shell-dependent code (s3-upload backslashes,
# price-cache HOME vs USERPROFILE, signal handlers) gets exercised
# when it matters — before a release, or after a change touching
# cross-platform surface area.
#
# L9-H4 mitigation (split-workflow CI downgrade): when we moved the
# matrix out of the default `push`/`pull_request` gate to save minutes,
# nothing automatically exercised macOS/Windows, so regressions could
# sit for weeks until someone hit "Run workflow". A weekly cron keeps
# the full matrix green without manual intervention.
#
# Schedule: every Monday at 07:00 UTC (02:00 CT / 03:00 ET). Weekly is
# enough because iteration cadence is multi-day, and any change touching
# cross-platform surface area is already covered by the release workflow's
# `cross-platform-build` job and/or ad-hoc manual dispatch before merge.
#
# Cost envelope:
#   - One full matrix run ≈ 15 min wall clock × 6 job-slots = ~90 compute
#     minutes, but GitHub bills by runner minutes with platform multipliers:
#     macOS 10×, Windows 2×, Linux 1×. Per run ≈ 150 Linux-equivalent
#     minutes ≈ 4 runs/month ≈ 600 Linux-equivalent minutes/month —
#     well under the 2 000/mo free-tier budget with room for a
#     release cycle.
#   - If the budget starts pinching, either drop Windows from the weekly
#     and run it only on release, or switch the cron to "first Monday of
#     the month" by adjusting the schedule below.
#
# Private-repo billing note: macOS minutes cost 10× Linux, Windows 2×.
# Click "Run workflow" in the Actions tab to trigger on demand.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      node-versions:
        description: "Comma-separated list of Node majors to test (default: 22)"
        required: false
        type: string
        default: "22"
  schedule:
    # Weekly: Mondays 07:00 UTC. See cost envelope above.
    - cron: "0 7 * * 1"

jobs:
  # Compute the matrix from the dispatch input. Converting "20,22" → ["20","22"]
  # in a tiny setup job keeps the caller simple and lets you restrict to a
  # single Node version (default) to halve the burn.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      node-json: ${{ steps.nodes.outputs.json }}
    steps:
      - id: nodes
        run: |
          # inputs.node-versions is only populated on workflow_dispatch.
          # On schedule triggers it's empty — fall back to the default "22"
          # so the scheduled weekly run matches the workflow_dispatch default.
          raw="${{ inputs.node-versions }}"
          if [ -z "$raw" ]; then
            raw="22"
          fi
          # awk strips any stray whitespace and drops empty tokens so the
          # emitted array is a clean ["22"] (or ["20","22"] for dispatch
          # multi-version runs). The leading-whitespace prefix the earlier
          # version used ("  " + $1) was cosmetic noise, not the root cause
          # of the silent weekly failure — that was a type-mismatch in
          # `ci-core.yml` (node input declared `type: number` while
          # `fromJson` emits strings). See Epic 76-it2 for the full fix.
          json="$(echo "$raw" | tr ',' '\n' | awk '{gsub(/[[:space:]]/,""); if (length($0)) print $0}' | jq -R . | jq -cs .)"
          echo "json=$json" >> "$GITHUB_OUTPUT"

  matrix:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ${{ fromJson(needs.prepare.outputs.node-json) }}
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: true
    name: ci (${{ matrix.os }} / node ${{ matrix.node }})
    uses: ./.github/workflows/ci-core.yml
    with:
      os: ${{ matrix.os }}
      node: ${{ matrix.node }}
      experimental: ${{ matrix.experimental }}
      # Coverage badge + artifact upload already handled by the main
      # `ci.yml` push/PR workflow on ubuntu-latest + node 22. The
      # cross-platform sweep intentionally does NOT republish.
      publish-coverage: false
    secrets: inherit
