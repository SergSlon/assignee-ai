name: Wizard UX Audit

# PTY-driven regression check for the assignee wizard UX. Captures
# screen-by-screen output of `dev init --wizard` + `dev init --global
# --wizard` and diffs against the golden snapshots checked in under
# `apps/cli/__fixtures__/wizard-snapshots/`. Drift means the wizard
# changed its prompt order, banner wording, placeholder text, or
# finalisation summary — surface it for human review.
#
# Informational by design (`continue-on-error: true`). Wizard prompts
# have subtle non-determinism around timing-dependent spinner frames
# that could false-positive a blocking gate. PRs that legitimately
# change wizard UX should re-capture the goldens with
# `pnpm wizard-audit --update` and commit the diff.
#
# Excluded by design:
#   - `infra plan --wizard` (Bedrock cost — ~$0.013/run)
#   - Anything that calls AWS (admin list/status, drift, destroy)
#
# Both exclusions keep the regression suite zero-cost per CI run.

on:
  pull_request:
    paths:
      # Wizard surface — every file that influences a pinned snapshot.
      # `init/**` covers the per-flow modules, `init.ts` (sibling file,
      # NOT under init/) registers --wizard/--global and is the entry
      # surface itself, `first-run.ts` is where the 25-line welcome
      # banner pinned in the snapshot's first screen comes from.
      - "apps/cli/src/commands/init.ts"
      - "apps/cli/src/commands/init/**"
      - "apps/cli/src/utils/wizard-*.ts"
      - "apps/cli/src/utils/first-run.ts"
      - "apps/cli/src/config/**"
      - "apps/cli/scripts/wizard-audit.mjs"
      - "apps/cli/scripts/pty-driver.py"
      - "apps/cli/__fixtures__/wizard-snapshots/**"
      - "packages/core/src/config/**"
      - ".github/workflows/wizard-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wizard-audit:
    name: wizard-audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      # No setup-python step needed: ubuntu-latest ships with
      # python3.12 preinstalled (verified Quinn MED-12, 2026-05-23).
      # pty-driver.py only uses stdlib modules (pty, select, termios,
      # fcntl), so any Python 3.8+ works. If we add a macos-latest
      # matrix entry later we'll need setup-python back — macOS runners
      # come with Python 3.9 by default which would technically still
      # work, but pinning is safer for CI determinism on that runner.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter @assignee/cli build

      - name: Run wizard-audit
        id: wizard-audit
        run: |
          set +e
          pnpm wizard-audit | tee wizard-audit.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarise result
        if: always()
        run: |
          {
            echo "## Wizard UX Audit"
            echo ""
            if [ "${{ steps.wizard-audit.outputs.status }}" = "0" ]; then
              echo ":white_check_mark: All wizard snapshots match the goldens."
            else
              echo ":warning: Wizard snapshots drifted from the goldens."
              echo ""
              echo "If the change is intentional, run \`pnpm wizard-audit --update\` locally and commit the diff."
              echo ""
              echo '<details><summary>Captured output</summary>'
              echo ''
              echo '```'
              cat wizard-audit.log
              echo '```'
              echo ''
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diff artifact on drift
        if: steps.wizard-audit.outputs.status != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wizard-audit-diff
          path: wizard-audit.log
          retention-days: 14
