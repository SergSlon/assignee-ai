name: CI Core (reusable)

# Reusable workflow — the single source of truth for the lint / build / test /
# coverage pipeline. Invoked via `workflow_call` by:
#   - `ci.yml`              (push / PR, ubuntu-latest + node 22 only)
#   - `ci-cross-platform.yml` (manual button, full OS × node matrix)
#
# Keeping it reusable means the cross-platform sweep is bit-identical to the
# default gate, and we never drift one copy from the other.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      os:
        description: "Runner OS (ubuntu-latest / macos-latest / windows-latest)"
        required: true
        type: string
      node:
        description: "Node major version (e.g. 22)"
        required: true
        # MUST be string, not number: `ci-cross-platform.yml` derives the
        # node version list via `fromJson(needs.prepare.outputs.node-json)`,
        # which returns an array of strings. Passing a string where
        # `type: number` is declared causes workflow_call type validation
        # to fail silently — the matrix job never dispatches and the
        # caller run ends red with only `prepare` green (observed every
        # Monday 07:00 UTC from the workflow's inception until 2026-04-20).
        # Unquoted number literals in other callers (e.g. `node: 22` in
        # `ci.yml`) are auto-coerced to string by GitHub Actions, so all
        # existing callers continue to work without modification.
        type: string
      experimental:
        description: "If true, the job is allowed to fail without blocking the calling workflow"
        required: false
        type: boolean
        default: false
      publish-coverage:
        description: "If true, run the coverage-badge + artifact upload steps. Only set true for the canonical ubuntu-latest + node 22 cell."
        required: false
        type: boolean
        default: false
    secrets:
      BEDROCK_LOGGING_VERIFIED:
        description: "Bedrock logging verification token"
        required: false
      GIST_TOKEN:
        description: "PAT for publishing coverage badge to Gist"
        required: false

jobs:
  ci:
    # Cancel previous runs on the same ref+os+node combo when a new push
    # arrives. `inputs.*` is resolvable at job-level; `matrix.*` would not
    # be, since the reusable has no matrix of its own.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.os }}-${{ inputs.node }}
      cancel-in-progress: true
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    continue-on-error: ${{ inputs.experimental }}
    env:
      BEDROCK_LOGGING_VERIFIED: ${{ secrets.BEDROCK_LOGGING_VERIFIED }}
    defaults:
      run:
        # Force bash on Windows too — our scripts assume POSIX. GitHub's
        # windows-latest images ship Git-Bash, which handles this fine.
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Prettier format check
        # P077: enforce the same formatting gate that the pre-commit lint-staged hook
        # applies, so `git commit --no-verify` bypass is caught by CI before merge.
        # lint-staged runs `prettier --write` on staged files; this step runs
        # `prettier --check` across the whole tree — any file that was committed
        # without the hook will show a diff and fail the build.
        run: pnpm exec prettier --check "**/*.{ts,tsx,json,md}"

      - name: Type-check
        run: pnpm check-types

      - name: Lint barrels
        run: pnpm lint:barrels

      - name: Lint shims
        run: pnpm lint:shims

      - name: Doc lint
        run: pnpm doc-lint

      - name: Citation lint
        run: pnpm citation-lint

      - name: CI-multiplier stub lint
        run: pnpm lint:ci-multiplier

      - name: Tracker-leak lint
        # Reject internal tracker IDs (Epic NN, W<N>-<NN>) in user-facing CLI strings.
        run: pnpm lint:tracker-leak

      - name: Action pin audit
        # W7-01: Ensure all uses: refs are SHA-pinned — no tag or branch refs
        run: npx tsx scripts/audit-action-pins.ts

      - name: Secrets-inherit audit
        # W7-05: Ensure no workflow uses `secrets: inherit`
        run: npx tsx scripts/audit-secrets-inherit.ts

      - name: Overrides rationale audit
        # W7-07: Ensure every pnpm.overrides key has a sidecar rationale entry
        run: npx tsx scripts/audit-overrides.ts

      - name: pnpm security audit
        # W7-07: Fail on moderate+ vulnerabilities in production deps.
        # Per-CVE suppressions live in `package.json` under
        # `pnpm.auditConfig.ignoreCves`, each backed by a rationale
        # section in `package.json.overrides-rationale.md`. Adding a
        # new entry to `ignoreCves` REQUIRES a matching rationale
        # entry — `audit-overrides.ts` (the previous step) enforces
        # this for `pnpm.overrides` keys, and the rationale file's
        # convention is one section per CVE/override.
        run: pnpm audit --audit-level=moderate --prod

      - name: NOTICE freshness check
        # W10-08: warn on NOTICE/THIRD-PARTY-NOTICES drift.
        # Advisory in Round 1 because `pnpm licenses list --json` output
        # appears to vary slightly between CI (Linux) and local (macOS),
        # producing false positives on byte-equality compare.
        # W9 hardens this: either deterministic normalization in the
        # script or a periodic-regen workflow. Until then, the CI signal
        # is visible (warning) but non-blocking.
        continue-on-error: true
        run: |
          if [ -f scripts/generate-notice.ts ]; then
            npx tsx scripts/generate-notice.ts --check || \
              echo "::warning::NOTICE freshness check drifted (advisory; W9 hardens)"
          else
            echo "scripts/generate-notice.ts not yet present — skipping"
          fi

      # Branch-protection reference comment (W6-02):
      # Merge-to-main is gated on nightly-e2e per docs/explanation/ci-gates.md.
      # Actual branch-protection rules are wired by W9; this comment anchors the intent.

      - name: Build all packages
        run: npx turbo build

      - name: Validate BP rules
        # W7-S1: Fail fast on malformed/duplicate BP YAML rules before test suite runs.
        # Script validates schema, ID uniqueness, dedup, and conflict checks.
        run: npx tsx scripts/validate-bp-rules.ts

      - name: Run tests with coverage (POSIX cells)
        # `--continue`: keep scheduling downstream packages' test:coverage
        # tasks even if an earlier package fails. Without this, turbo stops
        # at the first failing package and any failures in later packages
        # stay hidden. The workflow's exit code is still non-zero on any
        # package failure (turbo exits with the aggregate failure status),
        # so this does not weaken CI.
        #
        # Coverage is gated on POSIX cells because Windows + v8 coverage
        # instrumentation triggers a deterministic `[vitest-worker]:
        # Timeout calling "onTaskUpdate"` failure on `@assignee/core`: the
        # COLLECT phase takes ~15 minutes under instrumented workers on
        # NTFS, exceeding vitest's internal RPC heartbeat. All tests still
        # pass (9866/9866) — only the IPC layer dies. The canonical coverage
        # cell is ubuntu-latest + node 22 (see `inputs.publish-coverage`
        # below); Windows coverage is unused, so dropping it costs nothing
        # and unblocks the Windows-green check needed for `experimental: false`.
        if: inputs.os != 'windows-latest'
        run: npx turbo test:coverage --continue

      - name: Run tests without coverage (Windows cell)
        # Windows runs `test` instead of `test:coverage` to bypass the v8
        # coverage instrumentation that triggers vitest's RPC `onTaskUpdate`
        # timeout (see "Run tests with coverage (POSIX cells)" comment).
        # `--continue` still applies so every package's failure surface is
        # enumerated in one run.
        if: inputs.os == 'windows-latest'
        run: npx turbo test --continue

      # ── Coverage aggregation only runs on the canonical cell.
      # Running it on every matrix cell wastes CI minutes and produces
      # conflicting badge updates.
      - name: Merge coverage summaries
        id: coverage
        if: inputs.publish-coverage
        run: |
          node -e "
            const fs = require('fs');
            const dirs = ['apps/cli', 'apps/mcp-server', 'packages/core', 'packages/best-practices'];
            let tS=0,cS=0,tB=0,cB=0,tF=0,cF=0,tL=0,cL=0;
            const missing = [];
            for (const d of dirs) {
              const p = d + '/coverage/coverage-summary.json';
              if (!fs.existsSync(p)) { missing.push(p); continue; }
              const s = JSON.parse(fs.readFileSync(p, 'utf-8')).total;
              tS+=s.statements.total; cS+=s.statements.covered;
              tB+=s.branches.total;   cB+=s.branches.covered;
              tF+=s.functions.total;  cF+=s.functions.covered;
              tL+=s.lines.total;      cL+=s.lines.covered;
            }
            if (missing.length) {
              console.error('Missing coverage summaries:', missing.join(', '));
              process.exit(1);
            }
            const pct = tL>0?((cL/tL)*100).toFixed(1):'0';
            console.log('Lines: '+pct+'%');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'lines='+pct+'\n');
          "

      - name: Update coverage badge
        if: inputs.publish-coverage && github.ref == 'refs/heads/main' && vars.COVERAGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: assignee-ai-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.lines }}%
          valColorRange: ${{ steps.coverage.outputs.lines }}
          minColorRange: 50
          maxColorRange: 90
          namedLogo: vitest

      - name: Scrub logs before upload
        # W6-04: Redact telemetry/PII from logs before attaching to CI artefacts.
        # Runs only when coverage is published (canonical ubuntu+node22 cell).
        if: always() && inputs.publish-coverage
        run: |
          if [ -f scripts/scrub-logs-for-upload.ts ]; then
            npx tsx scripts/scrub-logs-for-upload.ts ~/.assignee/logs/ || true
          else
            echo "scrub-logs-for-upload.ts not yet present — skipping (Worker B pending)"
          fi

      - name: Upload coverage HTML reports
        if: always() && inputs.publish-coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            apps/cli/coverage/
            apps/mcp-server/coverage/
            packages/core/coverage/
            packages/best-practices/coverage/
          retention-days: 30
