name: vacation-quality

# Daily quality gate for the vacation window. Runs every day at 09:17 UTC
# on the main branch. Opens a GitHub Issue with the failure details if any
# gate fails, so the user can see from their phone whether the product is
# healthy.
#
# Gates run:
# - pnpm -r build (all 4 packages)
# - pnpm -r test (full test matrix)
# - pnpm --filter assignee pre-close-probes --strict-multi-variation
# - pnpm --filter assignee pre-close-probes --tripwire-only
# - pnpm citation-lint
# - pnpm doc-lint
#
# Explicitly NOT run (require AWS creds / session context):
# - pnpm -r test:coverage (too slow for a daily gate, runs at epic close)
# - live-AWS dogfood (costs money, one-off manual action)
#
# Retention: runs are scheduled for 14 days after vacation start. After
# that, this workflow can be disabled or converted to weekly. Adjust the
# cron schedule if you're on vacation for longer.

on:
  schedule:
    # 09:17 UTC daily — avoids cron fleet congestion at :00
    - cron: '17 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        id: build
        run: pnpm -r build

      - name: Test
        id: test
        run: pnpm -r test

      - name: Pre-close probes — strict multi-variation
        id: probes-strict
        run: pnpm --filter assignee pre-close-probes --strict-multi-variation

      - name: Pre-close probes — tripwire only
        id: probes-tripwire
        run: pnpm --filter assignee pre-close-probes --tripwire-only

      - name: Citation lint
        id: citation-lint
        run: pnpm citation-lint

      - name: Doc lint
        id: doc-lint
        run: pnpm doc-lint

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # W7-04: LLM output is NOT interpolated here — all content is
          # constructed from trusted CI context values (step outcomes,
          # context.sha, context.runId). The rawOutput from any LLM-
          # emitted content is written to a file artefact, not injected
          # into the script template.
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `vacation-quality: ${today} — gate FAIL`;
            const body = [
              `Automated daily quality gate failed on main.`,
              ``,
              `**Commit**: ${context.sha}`,
              `**Run**: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `### Gate status`,
              `- Build: ${{ steps.build.outcome }}`,
              `- Test: ${{ steps.test.outcome }}`,
              `- Probes strict: ${{ steps.probes-strict.outcome }}`,
              `- Probes tripwire: ${{ steps.probes-tripwire.outcome }}`,
              `- Citation lint: ${{ steps.citation-lint.outcome }}`,
              `- Doc lint: ${{ steps.doc-lint.outcome }}`,
              ``,
              `Click the run URL above for the full failing log.`,
              ``,
              `If you're on vacation and can't act, this issue is informational only — the main branch is still at ${context.sha}.`
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['vacation-quality', 'automated']
            });

  # DEF-02 (W19-S2 → W20-S2): Validate the full test suite under Node 22 with
  # --experimental-vm-modules. W20-S2 local simulation (NODE_OPTIONS=
  # --experimental-vm-modules pnpm -r test, exit 0): 20 test files / 939 tests
  # (best-practices), 315 / 8026 (core), 39 / 687 (mcp-server), 132 / 1781
  # (cli) — all green. Gate promoted from observability to hard blocker.
  # DEF-02 is FULLY CLOSED (HEAD 37d9272a, 2026-04-29).
  node22-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test (Node 22 --experimental-vm-modules)
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
        run: pnpm -r test
