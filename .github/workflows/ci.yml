name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os || 'default' }}-${{ matrix.node || 'default' }}
  cancel-in-progress: true

jobs:
  ci:
    # ── Cross-platform CI matrix ─────────────────────────────────────────────
    # Linux is the historical target and drives all gating steps (coverage
    # badge, artifact upload). macOS and Windows run the same lint + build +
    # test suite so path-handling and shell-dependent code (s3-upload
    # backslashes, price-cache HOME vs USERPROFILE) actually get exercised.
    #
    # Windows is marked `continue-on-error` while shell/pnpm/node version
    # combos stabilize — its output is visible in the PR checks UI but does
    # not block merges. Revisit once Windows has been green for ~2 weeks and
    # flip `experimental` to false below to make it a hard gate.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    env:
      BEDROCK_LOGGING_VERIFIED: ${{ secrets.BEDROCK_LOGGING_VERIFIED }}
    defaults:
      run:
        # Force bash on Windows too — our scripts assume POSIX. GitHub's
        # windows-latest images ship Git-Bash, which handles this fine.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Build all packages
        run: npx turbo build

      - name: Run tests with coverage
        run: npx turbo test:coverage

      # ── Coverage aggregation only runs on the canonical Linux+Node22 job.
      # Running it on every matrix cell wastes CI minutes and produces
      # conflicting badge updates.
      - name: Merge coverage summaries
        id: coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          node -e "
            const fs = require('fs');
            const dirs = ['apps/cli', 'apps/mcp-server', 'packages/core', 'packages/best-practices'];
            let tS=0,cS=0,tB=0,cB=0,tF=0,cF=0,tL=0,cL=0;
            const missing = [];
            for (const d of dirs) {
              const p = d + '/coverage/coverage-summary.json';
              if (!fs.existsSync(p)) { missing.push(p); continue; }
              const s = JSON.parse(fs.readFileSync(p, 'utf-8')).total;
              tS+=s.statements.total; cS+=s.statements.covered;
              tB+=s.branches.total;   cB+=s.branches.covered;
              tF+=s.functions.total;  cF+=s.functions.covered;
              tL+=s.lines.total;      cL+=s.lines.covered;
            }
            if (missing.length) {
              console.error('Missing coverage summaries:', missing.join(', '));
              process.exit(1);
            }
            const pct = tL>0?((cL/tL)*100).toFixed(1):'0';
            console.log('Lines: '+pct+'%');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'lines='+pct+'\n');
          "

      - name: Update coverage badge
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22 && github.ref == 'refs/heads/main' && vars.COVERAGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: assignee-ai-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.lines }}%
          valColorRange: ${{ steps.coverage.outputs.lines }}
          minColorRange: 50
          maxColorRange: 90
          namedLogo: vitest

      - name: Upload coverage HTML reports
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/cli/coverage/
            apps/mcp-server/coverage/
            packages/core/coverage/
            packages/best-practices/coverage/
          retention-days: 30
