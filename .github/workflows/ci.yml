name: CI

# Default gate — runs on every push to main and every PR.
# Only ubuntu-latest × node 22 to keep Actions minutes manageable
# (private repos get 2 000 Linux minutes/month on the Free tier; macOS
# and Windows cost 10× and 2× respectively). Cross-platform sweeps run
# on demand via `.github/workflows/ci-cross-platform.yml` — click
# "Run workflow" in the Actions UI when needed.

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default — GITHUB_TOKEN only gets read access to repo
# contents. Any job that needs to write (e.g. publish a coverage badge
# via gist) opts in with a per-job `permissions:` override. See
# ci-core.yml's coverage-badge step — the gist write is authenticated
# via a separate PAT (secrets.GIST_TOKEN), not GITHUB_TOKEN, so no
# job-level elevation is needed here.
permissions:
  contents: read

jobs:
  ubuntu-node20:
    name: ci (ubuntu-latest / node 20)
    uses: ./.github/workflows/ci-core.yml
    with:
      os: ubuntu-latest
      node: "20"
      publish-coverage: false
    # W7-05: explicit secret declarations replacing `secrets: inherit`
    secrets:
      BEDROCK_LOGGING_VERIFIED: ${{ secrets.BEDROCK_LOGGING_VERIFIED }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

  ubuntu-node22:
    name: ci (ubuntu-latest / node 22)
    uses: ./.github/workflows/ci-core.yml
    with:
      os: ubuntu-latest
      node: "22"
      publish-coverage: true
    # W7-05: explicit secret declarations replacing `secrets: inherit`
    secrets:
      BEDROCK_LOGGING_VERIFIED: ${{ secrets.BEDROCK_LOGGING_VERIFIED }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

  reviewer-evidence-audit:
    name: reviewer evidence audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.32.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run reviewer evidence audit
        run: pnpm reviewer-evidence-audit --since origin/main
