name: CodeQL

# ──────────────────────────────────────────────────────────────────────────────
# CodeQL static analysis — MASTER-015b (HIGH).
#
# Scans JavaScript/TypeScript sources for security vulnerabilities (injection,
# unsafe deserialisation, prototype pollution, hard-coded secrets, etc.) and
# uploads results to GitHub's Security tab.
#
# Triggers:
#   - push to main (catch newly-introduced vulnerabilities)
#   - pull_request against main (block at PR review time)
#   - weekly schedule (catch CVEs introduced via dependency updates between
#     active development windows; Mondays 08:00 UTC)
#
# SHA-pin policy (W7 / `feedback_supply_chain`): all `uses:` references are
# pinned to a 40-char commit SHA with the v-tag in a trailing comment.
# Dependabot (`.github/dependabot.yml`) bumps these SHAs in weekly grouped
# PRs.
#
# SHA-pin verification — the SHAs below were verified on 2026-04-26 against
# `gh api repos/github/codeql-action/git/refs/tags/v3.27.1` (tag dereferences
# to commit 4f3212b61783c3c68e8309a0f18a699764811cda). Dependabot will keep
# them current weekly; re-verify when bumping the comment-tag.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Mondays 07:30 UTC — runs even when the repo is quiet so a
    # dormant CVE in a dependency doesn't sit undiscovered.
    - cron: '30 7 * * 1'

# CodeQL needs to write results to the Security tab; everything else is read-only.
permissions:
  security-events: write
  contents: read
  actions: read

# Cancel in-flight CodeQL runs when a new push to the same ref lands —
# the latest commit is the one we care about, and CodeQL runs are slow.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # `javascript-typescript` covers both .js and .ts sources in a single
        # database build — no need for separate language entries.
        language: ['javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        # SHA pin verified against `gh api repos/github/codeql-action/git/refs/tags/v3.27.1`
        # (tag dereferences to commit 4f3212b61783c3c68e8309a0f18a699764811cda).
        # Dependabot will bump to v3 latest weekly; re-verify when the comment-tag changes.
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` includes the security suite + a curated
          # set of code-quality queries; `security-extended` is broader but
          # noisier. Start with the default `security-and-quality` and tune
          # downward if FP rate becomes a problem.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        # SHA pin verified against `gh api repos/github/codeql-action/git/refs/tags/v3.27.1`
        # (tag dereferences to commit 4f3212b61783c3c68e8309a0f18a699764811cda).
        # Dependabot will bump to v3 latest weekly; re-verify when the comment-tag changes.
        #
        # `upload: never` — the repo is currently PRIVATE and does not have
        # GitHub Advanced Security enabled, so the SARIF upload to the
        # Security tab fails with HTTP 403 "Code scanning is not enabled
        # for this repository" (verified 2026-05-06 via
        # `gh api repos/SergSlon/assignee-ai/code-scanning/default-setup`).
        # CodeQL analysis still runs in full; results land in the runner's
        # workspace under `/home/runner/work/<repo>/results/<lang>.sarif`
        # for ad-hoc download. Switch back to the default upload behaviour
        # by removing this line either when (a) the repo flips to PUBLIC
        # (code scanning is free for public repos), or (b) the org enables
        # GitHub Advanced Security on this private repo. See
        # `.github/workflows/codeql.yml` history + the customer-demo
        # 2026-05-06 audit closure for context.
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
