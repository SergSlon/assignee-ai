name: Nightly E2E (real AWS)

# Closes NFR concern T-2.3 from docs/nfr-assessment-2026-04-08.md.
# Purpose: run the full RUN_E2E=1 test suite against a dedicated,
# budget-protected test AWS account on a nightly schedule, catching
# regressions that unit tests miss. The RUN_E2E gate is currently
# only exercised when an operator chooses to run `pnpm test` with
# the env var set — T-2.3 flags that as "only re-runs on operator
# demand", which this workflow fixes.
#
# W6-02: Nightly-e2e provisioning + alert routing. On failure, an alert
# is dispatched to the webhook configured in secrets.ASSIGNEE_NIGHTLY_ALERT_WEBHOOK
# (Slack / email / PagerDuty — configure per deployment preference).
# Acceptable-miss window: single nightly failures within a 48-hour window
# are treated as infrastructure flakes; three consecutive failures trigger
# the alert and require a human response. See docs/explanation/ci-gates.md
# (Worker B) for the full gate policy and acceptable-miss policy.
#
# Secrets this workflow requires (set via repo Settings → Secrets):
#   ASSIGNEE_NIGHTLY_OPERATOR_ACCESS_KEY_ID     — operator IAM user key
#   ASSIGNEE_NIGHTLY_OPERATOR_SECRET_ACCESS_KEY — operator IAM user secret
#   ASSIGNEE_NIGHTLY_READER_ACCESS_KEY_ID       — reader IAM user key (MCP)
#   ASSIGNEE_NIGHTLY_READER_SECRET_ACCESS_KEY   — reader IAM user secret
#   ASSIGNEE_NIGHTLY_AUDITOR_ACCESS_KEY_ID      — auditor IAM user key (MCP)
#   ASSIGNEE_NIGHTLY_AUDITOR_SECRET_ACCESS_KEY  — auditor IAM user secret
#   ASSIGNEE_NIGHTLY_ALERT_WEBHOOK              — alert destination URL (optional)
#
# These MUST come from a dedicated test account (NOT the main prod
# account) — the suite creates and destroys real resources, and a
# misconfigured test can leak a few dollars of EIP / NAT Gateway cost.
# Set up the test account via `assignee setup` from a workstation once,
# then copy the access keys into the GitHub secrets above.
#
# If any secret is missing, the job fails fast at the "Verify nightly
# secrets are configured" step rather than silently skipping the tests
# — a silent skip would mean the gate passes every night without
# actually running anything, the exact outcome T-2.3 is trying to
# prevent.

on:
  schedule:
    # 03:00 UTC daily. Picks a low-traffic window so CI concurrency
    # limits and AWS API rate limits are less likely to cause flakes.
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual triggering from the Actions UI for ad-hoc runs
    # (e.g. after merging a risky change and wanting to check the
    # full suite without waiting for the next night).

concurrency:
  # Serialize nightly runs so a manual dispatch during the scheduled
  # window doesn't double-run against the same test account.
  group: nightly-e2e
  cancel-in-progress: false

permissions:
  contents: read
  actions: read    # read workflow run history for consecutive-failure check
  issues: write    # open / update alert issue on 3 consecutive failures

jobs:
  nightly-e2e:
    runs-on: ubuntu-latest
    # 60 min — the RUN_E2E suite includes 22 specs that hit real AWS
    # (plan + apply + destroy lifecycle per resource type, plus one
    # compound VPC pattern). Typical wall-clock is 15-25 min; the
    # extra headroom covers slow days.
    timeout-minutes: 60

    env:
      RUN_E2E: '1'
      # The 3 role-separated credentials Assignee.ai reads. These
      # intentionally use distinct secret names from the main CI
      # workflow so a misconfigured nightly account cannot leak into
      # day-to-day CI runs against the main account.
      ASSIGNEE_OPERATOR_ACCESS_KEY_ID: ${{ secrets.ASSIGNEE_NIGHTLY_OPERATOR_ACCESS_KEY_ID }}
      ASSIGNEE_OPERATOR_SECRET_ACCESS_KEY: ${{ secrets.ASSIGNEE_NIGHTLY_OPERATOR_SECRET_ACCESS_KEY }}
      ASSIGNEE_READER_ACCESS_KEY_ID: ${{ secrets.ASSIGNEE_NIGHTLY_READER_ACCESS_KEY_ID }}
      ASSIGNEE_READER_SECRET_ACCESS_KEY: ${{ secrets.ASSIGNEE_NIGHTLY_READER_SECRET_ACCESS_KEY }}
      ASSIGNEE_AUDITOR_ACCESS_KEY_ID: ${{ secrets.ASSIGNEE_NIGHTLY_AUDITOR_ACCESS_KEY_ID }}
      ASSIGNEE_AUDITOR_SECRET_ACCESS_KEY: ${{ secrets.ASSIGNEE_NIGHTLY_AUDITOR_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1

    steps:
      - name: Verify nightly secrets are configured
        # Fail fast if the secrets were never set. A bare `env` check
        # inside a step is the cheapest way to detect a missing secret
        # — GH Actions does not warn about missing secret references.
        run: |
          missing=()
          [ -z "$ASSIGNEE_OPERATOR_ACCESS_KEY_ID" ] && missing+=("ASSIGNEE_NIGHTLY_OPERATOR_ACCESS_KEY_ID")
          [ -z "$ASSIGNEE_OPERATOR_SECRET_ACCESS_KEY" ] && missing+=("ASSIGNEE_NIGHTLY_OPERATOR_SECRET_ACCESS_KEY")
          [ -z "$ASSIGNEE_READER_ACCESS_KEY_ID" ] && missing+=("ASSIGNEE_NIGHTLY_READER_ACCESS_KEY_ID")
          [ -z "$ASSIGNEE_READER_SECRET_ACCESS_KEY" ] && missing+=("ASSIGNEE_NIGHTLY_READER_SECRET_ACCESS_KEY")
          [ -z "$ASSIGNEE_AUDITOR_ACCESS_KEY_ID" ] && missing+=("ASSIGNEE_NIGHTLY_AUDITOR_ACCESS_KEY_ID")
          [ -z "$ASSIGNEE_AUDITOR_SECRET_ACCESS_KEY" ] && missing+=("ASSIGNEE_NIGHTLY_AUDITOR_SECRET_ACCESS_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Nightly E2E is missing required secrets:"
            printf '::error::  - %s\n' "${missing[@]}"
            echo "::error::See .github/workflows/nightly-e2e.yml for setup instructions."
            exit 1
          fi
          echo "All 6 nightly credentials are present."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.32.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: npx turbo build

      - name: Run doctor preflight
        # Verify credentials + MCP servers + BP integrity before
        # spending money on the real-AWS suite. If doctor fails, fail
        # the job immediately — the E2E suite's first test would fail
        # anyway and we'd waste the compute budget.
        run: node apps/cli/dist/index.js doctor

      - name: Run RUN_E2E suite
        # The suite respects RUN_E2E=1 and the 22 gated specs in
        # apps/cli/src/e2e/e2e-plan.test.ts will run. Every other
        # package's test suite is hermetic and unchanged by the env.
        run: pnpm test

      - name: Verify no leaked resources
        # After the test suite, confirm the test account has zero
        # Assignee-managed resources left. The suite cleans up after
        # each spec via its own afterAll blocks, but a crash or a
        # rare CCAPI NotFound race could leave something behind —
        # this step is the last line of defence and fails the nightly
        # if anything is stranded.
        #
        # The protected infra allowlist (per feedback_assignee_infra_
        # safety_allowlist.md: AssigneeOperator/Reader/Auditor policies
        # + AssigneeAiBedrockLoggingRole) is intentionally excluded
        # from `list --json` output, so a non-empty result means
        # genuine leakage.
        if: always()  # Run even if tests failed — we need to know about leaks regardless
        run: |
          set -euo pipefail
          echo "Listing all Assignee-managed resources in the nightly account..."
          output=$(node apps/cli/dist/index.js list --all --json 2>/dev/null || echo '[]')
          count=$(echo "$output" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
            const resources = Array.isArray(data) ? data : (data.resources ?? []);
            console.log(resources.length);
          ")
          if [ "$count" -gt 0 ]; then
            echo "::error::$count leaked resource(s) detected in the nightly test account:"
            echo "$output"
            echo "::error::Run 'assignee destroy --all' against the nightly account to clean up."
            exit 1
          fi
          echo "Nightly account is clean — zero Assignee-managed resources."

      - name: Resolve $HOME for artifact path
        # actions/upload-artifact's `path:` input is processed by @actions/glob,
        # which does NOT shell-expand `~` — a literal `~/...` path component
        # never matches anything and the upload silently produces a zero-byte
        # artifact (with `if-no-files-found: warn` swallowing the only signal).
        # Stage $HOME into $GITHUB_ENV so the next step can interpolate it via
        # the `${{ env.* }}` template, which IS expanded before the action runs.
        # See actions/toolkit#1380 and actions/upload-artifact#174.
        if: always()
        run: echo "ASSIGNEE_HOME=$HOME" >> "$GITHUB_ENV"

      - name: Upload nightly cost ledger
        # P070 / MASTER-002: The FinOps monthly-budget workflow
        # (.github/workflows/finops-monthly-budget.yml) downloads
        # artifacts named `nightly-cost-ledger-<run_number>` to compute
        # the rolling 30-day CI spend against the configured monthly
        # ceiling. Without this upload step the consumer workflow
        # silently returns `no-data` and the budget gate passes forever.
        #
        # Runs on every nightly (success or failure) so a green nightly
        # also contributes its cost ledger to the rolling window.
        # `if-no-files-found: warn` lets a run that produced no ledger
        # (e.g. doctor preflight failed before the suite ran) succeed
        # without uploading — finops-aggregate.mjs treats that run as
        # absent in its rolling-window calculation, which is correct.
        #
        # retention-days is 35 — slightly larger than the 30-day rolling
        # window so the consumer workflow always has the full window
        # available even if it runs a few days late.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-cost-ledger-${{ github.run_number }}
          # Glob matches the per-day JSONL files emitted by the CLI to
          # $HOME/.assignee/logs/nightly-cost-YYYY-MM-DD.jsonl (verified
          # against scripts/finops-aggregate.mjs discoverLedgerFiles
          # and apps/cli/src/e2e/nightly-destroy-smoke.test.ts).
          # Uses $ASSIGNEE_HOME (set in the prior step) because the action
          # does not shell-expand `~` — see comment on the resolver step.
          path: ${{ env.ASSIGNEE_HOME }}/.assignee/logs/nightly-cost-*.jsonl
          if-no-files-found: warn
          retention-days: 35

      - name: Scrub logs before upload
        # W6-04: Redact telemetry/PII from logs before attaching to CI artefacts.
        if: failure()
        run: |
          if [ -f scripts/scrub-logs-for-upload.ts ]; then
            npx tsx scripts/scrub-logs-for-upload.ts ~/.assignee/logs/ || true
          else
            echo "scrub-logs-for-upload.ts not yet present — skipping (Worker B pending)"
          fi

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-e2e-logs-${{ github.run_number }}
          # The CLI persists structured logs to $HOME/.assignee/logs — capture
          # them for post-mortem on failures. Also capture the vitest
          # output if vitest wrote a reporter file.
          # `~` is NOT shell-expanded by @actions/glob — use $ASSIGNEE_HOME
          # (set in the "Resolve $HOME for artifact path" step above) so the
          # path resolves to the runner's real home directory.
          path: |
            ${{ env.ASSIGNEE_HOME }}/.assignee/logs/
            apps/cli/test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Check consecutive failures and alert
        # P043 / W6-02: Flake-tolerance policy — single nightly failures within a
        # 48-hour window are treated as infrastructure flakes. Only 3 consecutive
        # failures trigger the alert (webhook + GitHub issue). This implements the
        # policy documented in docs/explanation/ci-gates.md § Acceptable-miss window.
        #
        # If ASSIGNEE_NIGHTLY_ALERT_WEBHOOK is unset the webhook curl is skipped;
        # the GitHub issue is always opened/updated (no secret required).
        if: failure()
        env:
          ASSIGNEE_NIGHTLY_ALERT_WEBHOOK: ${{ secrets.ASSIGNEE_NIGHTLY_ALERT_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Fetch the last 3 completed runs of this workflow (excluding the current one).
            const { data: runsData } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'nightly-e2e.yml',
              status: 'completed',
              per_page: 4,   // current run may or may not be in the list; fetch 4 to be safe
            });

            // Filter to the 3 most recent runs that are NOT the current run.
            const previousRuns = runsData.workflow_runs
              .filter(r => r.id !== context.runId)
              .slice(0, 3);

            // Count consecutive failures including the current one.
            // Walking previousRuns newest-first; break on first non-failure.
            let consecutiveCount = 1;
            for (const r of previousRuns) {
              if (r.conclusion === 'failure') consecutiveCount++;
              else break;
            }

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const runNumber = context.runNumber;

            core.info(`Consecutive nightly-e2e failures (including this run): ${consecutiveCount}`);

            if (consecutiveCount < 3) {
              core.info(`Only ${consecutiveCount} consecutive failure(s) — within acceptable-miss window; suppressing alert.`);
              return;
            }

            // 3+ consecutive failures — escalate.
            core.warning(`${consecutiveCount} consecutive nightly-e2e failures — escalating alert.`);

            // 1. Webhook (optional — skip if secret is unset).
            const webhookUrl = process.env.ASSIGNEE_NIGHTLY_ALERT_WEBHOOK;
            if (webhookUrl) {
              const payload = JSON.stringify({
                text: `Nightly E2E FAILED ${consecutiveCount}x consecutive (run #${runNumber}, commit ${sha.slice(0,8)}) — BLOCKER on merging to main`,
                run_url: runUrl,
                consecutive_failures: consecutiveCount,
              });
              const { execSync } = require('child_process');
              try {
                execSync(
                  `curl -sSf -X POST -H 'Content-Type: application/json' -d '${payload.replace(/'/g, "\\'")}' '${webhookUrl}'`,
                  { stdio: 'inherit' }
                );
                core.info('Alert webhook delivered.');
              } catch (e) {
                core.warning(`Alert webhook delivery failed — check ASSIGNEE_NIGHTLY_ALERT_WEBHOOK. Error: ${e.message}`);
              }
            } else {
              core.info('ASSIGNEE_NIGHTLY_ALERT_WEBHOOK not set — skipping webhook (opt-in).');
            }

            // 2. GitHub issue — open new or comment on existing.
            const label = 'nightly-e2e-alert';
            const title = 'Nightly E2E: 3+ consecutive failures — BLOCKER';
            const body = [
              `**${consecutiveCount} consecutive nightly-e2e failures detected.**`,
              '',
              `Latest failing run: [#${runNumber}](${runUrl})`,
              `Commit: \`${sha}\``,
              '',
              '**Required actions (see ci-gates.md § Alert escalation):**',
              '1. Check AWS Service Health Dashboard for the affected region.',
              '2. Reproduce locally: `RUN_E2E=1 pnpm vitest run src/e2e/nightly-destroy-smoke.test.ts`',
              '3. If code-related: open a P1 bug, assign to the last code-change owner.',
              '4. If AWS transient: add a `# skip-reason: AWS incident <ID>` annotation in the CI run summary.',
              '',
              '_This issue is auto-managed by `.github/workflows/nightly-e2e.yml`._',
            ].join('\n');

            // Ensure label exists (idempotent).
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd73a4a',
                description: 'Auto-opened when nightly-e2e fails 3+ consecutive times',
              });
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1,
            });

            if (openIssues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                body,
              });
              core.info(`Commented on existing alert issue #${openIssues[0].number}`);
            } else {
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body,
              });
              core.info(`Opened new alert issue #${newIssue.number}`);
            }
