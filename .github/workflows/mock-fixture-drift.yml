name: Mock Fixture Drift (CFN schemas)

# Story 48.2: detective control for mock fixture drift.
#
# Purpose: nightly compare the frozen
# `apps/cli/src/test-fixtures/mcp-mock-responses.ts` fixture
# (snapshotted 2026-03-22) against live AWS CloudFormation
# `DescribeType` responses for the top-20 supported resource types.
# Without this, schema changes in production silently diverge from
# the fixture-backed tests until a real user hits the gap.
#
# Credential strategy (pick one when provisioning the test account):
#   OPTION A (preferred) — GitHub OIDC + IAM role assume.
#     Set `AWS_DRIFT_READER_ROLE_ARN` as a repo variable
#     (`vars.AWS_DRIFT_READER_ROLE_ARN`). The role's trust policy
#     must allow the GH OIDC provider + the
#     `cloudformation:DescribeType` / `ListTypes` IAM permissions.
#
#   OPTION B (fallback) — scoped IAM-user secrets:
#     ASSIGNEE_DRIFT_READER_ACCESS_KEY_ID
#     ASSIGNEE_DRIFT_READER_SECRET_ACCESS_KEY
#   Names are intentionally DISTINCT from `ASSIGNEE_NIGHTLY_*`
#   so a misconfigured drift account cannot cross-leak into the
#   nightly-e2e workflow's account.
#
# The IAM principal only needs the read-only actions
# `cloudformation:DescribeType` and `cloudformation:ListTypes` —
# zero AWS cost, zero mutation, per Epic 48's "zero AWS cost" framing.
#
# Local invocation parity:
#   pnpm check:mock-fixture-drift
# (exits 0 with "skipped: no AWS credentials" log if creds are unset,
#  so local devs aren't blocked.)
#
# Baseline / re-baseline procedure is documented in
# `scripts/check-mock-fixture-drift.ts` header.

on:
  schedule:
    # 06:00 UTC daily — between nightly-e2e (03:00 UTC) and Europe
    # morning so drift surfaces before US standup.
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual ad-hoc runs from the Actions UI.

concurrency:
  group: mock-fixture-drift
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write       # required for OIDC aws-actions/configure-aws-credentials
  issues: write         # drift failure opens / updates a tracking issue
  actions: read         # read workflow run history for consecutive-failure check

jobs:
  drift-check:
    runs-on: ubuntu-latest
    # Fast job: 20 DescribeType calls + setup, typically <5 min.
    timeout-minutes: 15

    env:
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package (provides SUPPORTED_TYPES_ARRAY)
        # The drift script imports from packages/core/dist — same
        # pattern sibling scripts use (audit-iam-policies.ts).
        run: npx turbo build --filter=@assignee/core

      - name: Configure AWS credentials (OIDC preferred, secrets fallback)
        id: aws-creds
        # continue-on-error so a fresh repo without provisioned creds
        # doesn't produce a nightly red ❌. The verify step below
        # emits a visible warning annotation instead.
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DRIFT_READER_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.ASSIGNEE_DRIFT_READER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ASSIGNEE_DRIFT_READER_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify drift credentials are configured
        id: verify-creds
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] && [ -z "${AWS_WEB_IDENTITY_TOKEN_FILE:-}" ]; then
            echo "::warning::Drift check SKIPPED — no AWS credentials provisioned."
            echo "::warning::Set vars.AWS_DRIFT_READER_ROLE_ARN (OIDC) or the"
            echo "::warning::ASSIGNEE_DRIFT_READER_ACCESS_KEY_ID / _SECRET_ACCESS_KEY secret pair."
            echo "has-creds=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "AWS credentials resolved (OIDC or static)."
          echo "has-creds=true" >> "$GITHUB_OUTPUT"

      - name: Run mock-fixture drift check
        if: steps.verify-creds.outputs.has-creds == 'true'
        id: drift
        # Exit code policy from the script:
        #   0 = clean
        #   1 = runtime / AWS error
        #   2 = drift detected (report file written)
        run: pnpm check:mock-fixture-drift

      - name: Scrub logs before upload
        # W6-04: Redact telemetry/PII from logs before attaching to CI artefacts.
        if: failure()
        run: |
          if [ -f scripts/scrub-logs-for-upload.ts ]; then
            npx tsx scripts/scrub-logs-for-upload.ts ~/.assignee/logs/ || true
          else
            echo "scrub-logs-for-upload.ts not yet present — skipping (Worker B pending)"
          fi

      - name: Upload drift report
        if: failure() && steps.verify-creds.outputs.has-creds == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mock-fixture-drift-report-${{ github.run_number }}
          path: mock-fixture-drift-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write job summary on drift
        if: failure() && steps.verify-creds.outputs.has-creds == 'true' && hashFiles('mock-fixture-drift-report.json') != ''
        run: |
          {
            echo "## Mock fixture drift detected"
            echo ""
            count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('mock-fixture-drift-report.json','utf-8')).driftedTypeCount)")
            echo "**${count} resource type(s) drifted** vs \`apps/cli/src/test-fixtures/mcp-mock-responses.ts\`."
            echo ""
            echo "### Drifted types"
            node -e "
              const r = JSON.parse(require('fs').readFileSync('mock-fixture-drift-report.json','utf-8'));
              for (const d of r.drifts) {
                console.log('- **' + d.type + '** — ' + d.missingProperties.length + ' missing, ' + d.typeChangedProperties.length + ' type-changed');
              }
            "
            echo ""
            echo "Download the \`mock-fixture-drift-report-${{ github.run_number }}\` artifact for the full diff."
          } >> "$GITHUB_STEP_SUMMARY"

      # R9b-03 (P043): tracking issue opens on EVERY failure (drift OR
      # runtime error), not only when the report file exists. Runtime
      # errors (exit 1: bad creds, network blip) leave operators blind
      # without an issue; the body distinguishes the two failure modes
      # so the auto-pruner / triager can tell them apart.
      - name: Open or update tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Mock fixture drift detected (CFN schemas)"
          label="mock-fixture-drift"
          # Build the comment body. Two paths: drift-report present (exit 2)
          # vs. runtime-error path (exit 1; no report on disk).
          body_file=$(mktemp)
          if [ -f mock-fixture-drift-report.json ]; then
          {
            echo "Nightly drift check failed on run ${{ github.run_number }}."
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            node -e "
              const r = JSON.parse(require('fs').readFileSync('mock-fixture-drift-report.json','utf-8'));
              console.log('**' + r.driftedTypeCount + ' type(s) drifted**');
              console.log('');
              for (const d of r.drifts) {
                console.log('### ' + d.type);
                if (d.missingProperties.length) {
                  console.log('Missing in live schema: ' + d.missingProperties.map(p => '\`' + p + '\`').join(', '));
                }
                if (d.typeChangedProperties.length) {
                  console.log('Type-changed:');
                  for (const t of d.typeChangedProperties) {
                    console.log('  - \`' + t.property + '\`: fixture=' + JSON.stringify(t.fixtureType) + ', live=' + JSON.stringify(t.liveType));
                  }
                }
                console.log('');
              }
            "
            echo ""
            echo "Artifact: \`mock-fixture-drift-report-${{ github.run_number }}\` on this workflow run."
          } > "$body_file"
          else
          {
            echo "**Mock fixture drift workflow failed without producing a drift report.**"
            echo ""
            echo "This typically indicates a runtime error rather than a CFN-schema drift:"
            echo "credential resolution, network outage, AWS API throttling, or a bug in"
            echo "the drift checker itself. Inspect the workflow run logs to triage."
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "If runtime errors persist for ≥3 consecutive runs the webhook"
            echo "alert will also fire — see the next workflow step."
          } > "$body_file"
          fi

          # Dedupe: if an open issue with the label exists, comment; else create.
          existing=$(gh issue list --label "$label" --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$existing" ]; then
            echo "Updating existing drift issue #$existing"
            gh issue comment "$existing" --body-file "$body_file"
          else
            echo "Opening new drift issue"
            gh issue create --title "$title" --label "$label" --body-file "$body_file"
          fi

      - name: Check consecutive failures and alert (webhook)
        # P043: Flake-tolerance policy for mock-fixture-drift — single failures may
        # be transient (AWS DescribeType API hiccup). Only 3 consecutive failures
        # trigger the webhook alert. GitHub issue tracking (above step) fires on
        # every failure for full audit trail; the webhook is the escalation path.
        #
        # Uses ASSIGNEE_DRIFT_ALERT_WEBHOOK (separate routing from nightly-e2e).
        # Falls back to ASSIGNEE_NIGHTLY_ALERT_WEBHOOK if the dedicated secret is
        # unset, so a single webhook configuration covers both workflows.
        # Both are opt-in — if neither is set the webhook is skipped gracefully.
        if: failure()
        env:
          ASSIGNEE_DRIFT_ALERT_WEBHOOK: ${{ secrets.ASSIGNEE_DRIFT_ALERT_WEBHOOK }}
          ASSIGNEE_NIGHTLY_ALERT_WEBHOOK: ${{ secrets.ASSIGNEE_NIGHTLY_ALERT_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Fetch the last 3 completed runs of this workflow (excluding the current one).
            const { data: runsData } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mock-fixture-drift.yml',
              status: 'completed',
              per_page: 4,
            });

            const previousRuns = runsData.workflow_runs
              .filter(r => r.id !== context.runId)
              .slice(0, 3);

            let consecutiveCount = 1;
            for (const r of previousRuns) {
              if (r.conclusion === 'failure') consecutiveCount++;
              else break;
            }

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            core.info(`Consecutive mock-fixture-drift failures (including this run): ${consecutiveCount}`);

            if (consecutiveCount < 3) {
              core.info(`Only ${consecutiveCount} consecutive failure(s) — within acceptable-miss window; suppressing webhook alert.`);
              return;
            }

            core.warning(`${consecutiveCount} consecutive mock-fixture-drift failures — escalating webhook alert.`);

            // Prefer dedicated drift webhook; fall back to shared nightly webhook.
            const webhookUrl = process.env.ASSIGNEE_DRIFT_ALERT_WEBHOOK ||
                               process.env.ASSIGNEE_NIGHTLY_ALERT_WEBHOOK;

            if (!webhookUrl) {
              core.info('Neither ASSIGNEE_DRIFT_ALERT_WEBHOOK nor ASSIGNEE_NIGHTLY_ALERT_WEBHOOK is set — skipping webhook (opt-in).');
              return;
            }

            const payload = JSON.stringify({
              text: `Mock fixture drift FAILED ${consecutiveCount}x consecutive (run #${context.runNumber}, commit ${context.sha.slice(0,8)}) — re-baseline required`,
              run_url: runUrl,
              consecutive_failures: consecutiveCount,
              workflow: 'mock-fixture-drift',
            });

            const { execSync } = require('child_process');
            try {
              execSync(
                `curl -sSf -X POST -H 'Content-Type: application/json' -d '${payload.replace(/'/g, "\\'")}' '${webhookUrl}'`,
                { stdio: 'inherit' }
              );
              core.info('Drift alert webhook delivered.');
            } catch (e) {
              core.warning(`Drift alert webhook delivery failed. Error: ${e.message}`);
            }
