name: 'Assignee Apply'
description: 'Apply an approved assignee plan after PR merge'
branding:
  icon: 'cloud-lightning'
  color: 'green'

inputs:
  assignee-operator-access-key-id:
    description: 'Operator AWS access key ID for provisioning'
    required: true
  assignee-operator-secret-access-key:
    description: 'Operator AWS secret access key for provisioning'
    required: true
  aws-region:
    description: 'AWS region'
    required: false
    default: 'us-east-1'
  assignee-reader-access-key-id:
    description: 'AWS access key for reader MCP servers (read-only)'
    required: false
  assignee-reader-secret-access-key:
    description: 'AWS secret access key for reader MCP servers'
    required: false
  assignee-auditor-access-key-id:
    description: 'AWS access key for auditor MCP servers (audit access)'
    required: false
  assignee-auditor-secret-access-key:
    description: 'AWS secret access key for auditor MCP servers'
    required: false
  checkpoint:
    description: 'Path to plan checkpoint from PR phase'
    required: false
  intent-file:
    description: 'Path to file containing infrastructure intent'
    required: false
    default: 'assignee.intent'

outputs:
  apply-result:
    description: 'The apply result (success/failed)'
    value: ${{ steps.run-apply.outputs.apply-result }}
  resource-arn:
    description: 'ARN of the provisioned resource'
    value: ${{ steps.run-apply.outputs.resource-arn }}

runs:
  using: 'composite'
  steps:
    # ── Setup Python for MCP servers (uvx) ──────────────────────────────────
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install uvx
      shell: bash
      run: pip install uvx

    # ── Install assignee CLI ────────────────────────────────────────────────
    # Pulls the published CLI from npm. Requires v0.2+ published tarball;
    # the composite action is itself only usable after `private: true` is
    # flipped alongside the first `pnpm -r publish`. See
    # `.github/workflows/release.yml.disabled` for the publish gate.
    - name: Install assignee CLI
      shell: bash
      run: npm install -g @assignee/cli

    # ── Download checkpoint artifact ────────────────────────────────────────
    - name: Download checkpoint artifact
      if: inputs.checkpoint == ''
      id: download-checkpoint
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: assignee-plan-checkpoint
        path: .assignee/
      continue-on-error: true

    # ── Resolve checkpoint path ─────────────────────────────────────────────
    - name: Resolve checkpoint path
      id: resolve-checkpoint
      shell: bash
      run: |
        if [ -n "${{ inputs.checkpoint }}" ]; then
          echo "checkpoint-path=${{ inputs.checkpoint }}" >> "$GITHUB_OUTPUT"
          echo "has-checkpoint=true" >> "$GITHUB_OUTPUT"
        elif [ "${{ steps.download-checkpoint.outcome }}" = "success" ]; then
          # Find the most recent checkpoint file
          CHECKPOINT=$(ls -t .assignee/checkpoint-*.json 2>/dev/null | head -1)
          if [ -n "$CHECKPOINT" ]; then
            echo "checkpoint-path=$CHECKPOINT" >> "$GITHUB_OUTPUT"
            echo "has-checkpoint=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-checkpoint=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "has-checkpoint=false" >> "$GITHUB_OUTPUT"
        fi

    # ── Run assignee apply with checkpoint ──────────────────────────────────
    - name: Run assignee apply (with checkpoint)
      id: run-apply-checkpoint
      if: steps.resolve-checkpoint.outputs.has-checkpoint == 'true'
      shell: bash
      env:
        ASSIGNEE_OPERATOR_ACCESS_KEY_ID: ${{ inputs.assignee-operator-access-key-id }}
        ASSIGNEE_OPERATOR_SECRET_ACCESS_KEY: ${{ inputs.assignee-operator-secret-access-key }}
        AWS_REGION: ${{ inputs.aws-region }}
        ASSIGNEE_READER_ACCESS_KEY_ID: ${{ inputs.assignee-reader-access-key-id || inputs.assignee-operator-access-key-id }}
        ASSIGNEE_READER_SECRET_ACCESS_KEY: ${{ inputs.assignee-reader-secret-access-key || inputs.assignee-operator-secret-access-key }}
        ASSIGNEE_AUDITOR_ACCESS_KEY_ID: ${{ inputs.assignee-auditor-access-key-id || inputs.assignee-operator-access-key-id }}
        ASSIGNEE_AUDITOR_SECRET_ACCESS_KEY: ${{ inputs.assignee-auditor-secret-access-key || inputs.assignee-operator-secret-access-key }}
      run: |
        # W6-02: `|| true` removed — let the shell propagate the real exit code.
        # The parse-apply-result step below reads raw output and infers success/failed.
        APPLY_OUTPUT=$(assignee apply --yes --checkpoint "${{ steps.resolve-checkpoint.outputs.checkpoint-path }}" 2>&1)
        EXIT_CODE=$?
        echo "apply-output<<APPLY_EOF" >> "$GITHUB_OUTPUT"
        echo "$APPLY_OUTPUT" >> "$GITHUB_OUTPUT"
        echo "APPLY_EOF" >> "$GITHUB_OUTPUT"
        exit $EXIT_CODE

    # ── Run assignee apply without checkpoint (fallback) ────────────────────
    - name: Run assignee apply (from intent, no checkpoint)
      id: run-apply-intent
      if: steps.resolve-checkpoint.outputs.has-checkpoint == 'false'
      shell: bash
      env:
        ASSIGNEE_OPERATOR_ACCESS_KEY_ID: ${{ inputs.assignee-operator-access-key-id }}
        ASSIGNEE_OPERATOR_SECRET_ACCESS_KEY: ${{ inputs.assignee-operator-secret-access-key }}
        AWS_REGION: ${{ inputs.aws-region }}
        ASSIGNEE_READER_ACCESS_KEY_ID: ${{ inputs.assignee-reader-access-key-id || inputs.assignee-operator-access-key-id }}
        ASSIGNEE_READER_SECRET_ACCESS_KEY: ${{ inputs.assignee-reader-secret-access-key || inputs.assignee-operator-secret-access-key }}
        ASSIGNEE_AUDITOR_ACCESS_KEY_ID: ${{ inputs.assignee-auditor-access-key-id || inputs.assignee-operator-access-key-id }}
        ASSIGNEE_AUDITOR_SECRET_ACCESS_KEY: ${{ inputs.assignee-auditor-secret-access-key || inputs.assignee-operator-secret-access-key }}
      run: |
        INTENT=""
        if [ -f "${{ inputs.intent-file }}" ]; then
          INTENT=$(cat "${{ inputs.intent-file }}")
        fi

        if [ -z "$INTENT" ]; then
          echo "::error::No checkpoint and no intent file found. Cannot apply."
          echo "apply-output=No checkpoint or intent file found" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        # W6-02: `|| true` removed — let the shell propagate the real exit code.
        APPLY_OUTPUT=$(assignee apply --yes "$INTENT" 2>&1)
        EXIT_CODE=$?
        echo "apply-output<<APPLY_EOF" >> "$GITHUB_OUTPUT"
        echo "$APPLY_OUTPUT" >> "$GITHUB_OUTPUT"
        echo "APPLY_EOF" >> "$GITHUB_OUTPUT"
        exit $EXIT_CODE

    # ── Parse apply result ──────────────────────────────────────────────────
    - name: Parse apply result
      id: run-apply
      shell: bash
      run: |
        RAW_OUTPUT="${{ steps.run-apply-checkpoint.outputs.apply-output }}${{ steps.run-apply-intent.outputs.apply-output }}"

        # Infer result from the upstream step outcomes (W6-02: real exit codes propagate now)
        RESULT="success"
        if [ "${{ steps.run-apply-checkpoint.outcome }}" = "failure" ] || \
           [ "${{ steps.run-apply-intent.outcome }}" = "failure" ]; then
          RESULT="failed"
        fi
        # Secondary check: grep the output for explicit error markers
        if echo "$RAW_OUTPUT" | grep -qi "error\|failed\|failure"; then
          RESULT="failed"
        fi
        echo "apply-result=$RESULT" >> "$GITHUB_OUTPUT"

        # Try to extract ARN from output
        ARN=$(echo "$RAW_OUTPUT" | grep -oE 'arn:aws[\w-]*:[a-zA-Z0-9\-]+:[a-zA-Z0-9\-]*:[0-9]*:[a-zA-Z0-9\-_/:.]+' | head -1 || true)
        echo "resource-arn=$ARN" >> "$GITHUB_OUTPUT"

        # W7-04: Write raw output to a file artefact instead of injecting it
        # into the github-script template. The post-comment step reads from
        # the output file to avoid template-literal injection risk.
        echo "$RAW_OUTPUT" > /tmp/assignee-apply-output.txt

        # Pass raw output for comment (structured fields only — no LLM interpolation)
        echo "raw-output<<RAW_EOF" >> "$GITHUB_OUTPUT"
        echo "$RAW_OUTPUT" >> "$GITHUB_OUTPUT"
        echo "RAW_EOF" >> "$GITHUB_OUTPUT"

    # ── Post merge commit comment ───────────────────────────────────────────
    - name: Post merge commit comment
      if: always()
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        # W7-04: LLM-emitted content is NOT interpolated as a template literal.
        # `applyResult` and `resourceArn` are structured fields extracted by
        # the parse step (grep on CLI output). `rawOutput` is passed via the
        # GITHUB_OUTPUT delimiter mechanism and then read from the file
        # artefact inside the script — no direct template injection.
        script: |
          const fs = require('fs');
          const applyResult = `${{ steps.run-apply.outputs.apply-result }}`;
          const resourceArn = `${{ steps.run-apply.outputs.resource-arn }}`;
          // Read raw output from the file artefact (W7-04 file artefact pattern)
          let rawOutput = '';
          try {
            rawOutput = fs.readFileSync('/tmp/assignee-apply-output.txt', 'utf8');
          } catch {
            rawOutput = `${{ steps.run-apply.outputs.raw-output }}`;
          }
          const script = require('./post-comment.js');
          await script({ github, context, applyResult, resourceArn, rawOutput });
      env:
        GITHUB_TOKEN: ${{ github.token }}
