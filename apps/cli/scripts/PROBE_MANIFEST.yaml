          | map(.CreditSpecification // {})
          | any(.CPUCredits == "standard"))' \
        >/dev/null 2>&1; then
        echo "[PROBE-FAIL] CreditSpecification.CPUCredits == \"standard\" not present in any plan's desiredState" >&2
        exit 1
      fi

  - story: e98.W2.R2
    name: w2-r2-plugin-default-empty-leaf
    description: |
      Epic 98 Wave 2 R2 — `mergePluginDefaults` empty-leaf backfill.
      Closes the Epic 97 C-R1 live-FAIL: on larger EC2 intents (e.g.
      `Create an EC2 instance t3.large with 100GB gp3 volume`) the LLM
      emits `CreditSpecification: {}`. The old merge guard
      `if (result[key] !== undefined) continue;` treated `{}` as a real
      user value and skipped the plugin default `{CPUCredits: "standard"}`,
      so the "CPU Credits" plan row re-blanked. Fixed in
      `packages/core/src/graph/nodes/plan-generator/llm-plan/merge.ts`
      by introducing an exported `isEmptyLeaf()` helper (true for
      undefined / null / {} / [] / "") and swapping the guard to
      `!isEmptyLeaf(...)`. Object-valued plugin defaults now deep-merge
      into partial LLM shells so LLM-emitted sub-keys win AND missing
      sub-keys pick up the plugin default. Epic 96 W2.R5's probe only
      covered t3.micro (plugin default path, no LLM conflict); the
      larger-intent case survived.
