      - cmd: 'plan "Create an ECS task definition with APP_ENV=production" --json'
        assertions: "BP-ECS-004 does NOT fire on APP_ENV (safe env)"
      - cmd: 'plan "Create an ECS task with env PORT=8080" --json'
