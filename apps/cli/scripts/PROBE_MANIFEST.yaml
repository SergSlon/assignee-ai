      if ! printf '%s' "$envelope" | jq -e \
        '([.plan.desiredState // {}, (.plans // [])[]?.desiredState // {}]
          | map(.CreditSpecification // {})
          | any(.CPUCredits != null and .CPUCredits != ""))' \
