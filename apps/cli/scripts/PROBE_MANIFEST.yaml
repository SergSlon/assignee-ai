# PROBE_MANIFEST.yaml
#
# Catalogue of pre-close probes keyed by story-ID. Each probe is a small
# bash block that sources dogfood-probe-lib.sh and calls one or more
# assert_* helpers. A probe passes if the assert exits 0; fails otherwise.
#
# Schema (minimal; parsed by pre-close-probes.sh with a bash parser):
#   probes:
#     - story:              <story-id>
#       name:               <human-readable name>
#       description:        <one-line sentence>
#       must_fail_pre_fix:  true | false  # true = gate tripwire against CURRENT tree
#       variations:                       # REQUIRED: ≥ 3 per Epic 98 M2
#         - cmd: "<exact command>"
#           assertions: "<brief description of what's asserted>"
#         - cmd: "<second variant>"
#           assertions: "..."
#         - cmd: "<third variant>"
#           assertions: "..."
#       known_tripwires:                  # OPTIONAL: forcing-flip witnesses
#         - cmd: "<live-FAIL command>"
#           expected_exit: "non-zero"     # "zero" | "non-zero" | "<N>"
#           expected_fail_anchor: "..."   # grep substring proving the bug
#       probe: |
#         <multi-line bash block; runs under `set -euo pipefail`>
#
# Conventions:
#   - Exit 0 = pass, non-zero = fail. The runner flips interpretation when
#     `must_fail_pre_fix: true`.
#   - Do not `source .env` inside the probe — the runner exports
#     PROBE_CLI_BIN and PROBE_REPO_ROOT so probes are portable.
#   - Keep each probe < 5s wall-clock for normal CI; probes that spawn
#     the graph may take 20-60s on cold cache — tolerate and cache.
#   - Every entry MUST declare ≥ 3 variations (Epic 98 M2). Epic 96's narrow
#     single-phrasing probes silently rubber-stamped 3 live bugs (B-09, C-R1,
#     B-11); the declarative variations list makes coverage gaps visible at
#     schema-load time, enforced by `pre-close-probes.sh --strict-multi-variation`
#     and by Contract G in shipped-wired-contract.test.ts.
#   - `known_tripwires` entries are the exact live-FAIL commands that a fix
#     must flip green. Epic 98 seeds B-09 (W1.B3 regression), C-R1 (W2.R5
#     regression), B-11 (W3.N1 regression). `--tripwire-only` runs these and
#     returns 0 when they fail as expected (forcing-flip witnesses); once the
#     Wave 2 fix lands the witnesses flip to PASS, and the story author
#     removes the known_tripwires block in the same commit.
#
# Seeded with the 3 Wave-1 BLOCKERs (B1/B2/B3) + two duplicated-Examples
# tripwires (B4/B5). Subsequent Wave 1/2 stories add their probes here.

probes:

  - story: e96.W1.B1
    name: lambda-compound-no-fnname-leak
    description: |
      Lambda compound pattern (lambda-with-exec-role) must NOT emit
      FunctionName on the IAM::Role slot. The Role slot is for the
      exec role; FunctionName belongs on AWS::Lambda::Function only.
      Catches A-01 redux. Fixed in e96.W1.B1 via
      `filterElicitedForSlot` in
      packages/core/src/graph/nodes/plan-generator/compound-helpers.ts
      — drops name-fields bound to a different resource type before
      they spread into the slot's desiredState.
    must_fail_pre_fix: false
    variations:
      - cmd: 'plan "create lambda-with-exec-role named my-fn handler handler.main runtime nodejs20.x" --json'
        assertions: "AWS::IAM::Role slot does NOT contain FunctionName key (name-field filter)"
      - cmd: 'plan "create lambda with role named api-handler handler index.main runtime nodejs20.x" --json'
        assertions: "AWS::IAM::Role slot rejects FunctionName with alt phrasing (compound-keyword variant)"
      - cmd: 'plan "lambda-with-exec-role called processor handler worker.run runtime python3.11" --json'
        assertions: "AWS::IAM::Role slot rejects FunctionName with 'called' name token + python runtime"
    known_tripwires: []
    probe: |
      assert_desired_state_missing_key_on_type \
        "AWS::IAM::Role" \
        "FunctionName" \
        $PROBE_CLI_BIN plan \
          "create lambda-with-exec-role named my-fn handler handler.main runtime nodejs20.x" \
          --json

  - story: e96.W1.B2
    name: apply-exit-matches-ok-on-provision-failure
    description: |
      `apply` with an intent that fails at CloudControl provisioning
      time (e.g. an invalid S3 bucket name like 'invalid..name' that
      the validator should reject but the apply path currently accepts
      and then fails at AWS) must report ok:false AND exit non-zero.
      Previously emitted {ok:true, operation:"apply"} with exit 0
      despite the internal "result: FAILED" log — fixed in Epic 96
      Wave 1 B2 by surfacing orchestrator `success=false` as a thrown
      AssigneeError in the CLI wrapper.
    must_fail_pre_fix: false
    variations:
      - cmd: 'apply "create S3 bucket named invalid..name" --yes --json'
        assertions: "adjacent-dot bucket name → ok:false, exit non-zero (validator rejects)"
      - cmd: 'apply "create S3 bucket named INVALID-UPPER" --yes --json'
        assertions: "uppercase bucket name → ok:false, exit non-zero (S3 naming rule)"
      - cmd: 'apply "create S3 bucket named a" --yes --json'
        assertions: "1-char bucket name → ok:false, exit non-zero (min length 3)"
    known_tripwires: []
    probe: |
      # The bucket name "invalid..name" has adjacent dots, which S3
      # rejects. The validator or apply path must surface that as
      # ok:false + non-zero exit. Using `true` to swallow the (currently
      # zero) exit of the CLI inside the pipeline is intentional; the
      # helper captures and inspects the exit itself.
      assert_exit_code_matches_ok non-zero false \
        $PROBE_CLI_BIN apply "create S3 bucket named invalid..name" --yes --json

  - story: e96.W1.B3
    name: region-regex-no-substring-false-positive
    description: |
      Region extraction must not match a region-shaped substring
      nested inside another token. Example: the bucket name
      'my-bucket-us-east-1-fake' contains 'us-east-1' as a substring,
      but the intent also names a real region ('eu-west-2'). Fixed
      in e96.W1.B3 by swapping JS `\b` anchors for explicit
      whitespace/string-boundary lookaround in `extractRegion`
      (packages/core/src/graph/nodes/intent-parser.ts). `\b` treats
      `-` as a word-boundary, which let the old regex match
      region-shaped substrings inside hyphenated identifiers.

      Epic 98 M2 retrofit — 5 variations cover (a) alpha-alpha-digit
      name tripwire (`my-abc-1` — Epic 97 B-09 live-FAIL), (b) explicit
      region tail winning over substring, (c) bucket with region-
      substring in NAME, (d) explicit `in us-west-2`, (e) bare intent
      defaulting region. Variant (a) currently FAILs against HEAD;
      Wave 2 e98.W2.R1 must flip it to PASS.
    must_fail_pre_fix: false
    variations:
      - cmd: 'plan "Create a lambda named my-abc-1" --json'
        assertions: "alpha-alpha-digit name does NOT trigger region false-positive; plan.region defaults"
      - cmd: 'plan "create S3 bucket named my-bucket-us-east-1-fake region eu-west-2" --json'
        assertions: "explicit region tail (eu-west-2) wins over substring match inside name"
      - cmd: 'plan "create S3 bucket named log-ap-northeast-2-archive" --json'
        assertions: "region-shaped substring inside name does NOT clobber default region"
      - cmd: 'plan "Create a lambda named my-fn in us-west-2" --json'
        assertions: "explicit `in us-west-2` tail lifted into plan.region"
      - cmd: 'plan "Create an S3 bucket" --json'
        assertions: "bare intent produces plan with default region (no parse failure)"
    # e98.W2.R1 removed the `my-abc-1` tripwire after landing the two-pass
    # region extractor (tail wins + name-span masking). The invariant is
    # now enforced by the `w2-r1-region-regex` probe below plus the unit
    # test suite intent-parser-region-scoping-variations.test.ts.
    known_tripwires: []
    probe: |
      # Expect: plan succeeds (ok:true) because the user IS specifying
      # a valid region (eu-west-2). The bucket-name substring
      # "us-east-1" should NOT trigger region-parse failure.
      assert_exit_code_matches_ok zero true \
        $PROBE_CLI_BIN plan \
          "create S3 bucket named my-bucket-us-east-1-fake region eu-west-2" \
          --json

  - story: e98.W2.R1
    name: w2-r1-region-regex
    description: |
      Epic 98 Wave 2 R1 — region-regex scope fix (B-09 + B-10).
      Closes the Epic 97 live-FAIL `Create a lambda named my-abc-1` where
      the parser rejected the intent with `Unknown AWS region "my-abc-1"`.
      Root cause: region regex `[a-z]{2,3}(?:-[a-z]+){1,3}-\d+` matched
      the user's alpha-alpha-digit resource name. Fix: two-pass extractor
      in `packages/core/src/graph/nodes/intent-parser.ts extractRegion`
      — (1) explicit tail `region <X>` / `in <X>` / `at <X>` wins, (2)
      fallback scan runs against an intent with `named <X>` / `called
      <X>` / `name=<X>` spans masked out. Epic 96 W1.B3 paper-closed the
      substring-inside-name case but never asserted the tail-wins or
      name-masking invariants, letting the name-shaped bug survive.
    must_fail_pre_fix: false
    variations:
      - cmd: 'plan "Create a lambda named my-abc-1" --json'
        assertions: "alpha-alpha-digit name does NOT trigger Unknown-region error"
      - cmd: 'plan "Create an S3 bucket named my-bucket-us-east-1-fake region eu-west-2" --json'
        assertions: "explicit `region` tail wins over in-name substring"
      - cmd: 'plan "Create an SQS queue named sqs-json-1776927324" --json'
        assertions: "name with three-letter prefix + digit tail does NOT trigger region false-positive"
      - cmd: 'plan "Create an S3 bucket" --json'
        assertions: "bare intent produces plan with default region (no parse failure)"
      - cmd: 'plan "Create a lambda in us-west-2 named my-fn" --json'
        assertions: "explicit `in us-west-2` tail lifted into plan without conflict with name"
    known_tripwires: []
    probe: |
      # Variation 1 — the Epic 97 B-09 live-FAIL. After the fix this
      # must PASS with ok:true.
      assert_exit_code_matches_ok zero true \
        $PROBE_CLI_BIN plan "Create a lambda named my-abc-1" --json

  - story: e96.W1.B4
    name: plan-help-single-examples
    description: |
      `plan --help` must emit exactly 1 `Examples:` heading.
      Fixed in Epic 96 Wave 1 B2 by removing the embedded `Examples:`
      block from `buildSupportedTypesBlock()` — the per-command
      `addHelpText` blocks are now the only carriers of `Examples:`.
    must_fail_pre_fix: false
    variations:
      - cmd: "plan --help"
        assertions: "`plan --help` emits exactly 1 `Examples:` heading"
      - cmd: "plan -h"
        assertions: "short-flag alias emits exactly 1 `Examples:` heading (shared helptext)"
      - cmd: "help plan"
        assertions: "Commander `help <cmd>` invocation emits exactly 1 `Examples:` heading"
    known_tripwires: []
    probe: |
      assert_single_examples_block $PROBE_CLI_BIN plan --help

  - story: e96.W1.B5
    name: apply-help-single-examples
    description: |
      `apply --help` must emit exactly 1 `Examples:` heading. Same
      class as B4 (A-04/D-01/D-08). Fixed alongside B4 — shared root
      cause was `buildSupportedTypesBlock()` embedding its own
      `Examples:` section.
    must_fail_pre_fix: false
    variations:
      - cmd: "apply --help"
        assertions: "`apply --help` emits exactly 1 `Examples:` heading"
      - cmd: "apply -h"
        assertions: "short-flag alias emits exactly 1 `Examples:` heading"
      - cmd: "help apply"
        assertions: "Commander `help apply` invocation emits exactly 1 `Examples:` heading"
    known_tripwires: []
    probe: |
      assert_single_examples_block $PROBE_CLI_BIN apply --help

  - story: e96.W3.N2
    name: bp-sg-high-risk-no-fire-on-443
    description: |
      A port-443-only security group must NOT surface the "high-risk
      DB ports" best-practice (BP-SG-004). The rule's description
      copy is explicitly DB-focused ("Databases open to the internet
      get scanned within minutes…"); firing it on HTTPS trains users
      to ignore a HIGH severity. Fixed in Epic 96 W3.N2 by swapping
      BP-SG-004 from `check_type: awareness` (always fires) to a new
      `check_type: sg_high_risk_public_exposure` that only fires when
      an ingress rule opens 0.0.0.0/0 to one of the DB/admin ports
      listed in the Trusted Advisor HCP4007jGY catalogue (+ MongoDB
      27017 / Redis 6379 / Elasticsearch 9200).
    must_fail_pre_fix: false
    variations:
      - cmd: 'plan "Create a security group allowing 0.0.0.0/0 on port 443" --json'
        assertions: "BP-SG-004 does NOT fire on HTTPS (not a DB/admin port)"
      - cmd: 'plan "Create a security group allowing 0.0.0.0/0 on port 80" --json'
        assertions: "BP-SG-004 does NOT fire on HTTP (not a DB/admin port)"
      - cmd: 'plan "Create a security group allowing 0.0.0.0/0 on port 8080" --json'
        assertions: "BP-SG-004 does NOT fire on non-DB port 8080"
    known_tripwires: []
    probe: |
      assert_no_bp_finding_id BP-SG-004 \
        $PROBE_CLI_BIN plan \
          "Create a security group allowing 0.0.0.0/0 on port 443" \
          --json

  - story: e96.W3.N2
    name: bp-sg-high-risk-fires-on-3306
    description: |
      Counter-probe for the BP-SG-004 narrowing. A security group
      opening port 3306 (MySQL) to 0.0.0.0/0 MUST still surface
      BP-SG-004 — that is the canonical DB-port exposure the rule
      was designed to catch. Guards against an over-enthusiastic
      narrowing that silently drops the rule on the intent it is
      supposed to flag.
    must_fail_pre_fix: false
    variations:
      - cmd: 'plan "Create a security group allowing 0.0.0.0/0 on port 3306" --json'
        assertions: "BP-SG-004 fires on MySQL (3306) exposed to world"
      - cmd: 'plan "Create a security group allowing 0.0.0.0/0 on port 5432" --json'
        assertions: "BP-SG-004 fires on PostgreSQL (5432) exposed to world"
      - cmd: 'plan "Create a security group allowing 0.0.0.0/0 on port 27017" --json'
        assertions: "BP-SG-004 fires on MongoDB (27017) exposed to world"
    known_tripwires: []
    probe: |
      assert_bp_finding_id_present BP-SG-004 \
        $PROBE_CLI_BIN plan \
          "Create a security group allowing 0.0.0.0/0 on port 3306" \
          --json

  - story: e96.W2.R3
    name: short-hint-delegates-to-cli-block
    description: |
      Epic 96 Wave 2 R3 (D-03): the "short" supported-types hint used
      to hand-maintain its own grouped grid — a subset of the CLI grid
      that silently drifted behind the registry as Epic 92/94 added
      types. Fix makes `renderSupportedTypesHintShort` delegate to
      `buildSupportedTypesBlock()` so the error-path hint and the
      `--help` hint share a single source of truth. Probe asserts that
      every family header emitted on `plan --help` is also present in
      the intent-parser errorMessage surfaced via an unsupported-type
      intent. Both surfaces must render the same 10 groups.
    must_fail_pre_fix: false
    variations:
      - cmd: 'plan --help && plan "Create a quantum computer" --json'
        assertions: "10 family group headers (Compute/Storage/Databases/Networking/Edge-CDN/API/Messaging/Security/Containers/Observability) present in BOTH help text and error hint"
      - cmd: 'plan "Create a time machine" --json'
        assertions: "unsupported-intent error hint includes all 10 group headers (shared renderer)"
      - cmd: 'apply "Create a unicorn" --yes --json'
        assertions: "apply error surface shares same group headers (cross-command consistency)"
    known_tripwires: []
    probe: |
      cli_out="$($PROBE_CLI_BIN plan --help 2>&1)"
      err_out="$($PROBE_CLI_BIN plan 'Create a quantum computer' --json 2>&1 || true)"
      for group in Compute Storage Databases Networking "Edge / CDN" \
                   API Messaging Security Containers Observability; do
        if ! printf '%s' "$cli_out" | grep -Fq "$group"; then
          echo "[PROBE-FAIL] plan --help missing group header: $group" >&2
          exit 1
        fi
        if ! printf '%s' "$err_out" | grep -Fq "$group"; then
          echo "[PROBE-FAIL] intent-parser error hint missing group header: $group" >&2
          exit 1
        fi
      done

  - story: e96.W2.R4
    name: init-wizard-alias-registered
    description: |
      Epic 96 Wave 2 R4 (D-05): `init --wizard` must be registered as
      an accepted flag. Pre-fix, `init --wizard` emitted Commander's
      "error: unknown option" — inconsistent with `plan --wizard` and
      `apply --wizard` which both accept the flag. Fix registers
      `--wizard` on init with mutual-exclusivity vs `--yes`. Probe
      checks: (a) `init --help` lists --wizard, (b) `init --wizard
      --yes` errors with an actionable mutually-exclusive message +
      exit 1 (never hangs, never silently accepts).
    must_fail_pre_fix: false
    variations:
      - cmd: "init --help"
        assertions: "--wizard flag listed in init --help output"
      - cmd: "init --wizard --yes --region us-east-1"
        assertions: "mutual-exclusivity: exits non-zero with `mutually exclusive` message"
      - cmd: "init --wizard --yes --global --region us-east-1"
        assertions: "global+wizard+yes combo still rejected (mutual-exclusivity applies to global too)"
    known_tripwires: []
    probe: |
      help_out="$($PROBE_CLI_BIN init --help 2>&1)"
      if ! printf '%s' "$help_out" | grep -q -- '--wizard'; then
        echo "[PROBE-FAIL] init --help does not list --wizard" >&2
        exit 1
      fi
      # Mutual-exclusivity: --wizard + --yes must exit non-zero with
      # an actionable error message. Run under isolated HOME so the
      # actual config file is not touched.
      tmp_home="$(mktemp -d -t assignee-init-wizard-probe.XXXXXX)"
      trap 'rm -rf "$tmp_home"' EXIT
      set +e
      combined="$(HOME="$tmp_home" $PROBE_CLI_BIN init --wizard --yes \
          --region us-east-1 </dev/null 2>&1)"
      rc=$?
      set -e
      if [[ "$rc" -eq 0 ]]; then
        echo "[PROBE-FAIL] init --wizard --yes exited 0; expected non-zero" >&2
        exit 1
      fi
      if ! printf '%s' "$combined" | grep -qi 'mutually exclusive'; then
        echo "[PROBE-FAIL] init --wizard --yes did not emit mutually-exclusive message" >&2
        exit 1
      fi

  - story: e96.W3.N4
    name: json-mode-stderr-no-human-error-blocks
    description: |
      Epic 96 Wave 3 N4 (D-04): under `--output json` / `--json`, stderr
      must NOT carry the renderError human blocks (`[ERROR] ...` /
      `[CONTEXT] ...` / `[FIX] ...`) that duplicate the payload already
      on stdout as the error envelope. Structured JSON log lines on
      stderr are legitimate and pass through. Probe drives apply AND
      plan with an unsupported intent (`--json`) and asserts per
      surface: (a) stdout is a single parseable `{ok:false,error:...}`
      envelope, (b) stderr contains zero `[ERROR]/[CONTEXT]/[FIX]`
      lines, (c) stderr still carries at least one structured JSON log
      line (filter is surgical, not a blackhole), (d) exit non-zero.
      Covers the four cli-fixer-owned JSON surfaces (apply / plan —
      plan follow-up landed alongside this commit; destroy / reconcile
      share the same helper).
    must_fail_pre_fix: false
    variations:
      - cmd: 'apply "Create a quantum entanglement device" --yes --json'
        assertions: "apply --json: stderr lacks [ERROR]/[CONTEXT]/[FIX]; stdout has {ok:false,error.code}"
      - cmd: 'plan "Create a quantum entanglement device" --json'
        assertions: "plan --json: stderr lacks human error blocks; stdout envelope valid"
      - cmd: 'plan "Create a time machine" --output json'
        assertions: "--output json alias yields same surgical filter as --json"
    known_tripwires: []
    probe: |
      out_file="$(mktemp)"
      err_file="$(mktemp)"
      trap 'rm -f "$out_file" "$err_file"' EXIT

      # Shared per-surface assertion. Args after $1 are the CLI invocation.
      check_cmd() {
        local label="$1"
        shift
        set +e
        "$@" >"$out_file" 2>"$err_file"
        local rc=$?
        set -e
        if ! jq -e '.ok == false' "$out_file" >/dev/null 2>&1; then
          echo "[PROBE-FAIL] [$label] stdout is not a valid ok:false envelope" >&2
          head -20 "$out_file" >&2
          return 1
        fi
        if ! jq -e '.error.code' "$out_file" >/dev/null 2>&1; then
          echo "[PROBE-FAIL] [$label] stdout envelope missing .error.code" >&2
          return 1
        fi
        local human_lines
        human_lines="$(grep -cE '^(\[ERROR\]|\[CONTEXT\]|\[FIX\]) ' "$err_file" || true)"
        if [[ "$human_lines" -gt 0 ]]; then
          echo "[PROBE-FAIL] [$label] stderr has $human_lines human renderError lines" >&2
          head -20 "$err_file" >&2
          return 1
        fi
        if ! grep -qE '^\{"' "$err_file"; then
          echo "[PROBE-FAIL] [$label] stderr missing structured JSON log lines" >&2
          return 1
        fi
        if [[ "$rc" -eq 0 ]]; then
          echo "[PROBE-FAIL] [$label] --json on failure exited 0" >&2
          return 1
        fi
        return 0
      }

      check_cmd "apply" $PROBE_CLI_BIN apply \
        "Create a quantum entanglement device" --yes --json || exit 1
      check_cmd "plan" $PROBE_CLI_BIN plan \
        "Create a quantum entanglement device" --json || exit 1

  - story: e96.W2.R2
    name: init-global-yes-non-interactive
    description: |
      `init --global --yes --region <r> --auto-fix <mode>` must run to
      completion with no interactive prompts under a non-TTY stdin.
      Pre-fix the global wizard called `clack.text` unconditionally for
      the region prompt, so `init --global --yes </dev/null` hung
      forever despite the user having opted in. Fixed in Epic 96 Wave 2
      R2 by threading `NonInteractiveOverrides` from `runGlobalInit`
      through `promptGlobalConfig`. The probe drives the command with
      a 10-second hard timeout — if the wrapper hangs, timeout returns
      124 and the probe fails.
    must_fail_pre_fix: false
    variations:
      - cmd: "init --global --yes --region us-east-1 --auto-fix ask"
        assertions: "10s timeout: completes, writes config with region + auto_fix"
      - cmd: "init --global --yes --region eu-west-1 --auto-fix always"
        assertions: "non-default region + auto_fix mode threaded through"
      - cmd: "init --global --yes --region ap-southeast-2 --auto-fix never"
        assertions: "auto_fix=never mode accepted; no prompt hang"
    known_tripwires: []
    probe: |
      # Isolate HOME so the probe writes to a tempdir, not the real
      # user's ~/.config/assignee. mktemp -d gives us a fresh sandbox
      # every run and the final rm -rf keeps the CI workspace clean.
      tmp_home="$(mktemp -d -t assignee-init-probe.XXXXXX)"
      trap 'rm -rf "$tmp_home"' EXIT
      # 10s timeout: the real command writes the YAML in < 1s even on
      # cold Node; anything over 10s means the wizard hung on a prompt.
      # </dev/null forces stdin to be a pipe, reproducing the CI case
      # that tripped D-39 the first time.
      if ! HOME="$tmp_home" timeout 10 $PROBE_CLI_BIN init --global \
          --yes --region us-east-1 --auto-fix ask </dev/null >/dev/null 2>&1; then
        echo "[PROBE-FAIL] init --global --yes exited non-zero or hung" >&2
        exit 1
      fi
      # Config must exist AND embed the pinned region — proves the
      # overrides actually reached the wizard (not just that the
      # command exited fast).
      cfg="$tmp_home/.config/assignee/config.yaml"
      if [[ ! -f "$cfg" ]]; then
        echo "[PROBE-FAIL] expected config at $cfg, not found" >&2
        exit 1
      fi
      if ! grep -q "region: us-east-1" "$cfg"; then
        echo "[PROBE-FAIL] config at $cfg missing region: us-east-1" >&2
        exit 1
      fi
      if ! grep -q "auto_fix: ask" "$cfg"; then
        echo "[PROBE-FAIL] config at $cfg missing auto_fix: ask" >&2
        exit 1
      fi

  - story: e96.W2.R5
    name: ec2-credit-specification-survives-sanitizer
    description: |
      Epic 92 Wave 4.b fix seeded a plan-time default of
      `{CreditSpecification: {CpuCredits: "standard"}}` on the EC2
      plugin to kill the blank "CPU Credits" plan row. Epic 95 flagged
      that the plan row still rendered blank (C-01 regression). Root
      cause: the CFN Registry schema's sub-key is `CPUCredits`
      (uppercase `CPU`), not `CpuCredits`. The sanitizer correctly
      stripped the mis-cased sub-key, leaving `CreditSpecification: {}`
      on the plan. Fixed in e96.W2.R5 by aligning the plugin facade
      (`ec2-instance.ts`) and the enum field's `toCfn`
      (`ec2-instance/fields.ts`) to emit the schema-correct casing.

      Epic 98 M2 retrofit — 4 variations cover (a) t3.micro baseline,
      (b) t3.large + 100GB tripwire (Epic 97 C-R1 live-FAIL — the
      merge-skip bug strips CreditSpecification when the LLM emits
      {}), (c) stub-LLM `{CreditSpecification:{}}` empty shell,
      (d) user-stated `CPUCredits unlimited` (user-wins). Variant (b)
      currently FAILs against HEAD; Wave 2 e98.W2.R2 must flip it to
      PASS.
    must_fail_pre_fix: false
    variations:
      - cmd: 'plan "Create an EC2 t3.micro instance" --json'
        assertions: "t3.micro: CreditSpecification.CPUCredits == 'standard' (plugin default)"
      - cmd: 'plan "Create an EC2 instance t3.large with 100GB gp3 volume" --json'
        assertions: "t3.large + volume: CreditSpecification.CPUCredits == 'standard' (NOT empty {})"
      - cmd: 'plan "Create a t3.medium EC2 instance" --json'
        assertions: "t3.medium: CreditSpecification survives sanitizer with CPUCredits set"
      - cmd: 'plan "Create a t3.small EC2 instance with CPUCredits unlimited" --json'
        assertions: "user-stated CPUCredits unlimited wins over plugin default"
    # e98.W2.R2 removed the `result[key] !== undefined` tripwire after
    # landing `isEmptyLeaf` + deep-merge backfill in merge.ts. The
    # invariant is now enforced by the `w2-r2-plugin-default-empty-leaf`
    # probe below plus merge-empty-leaf.test.ts.
    known_tripwires: []
    probe: |
      # Runs a plain EC2 t3.micro plan and asserts the sanitised
      # desiredState carries a non-empty CreditSpecification with the
      # canonical `CPUCredits` key. Both the presence AND the casing
      # must survive — a fix that keeps the old casing would leave
      # CreditSpecification empty after sanitize and re-trip this probe.
      stdout="$($PROBE_CLI_BIN plan "Create an EC2 t3.micro instance" --output json 2>/dev/null || true)"
      envelope="$(printf '%s' "$stdout" | awk '/^\{/{block=$0; capture=1; next} capture{block=block"\n"$0} END{print block}')"
