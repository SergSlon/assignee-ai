  - story: e98.W4.B2
    name: bp-sns-004-no-fire-on-plain-topic
    description: |
      e98.W4.B2 — BP-SNS-004 CRITICAL MISLABELED closure (no-fire
      baseline / false-positive catcher). Before the fix, the rule
      was `check_type: awareness` on `AWS::SNS::Topic` and fired
      on every SNS topic plan regardless of whether the inline
      TopicPolicy granted public access — the highest trust-
      eroding rule in the catalogue. Fix migrates BP-SNS-004 to
      `check_type: policy_antipattern` with new expected_value
      `wildcard-principal-no-condition` (see
      `packages/best-practices/src/policy-inspector.ts`).
      resource_type stays `AWS::SNS::Topic` and property_path
      stays `TopicPolicy` — the inline TopicPolicy field IS the
      policy document, and targeting the standalone
      `AWS::SNS::TopicPolicy` resource would make the rule
      unreachable on today's plan output (that type is not first-
      class in `packages/core/src/config/resource-types/supported.ts`
      yet). Condition-guarded wildcards (canonical cross-account
      trust shape: `Principal:"*"` + `Condition.StringEquals."aws:SourceAccount"`
      or `Condition.ArnEquals."aws:SourceArn"`) are intentionally
      NOT flagged. Unit coverage in the scope test
      `packages/best-practices/__tests__/bp-sns-004-scope.test.ts`
      exercises the fire + no-fire + mixed-doc branches against
      real-shaped TopicPolicy documents; this probe locks the
      runtime plan-time no-fire behaviour.

      DEFERRED (Epic 99 backlog): once `AWS::SNS::TopicPolicy`
      reaches `supported.ts` as a first-class promoted type, add a
      companion fire-probe that creates an SNS topic with a
      wildcard-Principal inline TopicPolicy and asserts
      `assert_bp_finding_id_present BP-SNS-004`. Today the CLI
      does not emit wildcard-Principal TopicPolicy content on any
      supported plan surface, so the fire-path has no CLI probe
      surface. Reviewer-accepted concession for W4.B2.
    must_fail_pre_fix: false
    variations:
      - cmd: 'plan "Create an SNS topic named notifications" --json'
        assertions: "BP-SNS-004 does NOT fire on a plain SNS topic (no public policy, no-fire baseline)"
      - cmd: 'plan "Create an SNS topic for order-events with KMS encryption" --json'
        assertions: "BP-SNS-004 does NOT fire on an encrypted SNS topic"
      - cmd: 'plan "Create an SNS topic for internal service alerts" --json'
        assertions: "BP-SNS-004 does NOT fire on an internal SNS topic"
    known_tripwires: []
    probe: |
      assert_no_bp_finding_id BP-SNS-004 \
        $PROBE_CLI_BIN plan \
          "Create an SNS topic named notifications" \
          --json

  - story: e98.W4.B4
    name: bp-s3-011-no-fire-on-plain-bucket
    description: |
      e98.W4.B4 — BP-S3-011 HIGH MISLABELED closure (no-fire baseline
      / false-positive catcher). Before the fix, BP-S3-011 was
      `check_type: awareness` and surfaced on every S3 bucket plan
      regardless of whether the bucket's policy actually enforced
      SSL-only access. Fix migrates BP-S3-011 to
      `resource_type: AWS::S3::BucketPolicy`, `check_type:
      policy_antipattern`, `expected_value:
      missing-secure-transport-deny` — a new ABSENCE-semantics
      antipattern that fires when the BucketPolicy document does not
      contain a Deny statement matching the canonical
      `Condition.Bool["aws:SecureTransport"] = "false"` shape.
      Implementation in src/policy-inspector.ts + rule-runner routing
      via `isAbsenceAntipattern`. A plain S3 bucket plan that does not
      emit a separate BucketPolicy resource must NOT surface the rule
      at plan-time (the rule applies only when an AWS::S3::BucketPolicy
      resource is present).

      DEFERRED (Epic 99 backlog): once the CLI's plan generator can
      emit AWS::S3::BucketPolicy alongside AWS::S3::Bucket for intents
      that imply "public bucket" or "bucket with policy", add a
      companion fire-probe asserting
      `assert_bp_finding_id_present BP-S3-011` when the emitted
      BucketPolicy PolicyDocument lacks a Deny-non-SSL statement.
      Today the CLI doesn't emit separate BucketPolicy resources on
      plan, so the fire-path has no CLI probe surface — absence /
      fire branches are exhaustively covered by unit tests in
      `packages/best-practices/__tests__/bp-s3-011-scope.test.ts`
      and `packages/best-practices/src/policy-inspector.test.ts`
      (`describe("missing-secure-transport-deny (Epic 98 W4.B4)")`).
    must_fail_pre_fix: false
    variations:
      - cmd: 'plan "Create an S3 bucket named logs-archive" --json'
        assertions: "BP-S3-011 does NOT fire on a plain S3 bucket with no BucketPolicy resource (no-fire baseline)"
      - cmd: 'plan "Create an S3 bucket named app-data with versioning enabled" --json'
        assertions: "BP-S3-011 does NOT fire on a versioned S3 bucket (still no BucketPolicy resource)"
      - cmd: 'plan "Create an encrypted S3 bucket for backups" --json'
        assertions: "BP-S3-011 does NOT fire on an encrypted backup bucket"
    known_tripwires: []
    probe: |
      assert_no_bp_finding_id BP-S3-011 \
        $PROBE_CLI_BIN plan \
          "Create an S3 bucket named logs-archive" \
          --json

  - story: e98.W5.N1
    name: apply-envelope-arn-vs-primary-identifier
    description: |
      e98.W5.N1 (Epic 97 A-01 + B-01 HIGH × 2): the apply JSON
      envelope's `arn` field shipped a bare CCAPI primary identifier
      for Lambda (compound) and for non-taggable CFN constructs
      (AWS::EC2::Route / AWS::EC2::SubnetRouteTableAssociation /
      AWS::EC2::VPCGatewayAttachment), while S3 / DDB / SNS / SQS
      returned a proper `arn:aws:...` form. Automation piping
      `jq .arn | xargs destroy` broke on the bare-identifier types.

      Fix: `buildApplyEnvelopeArn(resourceType, identifier)` — the
      single chokepoint both the CLI orchestrator (apps/cli/src/
      commands/apply/orchestrator.ts) and the MCP apply-plan
      `shapeTerminalState` (apps/mcp-server/src/tools/apply-plan/
      graph-executor.ts) call to project the terminal state into
      the envelope. Non-taggable types → `arn: null` +
      `primaryIdentifier: "<bare id>"`. ARN-addressable types →
      full ARN synthesised via resolveResourceArn (with bare-ident
      fallback when STS is unavailable, for CI-safety).

      Probe exercises the compiled core helper directly — hermetic,
      no live AWS, no STS:
        - Non-taggable variations (Route / SRTA / VPCGW) hit the
          `isNonTaggableConstruct` classifier short-circuit
          BEFORE resolveResourceArn is invoked, so no STS lookup
          is attempted at all.
        - ARN-addressable variations (Lambda, DDB) feed in inputs
          that are ALREADY ARNs, so resolveResourceArn's `isArn()`
          short-circuit returns the identifier unchanged and STS
          is skipped.
      Five variations cover Lambda (A-01 closure), Route + SRTA +
      VPCGW (B-01 closure family), plus DDB as regression baseline
      guarding against the new branching accidentally nulling ARNs
      for types that already worked pre-fix.
    must_fail_pre_fix: false
    variations:
      - cmd: 'buildApplyEnvelopeArn(Lambda, arn:aws:lambda:...:function:dogfood-e97-a-fn-1776953643) → full ARN preserved, primaryIdentifier null'
        assertions: "A-01 Lambda closure — envelope.arn is arn:aws:lambda:..., primaryIdentifier omitted"
      - cmd: 'buildApplyEnvelopeArn(AWS::EC2::Route, rtb-016d13dcc6076462d|0.0.0.0/0) → arn:null + primaryIdentifier rtb|cidr'
        assertions: "B-01 Route closure — non-taggable short-circuit, no STS contact, primaryIdentifier carries bare id"
      - cmd: 'buildApplyEnvelopeArn(AWS::EC2::SubnetRouteTableAssociation, rtbassoc-0b2bb97aacd090704) → arn:null + primaryIdentifier rtbassoc-XXX'
        assertions: "B-01 SRTA closure — non-taggable passthrough"
      - cmd: 'buildApplyEnvelopeArn(AWS::EC2::VPCGatewayAttachment, igw-0abc12345|vpc-0def67890) → arn:null + primaryIdentifier igw|vpc'
        assertions: "B-01 VPCGatewayAttachment closure — non-taggable passthrough with pipe-delimited composite id"
      - cmd: 'buildApplyEnvelopeArn(AWS::DynamoDB::Table, arn:aws:dynamodb:...:table/dogfood-e97-a-ddb-1776953700) → full ARN preserved'
        assertions: "Regression baseline — ARN-addressable types still return full ARN in envelope.arn with primaryIdentifier null (guard against the non-taggable branching accidentally nulling ARNs for already-working types)"
    known_tripwires: []
    probe: |
      # Library-level probe: exercise the compiled core helper
      # (packages/core/dist/graph/nodes/result-formatter/envelope-arn.js)
      # via a node harness. Hermetic — no real AWS creds, no network:
      #   - Non-taggable constructs (Route/SRTA/VPCGW) don't go
      #     through resolveResourceArn at all — the helper
      #     short-circuits on the isNonTaggableConstruct classifier.
      #   - ARN-addressable types (Lambda/DDB) are fed with inputs
      #     that are ALREADY full ARNs, so resolveResourceArn's
      #     `isArn()` short-circuit fires before STS is contacted.
      # This validates the projection semantics without needing
      # live AWS creds or STS mocking.
      output="$(node -e "
        const repo = process.env.PROBE_REPO_ROOT;
        (async () => {
          const mod = await import(repo + '/packages/core/dist/graph/nodes/result-formatter/envelope-arn.js');
          const results = {
            lambda: await mod.buildApplyEnvelopeArn(
              'AWS::Lambda::Function',
              'arn:aws:lambda:us-east-1:210987654321:function:dogfood-e97-a-fn-1776953643',
            ),
            route: await mod.buildApplyEnvelopeArn(
              'AWS::EC2::Route',
              'rtb-016d13dcc6076462d|0.0.0.0/0',
            ),
            srta: await mod.buildApplyEnvelopeArn(
              'AWS::EC2::SubnetRouteTableAssociation',
              'rtbassoc-0b2bb97aacd090704',
            ),
            vpcgw: await mod.buildApplyEnvelopeArn(
              'AWS::EC2::VPCGatewayAttachment',
              'igw-0abc12345|vpc-0def67890',
            ),
            ddb: await mod.buildApplyEnvelopeArn(
              'AWS::DynamoDB::Table',
              'arn:aws:dynamodb:us-east-1:210987654321:table/dogfood-e97-a-ddb-1776953700',
            ),
          };
          process.stdout.write(JSON.stringify(results));
        })().catch(err => { console.error(err.message); process.exit(1); });
      ")"

      # Variation 1: Lambda — full function ARN preserved verbatim
      # via the isArn() short-circuit. A-01 closure: envelope.arn
      # is the full ARN, primaryIdentifier is null (not the other
      # way around — that's the bug we just fixed).
      if ! printf '%s' "$output" | jq -e '
        .lambda.arn == "arn:aws:lambda:us-east-1:210987654321:function:dogfood-e97-a-fn-1776953643"
        and .lambda.primaryIdentifier == null
      ' >/dev/null 2>&1; then
        echo "[PROBE-FAIL] Lambda envelope projection wrong (variation 1 / A-01)" >&2
        printf '%s' "$output" | jq '.lambda' >&2 || echo "$output" >&2
        exit 1
      fi

      # Variation 2: Route — arn:null + primaryIdentifier rtb|cidr.
      # The isNonTaggableConstruct classifier short-circuits BEFORE
      # resolveResourceArn. Non-taggable means AWS has no standalone
      # ARN; primaryIdentifier carries the bare CCAPI id that W1.B1
      # destroy-path resolution keys on.
      if ! printf '%s' "$output" | jq -e '
        .route.arn == null
        and .route.primaryIdentifier == "rtb-016d13dcc6076462d|0.0.0.0/0"
      ' >/dev/null 2>&1; then
        echo "[PROBE-FAIL] Route envelope projection wrong (variation 2 / B-01)" >&2
        printf '%s' "$output" | jq '.route' >&2
        exit 1
      fi

      # Variation 3: SRTA — arn:null + primaryIdentifier rtbassoc-XXX.
      if ! printf '%s' "$output" | jq -e '
        .srta.arn == null
        and .srta.primaryIdentifier == "rtbassoc-0b2bb97aacd090704"
      ' >/dev/null 2>&1; then
        echo "[PROBE-FAIL] SRTA envelope projection wrong (variation 3 / B-01)" >&2
        printf '%s' "$output" | jq '.srta' >&2
        exit 1
      fi

      # Variation 4: VPCGatewayAttachment — arn:null + primaryIdentifier
      # with pipe-delimited composite id (igw-<id>|vpc-<id>).
      if ! printf '%s' "$output" | jq -e '
        .vpcgw.arn == null
        and .vpcgw.primaryIdentifier == "igw-0abc12345|vpc-0def67890"
      ' >/dev/null 2>&1; then
        echo "[PROBE-FAIL] VPCGatewayAttachment envelope projection wrong (variation 4 / B-01)" >&2
        printf '%s' "$output" | jq '.vpcgw' >&2
        exit 1
      fi

      # Variation 5: DDB regression baseline. ARN-addressable types
      # must still return full ARN in envelope.arn with
      # primaryIdentifier null. Guards against the new non-taggable
      # branching accidentally nulling ARNs for the
      # already-working S3 / DDB / SNS / SQS / VPC / Subnet / SG
      # class. Uses an already-ARN input to avoid STS in the probe.
      if ! printf '%s' "$output" | jq -e '
        .ddb.arn == "arn:aws:dynamodb:us-east-1:210987654321:table/dogfood-e97-a-ddb-1776953700"
        and .ddb.primaryIdentifier == null
      ' >/dev/null 2>&1; then
        echo "[PROBE-FAIL] DDB regression baseline broken (variation 5)" >&2
        printf '%s' "$output" | jq '.ddb' >&2
        exit 1
      fi
  - story: e98.W4.B4
    name: bp-s3-011-no-fire-on-plain-bucket
    description: |
      e98.W4.B4 — BP-S3-011 HIGH MISLABELED closure (no-fire baseline
      / false-positive catcher). Before the fix, BP-S3-011 was
      `check_type: awareness` and surfaced on every S3 bucket plan
      regardless of whether the bucket's policy actually enforced
      SSL-only access. Fix migrates BP-S3-011 to
      `resource_type: AWS::S3::BucketPolicy`, `check_type:
      policy_antipattern`, `expected_value:
      missing-secure-transport-deny` — a new ABSENCE-semantics
      antipattern that fires when the BucketPolicy document does not
      contain a Deny statement matching the canonical
      `Condition.Bool["aws:SecureTransport"] = "false"` shape.
      Implementation in src/policy-inspector.ts + rule-runner routing
      via `isAbsenceAntipattern`. A plain S3 bucket plan that does not
      emit a separate BucketPolicy resource must NOT surface the rule
      at plan-time (the rule applies only when an AWS::S3::BucketPolicy
      resource is present).

      DEFERRED (Epic 99 backlog): once the CLI's plan generator can
      emit AWS::S3::BucketPolicy alongside AWS::S3::Bucket for intents
      that imply "public bucket" or "bucket with policy", add a
      companion fire-probe asserting
      `assert_bp_finding_id_present BP-S3-011` when the emitted
      BucketPolicy PolicyDocument lacks a Deny-non-SSL statement.
      Today the CLI doesn't emit separate BucketPolicy resources on
      plan, so the fire-path has no CLI probe surface — absence /
      fire branches are exhaustively covered by unit tests in
      `packages/best-practices/__tests__/bp-s3-011-scope.test.ts`
      and `packages/best-practices/src/policy-inspector.test.ts`
      (`describe("missing-secure-transport-deny (Epic 98 W4.B4)")`).
    must_fail_pre_fix: false
    variations:
      - cmd: 'plan "Create an S3 bucket named logs-archive" --json'
        assertions: "BP-S3-011 does NOT fire on a plain S3 bucket with no BucketPolicy resource (no-fire baseline)"
      - cmd: 'plan "Create an S3 bucket named app-data with versioning enabled" --json'
        assertions: "BP-S3-011 does NOT fire on a versioned S3 bucket (still no BucketPolicy resource)"
      - cmd: 'plan "Create an encrypted S3 bucket for backups" --json'
        assertions: "BP-S3-011 does NOT fire on an encrypted backup bucket"
    known_tripwires: []
    probe: |
      assert_no_bp_finding_id BP-S3-011 \
        $PROBE_CLI_BIN plan \
          "Create an S3 bucket named logs-archive" \
          --json
  - story: e98.W3.A1
    name: w3-a1-plugin-default-survival
    description: |
      Epic 98 Wave 3 A1 — `mergePluginDefaults` allowlist expansion
      from EC2_INSTANCE-only to 11 additional plugins (SNS, SQS,
      EC2::Route, EC2::NatGateway, ELBv2, RDS, ECS, ECR, EFS,
      APIGatewayV2, CloudFront). Every plugin on the expanded list
      must backfill its own defaults onto a bare LLM output so the
      plan ships the same security/compliance values every run
      regardless of LLM drift.

      The probe loads the compiled merge module directly and asserts
      each plugin restores its canonical default key(s) both on a
      bare `{}` input and on the C-R1 empty-leaf shapes
      (`{}` / `null` / `""`). This is the architectural W3 story
      that closes A-04, A-05, B-15, C-N1.
    must_fail_pre_fix: false
    variations:
      - cmd: 'mergePluginDefaults({}, SNS_TOPIC) → KmsMasterKeyId=alias/aws/sns'
        assertions: "SNS plugin backfills KmsMasterKeyId secure default (BP-SNS-001)"
      - cmd: 'mergePluginDefaults({}, SQS_QUEUE) → SqsManagedSseEnabled=true, VisibilityTimeout=30'
        assertions: "SQS backfills managed SSE + default visibility timeout"
      - cmd: 'mergePluginDefaults({}, RDS_DB_INSTANCE) → StorageEncrypted=true'
        assertions: "RDS backfills StorageEncrypted (BP-RDS-002)"
      - cmd: 'mergePluginDefaults({}, ECR_REPOSITORY) → ScanOnPush=true, ImageTagMutability=IMMUTABLE'
        assertions: "ECR backfills ScanOnPush + IMMUTABLE tags (BP-ECR-001/002)"
      - cmd: 'mergePluginDefaults({}, EFS_FILE_SYSTEM) → Encrypted=true, BackupPolicy.Status=ENABLED'
        assertions: "EFS backfills encryption + backup defaults (BP-EFS-001)"
      - cmd: 'mergePluginDefaults({}, ECS_CLUSTER) → ClusterSettings includes containerInsights'
        assertions: "ECS backfills containerInsights + FARGATE capacity provider"
      - cmd: 'mergePluginDefaults({}, ELBV2_LOAD_BALANCER) → Type=application, Scheme=internet-facing'
        assertions: "ELBv2 backfills LB type/scheme/IP defaults"
      - cmd: 'mergePluginDefaults({}, EC2_ROUTE) → DestinationCidrBlock=0.0.0.0/0'
        assertions: "EC2::Route backfills public-internet destination"
      - cmd: 'mergePluginDefaults({}, EC2_NAT_GATEWAY) → ConnectivityType=public'
        assertions: "NatGateway backfills ConnectivityType=public"
      - cmd: 'mergePluginDefaults({}, APIGATEWAYV2_API) → ProtocolType=HTTP'
        assertions: "APIGatewayV2 backfills ProtocolType=HTTP"
      - cmd: 'mergePluginDefaults({PublicAccessBlockConfiguration:{}}, S3_BUCKET) = unchanged'
        assertions: "S3 stays off the allowlist — BP-S3-001 must remain the safety net"
      - cmd: 'mergePluginDefaults({KmsMasterKeyId: null}, SNS_TOPIC) → default restored'
        assertions: "empty-leaf (null) restoration per W2.R2 invariant"
    known_tripwires: []
    probe: |
      node -e '
        const repo = process.env.PROBE_REPO_ROOT;
        Promise.all([
          import(repo + "/packages/core/dist/graph/nodes/plan-generator/llm-plan/merge.js"),
          import(repo + "/packages/core/dist/config/resource-types/named.js"),
          import(repo + "/packages/core/dist/resource-plugins/index.js"),
        ]).then(([merge, rt, rp]) => {
          const R = rt.RESOURCE_TYPES;
          const reg = rp.defaultPluginRegistry;

          const expect = (label, got, pred) => {
            if (!pred(got)) {
              console.error(
                "[PROBE-FAIL] " + label + " got " + JSON.stringify(got)
              );
              process.exit(1);
            }
          };

          // Variation 1 — SNS KmsMasterKeyId.
          const sns = merge.mergePluginDefaults({}, R.SNS_TOPIC);
          expect("SNS KmsMasterKeyId", sns.KmsMasterKeyId, (v) => v === "alias/aws/sns");

          // Variation 2 — SQS backfill.
          const sqs = merge.mergePluginDefaults({}, R.SQS_QUEUE);
          expect("SQS SqsManagedSseEnabled", sqs.SqsManagedSseEnabled, (v) => v === true);
          expect("SQS VisibilityTimeout", sqs.VisibilityTimeout, (v) => v === 30);

          // Variation 3 — RDS StorageEncrypted.
          const rds = merge.mergePluginDefaults({}, R.RDS_DB_INSTANCE);
          expect("RDS StorageEncrypted", rds.StorageEncrypted, (v) => v === true);

          // Variation 4 — ECR scanning + immutability.
          const ecr = merge.mergePluginDefaults({}, R.ECR_REPOSITORY);
          expect("ECR ImageTagMutability", ecr.ImageTagMutability, (v) => v === "IMMUTABLE");
          expect(
            "ECR ScanOnPush",
            ecr.ImageScanningConfiguration && ecr.ImageScanningConfiguration.ScanOnPush,
            (v) => v === true
          );

          // Variation 5 — EFS encryption + backup.
          const efs = merge.mergePluginDefaults({}, R.EFS_FILE_SYSTEM);
          expect("EFS Encrypted", efs.Encrypted, (v) => v === true);
          expect(
            "EFS BackupPolicy.Status",
            efs.BackupPolicy && efs.BackupPolicy.Status,
            (v) => v === "ENABLED"
          );

          // Variation 6 — ECS containerInsights + FARGATE.
          const ecs = merge.mergePluginDefaults({}, R.ECS_CLUSTER);
          expect(
            "ECS ClusterSettings containerInsights",
            ecs.ClusterSettings,
            (v) =>
              Array.isArray(v) &&
              v.some((s) => s && s.Name === "containerInsights" && s.Value === "enabled")
          );
          expect(
            "ECS CapacityProviders includes FARGATE",
            ecs.CapacityProviders,
            (v) => Array.isArray(v) && v.includes("FARGATE")
          );

          // Variation 7 — ELBv2 type/scheme/ip.
          const elb = merge.mergePluginDefaults({}, R.ELBV2_LOAD_BALANCER);
          expect("ELBv2 Type", elb.Type, (v) => v === "application");
          expect("ELBv2 Scheme", elb.Scheme, (v) => v === "internet-facing");
          expect("ELBv2 IpAddressType", elb.IpAddressType, (v) => v === "ipv4");

          // Variation 8 — EC2::Route destination.
          const route = merge.mergePluginDefaults({}, R.EC2_ROUTE);
          expect("EC2::Route DestinationCidrBlock", route.DestinationCidrBlock, (v) => v === "0.0.0.0/0");

          // Variation 9 — NatGateway connectivity.
          const nat = merge.mergePluginDefaults({}, R.EC2_NAT_GATEWAY);
          expect("NatGateway ConnectivityType", nat.ConnectivityType, (v) => v === "public");

          // Variation 10 — APIGatewayV2 protocol.
          const apigw = merge.mergePluginDefaults({}, R.APIGATEWAYV2_API);
          expect("APIGWv2 ProtocolType", apigw.ProtocolType, (v) => v === "HTTP");

          // Variation 11 — S3 exclusion (safety net).
          const s3 = merge.mergePluginDefaults({ BucketName: "my-bucket" }, R.S3_BUCKET);
          expect(
            "S3 stays off allowlist (no PublicAccessBlockConfiguration backfill)",
            s3.PublicAccessBlockConfiguration,
            (v) => v === undefined
          );

          // Variation 12 — empty-leaf restoration (W2.R2 invariant propagated).
          const snsLeaf = merge.mergePluginDefaults(
            { KmsMasterKeyId: null },
            R.SNS_TOPIC
          );
          expect(
            "SNS KmsMasterKeyId restored after null leaf",
            snsLeaf.KmsMasterKeyId,
            (v) => v === "alias/aws/sns"
          );

          // Drift-guard: ensure plugin registry still exposes every
          // type we cited — a silent plugin removal would let the
          // probe pass vacuously otherwise.
          for (const name of [
            "SNS_TOPIC",
            "SQS_QUEUE",
            "RDS_DB_INSTANCE",
            "ECR_REPOSITORY",
            "EFS_FILE_SYSTEM",
            "ECS_CLUSTER",
            "ELBV2_LOAD_BALANCER",
            "EC2_ROUTE",
            "EC2_NAT_GATEWAY",
            "APIGATEWAYV2_API",
          ]) {
            if (!reg.get(R[name])) {
              console.error("[PROBE-FAIL] plugin missing: " + name);
              process.exit(1);
            }
          }
        })
        .catch(err => { console.error("[PROBE-FAIL] " + err.message); process.exit(1); });
      '
  - story: e98.W5.N2
    name: w5-n2-intent-silent-override
    description: |
      Epic 98 Wave 5 N2 — intent silent-override suite. Closes Epic 97
      D-13 (HIGH SNS Subscription Protocol inference) + D-17 (HIGH
      CloudWatch Alarm metric inference) + C-P4 (LOW RDS phrasing —
      closed implicitly by W3.A1).

      Three user-visible behaviours changed:
        1. SNS Subscription: E.164 phone (`+15551234567`) now classifies
           as Protocol=sms; Lambda / Firehose ARNs classify as their own
           Protocol values. The unsafe `sqs` plugin default was removed
           so elicitation fires when inference can't determine a safe
           value rather than silently dispatching to the wrong consumer.
        2. CloudWatch Alarm: service-keyword phrases ("s3 bucket-size",
           "sqs dlq depth", "lambda errors", "rds cpu", etc.) infer
           `(Namespace, MetricName)` into the plan instead of falling
           through to the plugin's AWS/EC2 + CPUUtilization initialValues.
        3. CW Alarm Namespace enum grew to 8 options (+ AWS/S3,
           + AWS/DynamoDB) so the intent-parser inference has valid
           targets.

      Probe loads compiled intent-parser directly and asserts each of
      the 5 dispatch-brief variations + extra coverage. Hermetic — no
      CLI spawn, no STS required.
    must_fail_pre_fix: false
    variations:
      - cmd: 'extractAssertedValues("SNS subscription to +15551234567", SNS_SUBSCRIPTION) → Protocol=sms'
        assertions: "D-13: E.164 phone → Protocol=sms, Endpoint compacted"
      - cmd: 'extractAssertedValues("SNS to arn:aws:lambda:us-east-1:210987654321:function:x", SNS_SUBSCRIPTION) → Protocol=lambda'
        assertions: "D-13: Lambda ARN → Protocol=lambda (retrofit lock)"
      - cmd: 'extractAssertedValues("Create an SNS subscription", SNS_SUBSCRIPTION) → Protocol unset'
        assertions: "D-13: ambiguous intent leaves Protocol unset — elicitation path owned"
      - cmd: 'extractAssertedValues("alarm on S3 bucket size", CLOUDWATCH_ALARM) → AWS/S3 + BucketSizeBytes'
        assertions: "D-17: S3 bucket-size keyword → correct namespace + metric"
      - cmd: 'extractAssertedValues("alarm on SQS DLQ depth", CLOUDWATCH_ALARM) → AWS/SQS + ApproximateNumberOfMessagesVisible'
        assertions: "D-17: SQS DLQ keyword → canonical DLQ-depth metric"
    known_tripwires: []
    probe: |
      node -e '
        const repo = process.env.PROBE_REPO_ROOT;
        Promise.all([
          import(repo + "/packages/core/dist/graph/nodes/intent-parser.js"),
          import(repo + "/packages/core/dist/config/resource-types/named.js"),
        ]).then(([ip, rt]) => {
          const R = rt.RESOURCE_TYPES;
          const expect = (label, got, pred) => {
            if (!pred(got)) {
              console.error(
                "[PROBE-FAIL] " + label + " got " + JSON.stringify(got)
              );
              process.exit(1);
            }
          };

          // D-13 Variation 1 — E.164 phone → sms.
          const sms = ip.extractAssertedValues(
            "SNS subscription to +15551234567 for alerts",
            R.SNS_SUBSCRIPTION
          );
          expect("SMS Protocol", sms.elicited.Protocol, (v) => v === "sms");
          expect("SMS Endpoint", sms.elicited.Endpoint, (v) => v === "+15551234567");

          // D-13 Variation 2 — Lambda ARN → lambda.
          const lambda = ip.extractAssertedValues(
            "SNS subscription to arn:aws:lambda:us-east-1:210987654321:function:my-fn",
            R.SNS_SUBSCRIPTION
          );
          expect("Lambda Protocol", lambda.elicited.Protocol, (v) => v === "lambda");

          // D-13 Variation 3 — ambiguous intent.
          const ambiguous = ip.extractAssertedValues(
            "Create an SNS subscription",
            R.SNS_SUBSCRIPTION
          );
          expect("Ambiguous Protocol unset", ambiguous.elicited.Protocol, (v) => v === undefined);

          // D-17 Variation 4 — S3 bucket size.
          const s3 = ip.extractAssertedValues(
            "Create an alarm on S3 bucket size over 10GB",
            R.CLOUDWATCH_ALARM
          );
          expect("S3 Namespace", s3.elicited.Namespace, (v) => v === "AWS/S3");
          expect("S3 MetricName", s3.elicited.MetricName, (v) => v === "BucketSizeBytes");

          // D-17 Variation 5 — SQS DLQ depth.
          const dlq = ip.extractAssertedValues(
            "Create an alarm on SQS DLQ depth greater than 0",
            R.CLOUDWATCH_ALARM
          );
          expect("SQS DLQ Namespace", dlq.elicited.Namespace, (v) => v === "AWS/SQS");
          expect(
            "SQS DLQ MetricName",
            dlq.elicited.MetricName,
            (v) => v === "ApproximateNumberOfMessagesVisible"
          );

          // Negative — bare CW intent leaves both fields unset.
          const bare = ip.extractAssertedValues(
            "Create a CloudWatch alarm",
            R.CLOUDWATCH_ALARM
          );
          expect("Bare CW Namespace unset", bare.elicited.Namespace, (v) => v === undefined);
          expect("Bare CW MetricName unset", bare.elicited.MetricName, (v) => v === undefined);
        })
        .catch(err => { console.error("[PROBE-FAIL] " + err.message); process.exit(1); });
      '
