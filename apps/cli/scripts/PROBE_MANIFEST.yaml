      stdout="$($PROBE_CLI_BIN plan "Create an EC2 instance t3.large with 100GB gp3 volume" --output json 2>/dev/null || true)"
      envelope="$(printf '%s' "$stdout" | awk '/^\{/{block=$0; capture=1; next} capture{block=block"\n"$0} END{print block}')"
      if [[ -z "$envelope" ]] || ! printf '%s' "$envelope" | jq . >/dev/null 2>&1; then
        echo "[PROBE-FAIL] no JSON envelope on stdout" >&2
        exit 1
