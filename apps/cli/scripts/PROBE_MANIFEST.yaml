  - story: e96.W3.N3
    name: efs-bare-intent-singleton
    description: |
      A bare "Create an EFS file system" intent must route to the
      single AWS::EFS::FileSystem resource, NOT the 10-resource
      efs-with-vpc compound. Pre-fix the pattern's keyword list
      matched "efs file system" → `efs-with-vpc`, which spun up a
      whole VPC + 2 subnets + route table + 2 associations + NFS SG +
      2 mount targets on top of the single resource the user asked
      for. Fixed in Epic 96 W3.N3 by adding a singleton-override cue
      in `packages/core/src/intent/compound-keywords.ts` for EFS file
      system / filesystem / FS that is disqualified by VPC-bearing
      qualifiers (with VPC, with a new VPC, and VPC, in a VPC, in new
      VPC, etc.). Closes Epic 95 C-02 MED NEW.
    must_fail_pre_fix: false
    variations:
      - cmd: 'plan "Create an EFS file system" --json'
        assertions: "bare EFS intent → exactly 1 plan, resourceType AWS::EFS::FileSystem"
      - cmd: 'plan "Create an EFS filesystem" --json'
        assertions: "single-word 'filesystem' phrasing routes to singleton"
      - cmd: 'plan "Create an EFS FS" --json'
        assertions: "abbreviated 'FS' phrasing routes to singleton (no compound spillover)"
    known_tripwires: []
    probe: |
      # Assert bare intent produces exactly 1 plan with resourceType
      # AWS::EFS::FileSystem. The CLI may emit a top-level `plan`
      # (single) or `plans` (array). Pre-fix the intent goes through
      # the compound path, which emits 10 plans under `.plans` — the
      # jq expression below fails clean in that case.
      stdout="$($PROBE_CLI_BIN plan "Create an EFS file system" --json 2>/dev/null || true)"
      envelope="$(printf '%s' "$stdout" | awk '/^\{/{block=$0; capture=1; next} capture{block=block"\n"$0} END{print block}')"
      if [[ -z "$envelope" ]] || ! printf '%s' "$envelope" | jq . >/dev/null 2>&1; then
        echo "[PROBE-FAIL] no JSON envelope on stdout" >&2
        exit 1
      fi
      # Count total plans across both envelope shapes (singleton path
      # uses .plan; compound path uses .plans[]). Expect exactly 1.
      count="$(printf '%s' "$envelope" | jq -r '
        ([.plan? | select(. != null)] + (.plans // [])) | length')"
      if [[ "$count" -ne 1 ]]; then
        echo "[PROBE-FAIL] bare EFS intent emitted $count plans; expected 1" >&2
        exit 1
      fi
      # That 1 plan must be the EFS::FileSystem singleton.
      if ! printf '%s' "$envelope" | jq -e \
        '[.plan?.resourceType, (.plans // [])[]?.resourceType]
          | map(select(. != null))
          | any(. == "AWS::EFS::FileSystem")' \
        >/dev/null 2>&1; then
        echo "[PROBE-FAIL] bare EFS intent did not route to AWS::EFS::FileSystem singleton" >&2
        exit 1
      fi

